  <rect x="218" y="438" width="175" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="305" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">524,288</text>
