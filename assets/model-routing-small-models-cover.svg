<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가운데 라우터 노드가 들어오는 요청들을 세 갈래로 나눠 Haiku, Sonnet, Opus 세 모델 레인으로 보내는 구도의 표지. 각 레인에 토큰 단가가 적혀 있고, 아래에 '모든 요청이 같은 모델을 쓸 이유는 없다'는 문구가 있다.">
  <defs>
    <linearGradient id="mrbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2b"/>
      <stop offset="1" stop-color="#1c2135"/>
    </linearGradient>
    <marker id="mrc-sky" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="mrc-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4ade80"/>
    </marker>
    <marker id="mrc-amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#fbbf24"/>
    </marker>
    <marker id="mrc-rose" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#mrbg)"/>

  <text x="600" y="92" text-anchor="middle" font-size="44" font-weight="800" fill="#e2e8f0" font-family="sans-serif">모델 라우팅 · 캐스케이드 엔지니어링</text>
  <text x="600" y="138" text-anchor="middle" font-size="22" fill="#94a3b8" font-family="sans-serif">40배 싼 모델은 언제 믿어도 될까 — Claude Haiku 5.5가 던진 질문</text>

  <!-- 들어오는 요청들 -->
  <g font-family="ui-monospace,monospace" font-size="17" fill="#cbd5e1">
    <rect x="70" y="240" width="180" height="46" rx="10" fill="#334155" opacity="0.55"/>
    <text x="160" y="269" text-anchor="middle">분류 요청</text>
    <rect x="70" y="310" width="180" height="46" rx="10" fill="#334155" opacity="0.55"/>
    <text x="160" y="339" text-anchor="middle">요약 요청</text>
    <rect x="70" y="380" width="180" height="46" rx="10" fill="#334155" opacity="0.55"/>
    <text x="160" y="409" text-anchor="middle">설계 요청</text>
  </g>

  <path d="M250 263 C310 263 330 330 390 332" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#mrc-sky)"/>
  <path d="M250 333 H390" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#mrc-sky)"/>
  <path d="M250 403 C310 403 330 336 390 334" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#mrc-sky)"/>

  <!-- 라우터 -->
  <rect x="400" y="282" width="190" height="100" rx="16" fill="#38bdf8" opacity="0.14"/>
  <rect x="400" y="282" width="190" height="100" rx="16" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="495" y="326" text-anchor="middle" font-size="24" font-weight="800" fill="#e2e8f0" font-family="sans-serif">라우터</text>
  <text x="495" y="356" text-anchor="middle" font-size="15" fill="#94a3b8" font-family="sans-serif">요청마다 알맞은 모델로</text>

  <path d="M590 310 C650 290 680 250 740 240" stroke="#4ade80" stroke-width="3" fill="none" marker-end="url(#mrc-green)"/>
  <path d="M590 332 H740" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#mrc-amber)"/>
  <path d="M590 354 C650 374 680 414 740 424" stroke="#fb7185" stroke-width="3" fill="none" marker-end="url(#mrc-rose)"/>

  <!-- 모델 레인 -->
  <g font-family="sans-serif">
    <rect x="750" y="206" width="380" height="68" rx="12" fill="#4ade80" opacity="0.12"/>
    <rect x="750" y="206" width="380" height="68" rx="12" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <text x="775" y="248" font-size="21" font-weight="700" fill="#e2e8f0">claude-haiku-5-5</text>
    <text x="1105" y="248" text-anchor="end" font-size="19" fill="#4ade80" font-family="ui-monospace,monospace">$0.10 / MTok</text>

    <rect x="750" y="298" width="380" height="68" rx="12" fill="#fbbf24" opacity="0.12"/>
    <rect x="750" y="298" width="380" height="68" rx="12" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="775" y="340" font-size="21" font-weight="700" fill="#e2e8f0">claude-sonnet-5-5</text>
    <text x="1105" y="340" text-anchor="end" font-size="19" fill="#fbbf24" font-family="ui-monospace,monospace">$2.00 / MTok</text>

    <rect x="750" y="390" width="380" height="68" rx="12" fill="#fb7185" opacity="0.12"/>
    <rect x="750" y="390" width="380" height="68" rx="12" fill="none" stroke="#fb7185" stroke-width="2.5"/>
    <text x="775" y="432" font-size="21" font-weight="700" fill="#e2e8f0">claude-opus-5-5</text>
    <text x="1105" y="432" text-anchor="end" font-size="19" fill="#fb7185" font-family="ui-monospace,monospace">$4.00 / MTok</text>
  </g>

  <text x="600" y="540" text-anchor="middle" font-size="26" font-weight="700" fill="#cbd5e1" font-family="sans-serif">모든 요청이 같은 모델을 쓸 이유는 없다</text>
  <text x="600" y="578" text-anchor="middle" font-size="18" fill="#64748b" font-family="sans-serif">정적 라우팅 · 캐스케이드 · 학습 라우터 · 오케스트레이터-워커, 네 가지 패턴</text>
</svg>
