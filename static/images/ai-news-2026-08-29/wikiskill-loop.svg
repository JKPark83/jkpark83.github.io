<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="420" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">WikiSkill — 경험을 위키로 모아 스킬을 진화시킨다</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">arXiv 2608.27454 (Google) — 세 층위를 분리한 스킬 진화 루프</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- loop boxes -->
  <rect x="60" y="110" width="200" height="70" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="160" y="140" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">실행 경험 (raw)</text>
  <text x="160" y="160" text-anchor="middle" fill="#cbd5e1" font-size="11">태스크 수행 중 얻은 시행착오</text>

  <rect x="300" y="110" width="200" height="70" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="400" y="140" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">위키 (지식 베이스)</text>
  <text x="400" y="160" text-anchor="middle" fill="#cbd5e1" font-size="11">경험을 지속적으로 통합·정제</text>

  <rect x="540" y="110" width="200" height="70" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="640" y="140" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">실행 가능한 스킬</text>
  <text x="640" y="160" text-anchor="middle" fill="#cbd5e1" font-size="11">위키 지식 위에서 갱신</text>

  <line x1="260" y1="145" x2="295" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="145" x2="535" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M640,180 C640,240 160,240 160,185" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="222" text-anchor="middle" fill="#94a3b8" font-size="11">스킬 장착 후 다시 실행 → 새 경험 축적</text>

  <!-- findings -->
  <rect x="60" y="265" width="215" height="110" rx="10" fill="#132030" stroke="#334155"/>
  <text x="167" y="290" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">모델 간 전이</text>
  <text x="167" y="315" text-anchor="middle" fill="#cbd5e1" font-size="11">진화한 스킬은 다른 모델·</text>
  <text x="167" y="333" text-anchor="middle" fill="#cbd5e1" font-size="11">모델 패밀리에서도 잘 작동.</text>
  <text x="167" y="357" text-anchor="middle" fill="#94a3b8" font-size="11">타 모델산 스킬이 더 낫기도 함</text>

  <rect x="292" y="265" width="215" height="110" rx="10" fill="#132030" stroke="#334155"/>
  <text x="399" y="290" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">스킬 vs 모델 크기</text>
  <text x="399" y="315" text-anchor="middle" fill="#cbd5e1" font-size="11">스킬을 가진 소형 모델이</text>
  <text x="399" y="333" text-anchor="middle" fill="#cbd5e1" font-size="11">스킬 없는 대형 모델을 능가 가능.</text>
  <text x="399" y="357" text-anchor="middle" fill="#94a3b8" font-size="11">대형일수록 스킬 이득도 커짐</text>

  <rect x="524" y="265" width="215" height="110" rx="10" fill="#132030" stroke="#334155"/>
  <text x="631" y="290" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">위키가 핵심</text>
  <text x="631" y="315" text-anchor="middle" fill="#cbd5e1" font-size="11">ablation 결과, 지속적 지식</text>
  <text x="631" y="333" text-anchor="middle" fill="#cbd5e1" font-size="11">축적을 빼면 스킬 진화 효과가</text>
  <text x="631" y="357" text-anchor="middle" fill="#94a3b8" font-size="11">크게 약화됨</text>
</svg>
