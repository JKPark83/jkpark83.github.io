<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="840" height="520" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">SoL-Pi — 자동 연구 루프가 찾아낸 4개 하네스 메커니즘</text>
  <text x="420" y="54" text-anchor="middle" font-size="12" fill="#6b7280">arXiv 2609.20519 · Pi 하네스 위 opt-in 확장 · 패치 없음, 공개 API만 사용</text>

  <!-- mechanism cards -->
  <rect x="40" y="80" width="380" height="120" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="56" y="106" font-size="13.5" font-weight="700" fill="#6d28d9">1. Action Fusion — 툴</text>
  <text x="56" y="130" font-size="12" fill="#111827">편집·쓰기 직후의 예측 가능한 검증 명령을</text>
  <text x="56" y="148" font-size="12" fill="#111827">같은 툴 호출 안에서 함께 실행</text>
  <text x="56" y="172" font-size="11.5" fill="#4b5563">→ "수정 → 턴 종료 → 테스트" 왕복 턴을 절약</text>

  <rect x="440" y="80" width="360" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="456" y="106" font-size="13.5" font-weight="700" fill="#1d4ed8">2. ObservationPack — 관찰</text>
  <text x="456" y="130" font-size="12" fill="#111827">반복 등장하는 큰 툴 결과를 안정된 핸들로 치환,</text>
  <text x="456" y="148" font-size="12" fill="#111827">필요할 때 정확한 페이지 단위로 재호출</text>
  <text x="456" y="172" font-size="11.5" fill="#4b5563">→ 같은 로그를 컨텍스트에 여러 번 싣지 않음</text>

  <rect x="40" y="220" width="380" height="120" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="56" y="246" font-size="13.5" font-weight="700" fill="#047857">3. Evidence-Preserving Reducer — 위임</text>
  <text x="56" y="270" font-size="12" fill="#111827">긴 진단 로그를 압축 '영수증'으로 축약하되,</text>
  <text x="56" y="288" font-size="12" fill="#111827">인용된 모든 문장이 원본과 일치할 때만 채택</text>
  <text x="56" y="312" font-size="11.5" fill="#4b5563">→ 실패하면 원본 유지 — 증거 유실 없는 요약</text>

  <rect x="440" y="220" width="360" height="120" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="456" y="246" font-size="13.5" font-weight="700" fill="#c2410c">4. Online Context Compact — 컨텍스트</text>
  <text x="456" y="270" font-size="12" fill="#111827">완료된 플랜 단계를 압축 후보로 삼고,</text>
  <text x="456" y="288" font-size="12" fill="#111827">경제성·윈도 압박 검사를 통과할 때만 압축</text>
  <text x="456" y="312" font-size="11.5" fill="#4b5563">→ 압축 성공 시 새 턴에서 작업 계속</text>

  <!-- results strip -->
  <rect x="40" y="360" width="760" height="130" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="56" y="386" font-size="13.5" font-weight="700" fill="#111827">EdgeBench 51개 태스크 결과 (GPT-5.6 Sol · Opus 5) — 성능은 Pi와 동급</text>

  <text x="56" y="414" font-size="12" fill="#4b5563">기록 토큰 트래픽</text>
  <rect x="200" y="402" width="440" height="14" rx="4" fill="#e5e7eb"/>
  <rect x="200" y="402" width="235" height="14" rx="4" fill="#8b5cf6"/>
  <text x="648" y="414" font-size="12" font-weight="700" fill="#111827">−44.7 ~ −49.0%</text>

  <text x="56" y="444" font-size="12" fill="#4b5563">API 비용</text>
  <rect x="200" y="432" width="440" height="14" rx="4" fill="#e5e7eb"/>
  <rect x="200" y="432" width="293" height="14" rx="4" fill="#3b82f6"/>
  <text x="648" y="444" font-size="12" font-weight="700" fill="#111827">약 −1/3</text>

  <text x="56" y="474" font-size="11.5" fill="#6b7280">시간당 추정 절감: 네이티브 Codex·Claude Code 하네스 대비 $8.75~$13.50, Pi 대비 $4.36~$5.71</text>
</svg>
