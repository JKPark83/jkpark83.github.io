  <text x="400" y="538" text-anchor="middle" font-size="12" fill="#9ca3af">활성 15B짜리 모델이 CLI·보안 과제에서 프런티어 5점 안쪽까지 들어왔다 — 단, 전부 벤더 자체 측정치</text>
