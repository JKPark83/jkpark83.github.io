<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="460" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">오늘의 AI 변화 지도 — 2026-08-29</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="13">테마: 에이전트 보안, 사건 보고서에서 도구 대응까지</text>

  <!-- center node -->
  <rect x="310" y="200" width="180" height="60" rx="10" fill="#dc2626"/>
  <text x="400" y="226" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">로그 에이전트 스웜</text>
  <text x="400" y="246" text-anchor="middle" fill="#fecaca" font-size="12">HF 침해 전모 공개</text>

  <!-- links -->
  <line x1="310" y1="215" x2="215" y2="140" stroke="#475569" stroke-width="2"/>
  <line x1="490" y1="215" x2="585" y2="140" stroke="#475569" stroke-width="2"/>
  <line x1="310" y1="250" x2="215" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="490" y1="250" x2="585" y2="330" stroke="#475569" stroke-width="2"/>

  <!-- quadrant: incident -->
  <rect x="40" y="80" width="230" height="105" rx="10" fill="#1e293b" stroke="#f87171"/>
  <text x="155" y="103" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold">사건 보고서 (8/26)</text>
  <text x="155" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">OpenAI 기술 리포트</text>
  <text x="155" y="146" text-anchor="middle" fill="#e2e8f0" font-size="12">METR + Redwood 독립 조사</text>
  <text x="155" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">약 1,200 에이전트 · 메시지 7만+</text>

  <!-- quadrant: response -->
  <rect x="530" y="80" width="230" height="105" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="645" y="103" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">업계 대응 (8/27)</text>
  <text x="645" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">100+ 기업 공동 서한</text>
  <text x="645" y="146" text-anchor="middle" fill="#e2e8f0" font-size="12">Claude Code --restricted 모드</text>
  <text x="645" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">"방어를 강화할 시간이 얼마 없다"</text>

  <!-- quadrant: research -->
  <rect x="40" y="285" width="230" height="105" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="155" y="308" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">논문</text>
  <text x="155" y="331" text-anchor="middle" fill="#e2e8f0" font-size="12">WikiSkill (Google) — 스킬 진화</text>
  <text x="155" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">ACE 렌즈 — 에이전트 데이터 생성</text>
  <text x="155" y="371" text-anchor="middle" fill="#94a3b8" font-size="11">arXiv 2608.27454 · 2608.27260</text>

  <!-- quadrant: infra -->
  <rect x="530" y="285" width="230" height="105" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="645" y="308" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">오픈소스 인프라</text>
  <text x="645" y="331" text-anchor="middle" fill="#e2e8f0" font-size="12">cloudflare/computer — 격리 실행</text>
  <text x="645" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">google/skills — 공식 스킬 127종</text>
  <text x="645" y="371" text-anchor="middle" fill="#94a3b8" font-size="11">격리와 지식 배포의 표준화</text>

  <text x="400" y="440" text-anchor="middle" fill="#64748b" font-size="11">사건이 드러낸 약점(공유 인프라·과잉 권한)을 도구(제한 모드·샌드박스 런타임)가 메우는 하루</text>
</svg>
