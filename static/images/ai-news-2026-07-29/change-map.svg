  <text x="466" y="436" fill="#9fb0c7" font-size="12">메모리·검색 결과는 '데이터'로 취급</text>

  <text x="380" y="500" text-anchor="middle" fill="#6b7890" font-size="11">자체 제작 SVG · 값 출처: arXiv 2607.14651 / 2607.05029, MCP 스펙, GitHub(웹 근사치)</text>
