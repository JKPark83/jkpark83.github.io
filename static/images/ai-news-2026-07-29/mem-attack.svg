<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif" role="img" aria-label="FARMA 공격 성공률과 SENTINEL 방어, MemPoison 방어 프론티어">
  <rect width="760" height="480" fill="#0f1420"/>
  <text x="380" y="32" text-anchor="middle" fill="#e6edf7" font-size="18" font-weight="700">추론 이력 포이즌: FARMA 공격 성공률 → SENTINEL 방어</text>

  <!-- left: FARMA bars -->
  <!-- axis -->
  <line x1="150" y1="80" x2="150" y2="250" stroke="#3d4a66" stroke-width="1.5"/>
  <line x1="150" y1="250" x2="410" y2="250" stroke="#3d4a66" stroke-width="1.5"/>
  <text x="132" y="86" text-anchor="end" fill="#8b98ad" font-size="11">100%</text>
  <text x="132" y="169" text-anchor="end" fill="#8b98ad" font-size="11">50%</text>
  <text x="132" y="253" text-anchor="end" fill="#8b98ad" font-size="11">0%</text>
  <line x1="146" y1="82" x2="150" y2="82" stroke="#3d4a66"/>
  <line x1="146" y1="166" x2="150" y2="166" stroke="#3d4a66"/>

  <!-- baseline 100 -->
  <rect x="172" y="82" width="52" height="168" rx="3" fill="#e0567a"/>
  <text x="198" y="74" text-anchor="middle" fill="#f2b6c6" font-size="13" font-weight="700">100%</text>
  <text x="198" y="268" text-anchor="middle" fill="#c3ccda" font-size="11">기본</text>

  <!-- keyword filter: bypassed (still high) -->
  <rect x="252" y="90" width="52" height="160" rx="3" fill="#c9526f"/>
  <text x="278" y="82" text-anchor="middle" fill="#f2b6c6" font-size="12" font-weight="700">우회</text>
  <text x="278" y="268" text-anchor="middle" fill="#c3ccda" font-size="11">키워드필터</text>

  <!-- A-MemGuard: defeated -->
  <rect x="332" y="112" width="52" height="138" rx="3" fill="#b04e66"/>
  <text x="358" y="104" text-anchor="middle" fill="#f2b6c6" font-size="12" font-weight="700">무력화</text>
  <text x="358" y="268" text-anchor="middle" fill="#c3ccda" font-size="11">A-MemGuard</text>

  <text x="280" y="300" text-anchor="middle" fill="#8b98ad" font-size="11">← 기존 방어는 뚫린다 (합의·키워드 기반)</text>

  <!-- SENTINEL 0% callout -->
  <rect x="470" y="90" width="240" height="150" rx="12" fill="#132318" stroke="#4fb477" stroke-width="1.5"/>
  <text x="590" y="120" text-anchor="middle" fill="#4fb477" font-size="14" font-weight="700">SENTINEL 방어 후</text>
  <text x="590" y="176" text-anchor="middle" fill="#8fe6b4" font-size="52" font-weight="800">0%</text>
  <text x="590" y="206" text-anchor="middle" fill="#cfe8d8" font-size="12">공격 성공률 (최저 0%까지)</text>
  <text x="590" y="226" text-anchor="middle" fill="#9fb0c7" font-size="11">정상 트레이스 326건 오탐 0</text>

  <!-- divider -->
  <line x1="60" y1="330" x2="700" y2="330" stroke="#232d42" stroke-width="1"/>

  <!-- bottom: MemPoison defense frontier -->
  <text x="60" y="358" fill="#e6edf7" font-size="14" font-weight="700">MemPoison 방어 프론티어 (write-time 정합성 검사 기준)</text>
  <!-- L1 -->
  <rect x="60" y="372" width="200" height="70" rx="10" fill="#132318" stroke="#4fb477" stroke-width="1.5"/>
  <text x="76" y="396" fill="#4fb477" font-size="13" font-weight="700">L1 단일 레코드</text>
  <text x="76" y="418" fill="#d6deea" font-size="12">직접 오염 → 억제됨 ✅</text>
  <text x="76" y="435" fill="#9fb0c7" font-size="11">write-time 검사로 방어</text>
  <!-- L2 -->
  <rect x="280" y="372" width="200" height="70" rx="10" fill="#2a1620" stroke="#e0567a" stroke-width="1.5"/>
  <text x="296" y="396" fill="#e0567a" font-size="13" font-weight="700">L2 다중 레코드</text>
  <text x="296" y="418" fill="#d6deea" font-size="12">조합형 오염 → 실패 ⚠️</text>
  <text x="296" y="435" fill="#9fb0c7" font-size="11">개별은 정상, 검색시 결합</text>
  <!-- L3 -->
  <rect x="500" y="372" width="200" height="70" rx="10" fill="#2a1620" stroke="#e0567a" stroke-width="1.5"/>
  <text x="516" y="396" fill="#e0567a" font-size="13" font-weight="700">L3 잠복 트리거</text>
  <text x="516" y="418" fill="#d6deea" font-size="12">조건부 발동 → 실패 ⚠️</text>
  <text x="516" y="435" fill="#9fb0c7" font-size="11">특정 컨텍스트서 활성화</text>

  <text x="380" y="466" text-anchor="middle" fill="#6b7890" font-size="11">자체 제작 SVG · 값 출처: FARMA arXiv 2607.05029, MemPoison arXiv 2607.14651</text>
</svg>
