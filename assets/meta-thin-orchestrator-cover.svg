<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="모든 도메인 지식을 혼자 짊어진 뚱뚱한 단일 에이전트가 환각 경고를 띄우는 왼쪽 그림에서, 도메인 지식이 전혀 없는 얇은 결정론적 오케스트레이터가 14개 전문가 서브에이전트에게 일을 나눠 주는 오른쪽 구조로 바뀌는 그림">
  <defs>
    <linearGradient id="thog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="tho-rose" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <linearGradient id="tho-green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#thog)"/>

  <text x="80" y="92" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="46" font-weight="800">라우터에게 생각을 시키지 마라</text>
  <text x="80" y="148" fill="#93c5fd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800">Meta의 Thin Orchestrator 해부</text>
  <text x="80" y="192" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="500">모든 걸 아는 에이전트 하나가 환각을 시작했다 — 1,300줄 결정론 라우터 + 전문가 14명의 답</text>

  <!-- 왼쪽: 뚱뚱한 단일 에이전트 -->
  <g>
    <rect x="80" y="240" width="380" height="310" rx="18" fill="#fb7185" opacity="0.07" stroke="#fb7185" stroke-opacity="0.5" stroke-width="2"/>
    <text x="270" y="282" text-anchor="middle" fill="#fb7185" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">어제: 모든 걸 아는 에이전트 하나</text>
    <circle cx="270" cy="400" r="78" fill="url(#tho-rose)" opacity="0.22" stroke="#fb7185" stroke-width="2.5"/>
    <text x="270" y="392" text-anchor="middle" fill="#fecdd3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">LLM</text>
    <text x="270" y="418" text-anchor="middle" fill="#fecdd3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">도메인 지식 전부 탑재</text>
    <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#fda4af">
      <text x="140" y="330">스키마</text><text x="350" y="330">검증 규칙</text>
      <text x="125" y="480">소스 10+개 패턴</text><text x="345" y="480">테스트</text>
    </g>
    <text x="270" y="528" text-anchor="middle" fill="#fca5a5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600">⚠ 지식이 섞여 환각 시작</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#e2e8f0" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 480 395 L 555 395"/>
    <path d="M 541 381 L 561 395 L 541 409"/>
  </g>

  <!-- 오른쪽: thin orchestrator -->
  <g>
    <rect x="585" y="240" width="535" height="310" rx="18" fill="#4ade80" opacity="0.07" stroke="#4ade80" stroke-opacity="0.5" stroke-width="2"/>
    <text x="852" y="282" text-anchor="middle" fill="#4ade80" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">오늘: 얇은 라우터 + 전문가 14명</text>
    <rect x="672" y="306" width="360" height="62" rx="12" fill="url(#tho-green)" opacity="0.22" stroke="#4ade80" stroke-width="2"/>
    <text x="852" y="332" text-anchor="middle" fill="#bbf7d0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">Thin Orchestrator — 결정론 코드 1,300줄</text>
    <text x="852" y="356" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">의도 분류 · 필드 수집 · 안정성 게이트 · 위임</text>
    <g stroke="#4ade80" stroke-width="2" opacity="0.7">
      <path d="M 740 368 L 672 430"/><path d="M 815 368 L 793 430"/>
      <path d="M 890 368 L 912 430"/><path d="M 965 368 L 1033 430"/>
    </g>
    <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#dbeafe">
      <rect x="614" y="430" width="116" height="54" rx="10" fill="#38bdf8" opacity="0.18" stroke="#38bdf8"/>
      <text x="672" y="462" text-anchor="middle">스키마 🤖</text>
      <rect x="735" y="430" width="116" height="54" rx="10" fill="#38bdf8" opacity="0.18" stroke="#38bdf8"/>
      <text x="793" y="462" text-anchor="middle">검증 🤖</text>
      <rect x="856" y="430" width="116" height="54" rx="10" fill="#38bdf8" opacity="0.18" stroke="#38bdf8"/>
      <text x="912" y="462" text-anchor="middle">적재 🤖</text>
      <rect x="977" y="430" width="116" height="54" rx="10" fill="#38bdf8" opacity="0.18" stroke="#38bdf8"/>
      <text x="1033" y="462" text-anchor="middle">…14개</text>
    </g>
    <text x="852" y="522" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600">전문가마다 자기 도메인 지식만 — 교차 오염 차단</text>
  </g>
</svg>
