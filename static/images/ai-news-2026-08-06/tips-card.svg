<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Codex exec vs Claude Code subagent 실전 팁 카드">
  <rect width="820" height="420" fill="#0f172a"/>
  <text x="410" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Codex exec vs Claude Code subagent</text>
  <text x="410" y="56" text-anchor="middle" fill="#94a3b8" font-size="13">둘 다 "메인 컨텍스트를 지키는" 격리 실행 패턴</text>

  <!-- Codex card -->
  <rect x="30" y="76" width="360" height="300" rx="14" fill="#052e16" stroke="#4ade80" stroke-width="1.6"/>
  <text x="52" y="106" fill="#bbf7d0" font-size="15" font-weight="700">🟩 Codex · codex exec</text>
  <text x="52" y="128" fill="#86efac" font-size="12">헤드리스 1회 실행 → 종료 코드로 게이트</text>
  <g font-size="12.5" fill="#dcfce7">
    <text x="52" y="158">• TUI·승인 프롬프트 없음</text>
    <text x="52" y="182">• stdout = 최종 메시지, exit code 의미有</text>
    <text x="52" y="206">• .codex/config.toml 에 ci 프로파일 분리</text>
    <text x="52" y="230">• sandbox_mode 로 blast radius 제한</text>
  </g>
  <rect x="52" y="248" width="316" height="96" rx="8" fill="#022c1a" stroke="#166534"/>
  <text x="66" y="272" fill="#4ade80" font-size="12" font-family="ui-monospace,Menlo,monospace">$ codex exec \</text>
  <text x="66" y="292" fill="#86efac" font-size="12" font-family="ui-monospace,Menlo,monospace">  --profile ci \</text>
  <text x="66" y="312" fill="#86efac" font-size="12" font-family="ui-monospace,Menlo,monospace">  "run tests, fix failures"</text>
  <text x="66" y="332" fill="#64748b" font-size="11" font-family="ui-monospace,Menlo,monospace"># CI: sandbox=read-only 부터</text>

  <!-- Claude Code card -->
  <rect x="430" y="76" width="360" height="300" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="452" y="106" fill="#bfdbfe" font-size="15" font-weight="700">🟦 Claude Code · custom subagent</text>
  <text x="452" y="128" fill="#93c5fd" font-size="12">별도 컨텍스트 창 + 좁힌 도구·권한</text>
  <g font-size="12.5" fill="#dbeafe">
    <text x="452" y="158">• .claude/agents/*.md (YAML frontmatter)</text>
    <text x="452" y="182">• tools 로 도구 화이트리스트</text>
    <text x="452" y="206">• model: haiku 로 저비용 라우팅</text>
    <text x="452" y="230">• 프로젝트 스코프는 repo에 커밋해 공유</text>
  </g>
  <rect x="452" y="248" width="316" height="96" rx="8" fill="#0b1836" stroke="#1e3a8a"/>
  <text x="466" y="270" fill="#93c5fd" font-size="11.5" font-family="ui-monospace,Menlo,monospace">--- .claude/agents/reviewer.md</text>
  <text x="466" y="290" fill="#bfdbfe" font-size="11.5" font-family="ui-monospace,Menlo,monospace">description: PR diff 리뷰 전용</text>
  <text x="466" y="310" fill="#bfdbfe" font-size="11.5" font-family="ui-monospace,Menlo,monospace">tools: Read, Grep, Glob</text>
  <text x="466" y="330" fill="#bfdbfe" font-size="11.5" font-family="ui-monospace,Menlo,monospace">model: sonnet</text>

  <text x="410" y="402" text-anchor="middle" fill="#64748b" font-size="11">출처: OpenAI Codex 공식 문서(non-interactive mode) · code.claude.com/docs/en/sub-agents</text>
</svg>
