<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">오늘의 AI 변화 지도 — 2026-08-26</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#64748b">주제: 모델이 아니라 "하네스"가 제품이 되는 주간</text>

  <!-- center node -->
  <rect x="290" y="200" width="220" height="70" rx="12" fill="#1e293b"/>
  <text x="400" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">하네스가 제품이다</text>
  <text x="400" y="252" text-anchor="middle" font-size="12" fill="#cbd5e1">실행·복구·검증·기억을 누가 감싸나</text>

  <!-- edges -->
  <line x1="290" y1="215" x2="205" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="510" y1="215" x2="595" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="290" y1="255" x2="205" y2="345" stroke="#94a3b8" stroke-width="2"/>
  <line x1="510" y1="255" x2="595" y2="345" stroke="#94a3b8" stroke-width="2"/>

  <!-- top-left: deepseek harness -->
  <rect x="40" y="80" width="220" height="86" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="150" y="103" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">🛠 DeepSeek Harness (dsh)</text>
  <text x="150" y="124" text-anchor="middle" font-size="11.5" fill="#334155">"Everything is a Plugin" MIT</text>
  <text x="150" y="141" text-anchor="middle" font-size="11.5" fill="#334155">8/13 프리뷰 → 최단기간 100k 스타</text>
  <text x="150" y="158" text-anchor="middle" font-size="11" fill="#64748b">모델·도구·루프·UI 전부 교체 가능</text>

  <!-- top-right: prime agent -->
  <rect x="540" y="80" width="220" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="650" y="103" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">📚 Prime Agent</text>
  <text x="650" y="124" text-anchor="middle" font-size="11.5" fill="#334155">하네스만 바꿔 ARC-AGI-3 RHAE</text>
  <text x="650" y="141" text-anchor="middle" font-size="11.5" fill="#334155">Best@1 30% → 95.5%</text>
  <text x="650" y="158" text-anchor="middle" font-size="11" fill="#64748b">arXiv 2608.23552</text>

  <!-- bottom-left: cli updates -->
  <rect x="40" y="310" width="220" height="86" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="150" y="333" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">🧰 CLI 하네스 업데이트</text>
  <text x="150" y="354" text-anchor="middle" font-size="11.5" fill="#334155">Claude Code 2.1.243 캐시 TTL 설정</text>
  <text x="150" y="371" text-anchor="middle" font-size="11.5" fill="#334155">Codex 0.149.0 queue·agents 대시보드</text>
  <text x="150" y="388" text-anchor="middle" font-size="11" fill="#64748b">비용·플릿 운영이 설정으로 내려옴</text>

  <!-- bottom-right: thinkingbox -->
  <rect x="540" y="310" width="220" height="86" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="650" y="333" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">📚 Thinkingbox-bench</text>
  <text x="650" y="354" text-anchor="middle" font-size="11.5" fill="#334155">한 번 성공 ≠ 신뢰성</text>
  <text x="650" y="371" text-anchor="middle" font-size="11.5" fill="#334155">pass@1 65.4% vs pass^20 25.3%</text>
  <text x="650" y="388" text-anchor="middle" font-size="11" fill="#64748b">arXiv 2608.19741</text>

  <text x="400" y="448" text-anchor="middle" font-size="11.5" fill="#64748b">공통 시사점: 같은 모델이라도 하네스 설계에 따라 측정 능력과 신뢰성이 완전히 달라진다</text>
</svg>
