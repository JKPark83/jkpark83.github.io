  <!-- quadrant backgrounds -->
  <rect x="30" y="56" width="360" height="190" rx="12" fill="#eef4ff" stroke="#b9cdf2"/>
  <rect x="410" y="56" width="360" height="190" rx="12" fill="#f0fbf2" stroke="#b5dfc0"/>
  <rect x="30" y="262" width="360" height="190" rx="12" fill="#fff7ec" stroke="#eed3a8"/>
  <rect x="410" y="262" width="360" height="190" rx="12" fill="#f7f0fb" stroke="#d7bfe8"/>

  <!-- 모델/릴리즈 -->
  <text x="50" y="84" font-size="15" font-weight="700" fill="#1f4e9c">🤖 모델 / 릴리즈</text>
  <text x="50" y="112" font-size="14" font-weight="600" fill="#222">GPT-6 Cyber (11/5, OpenAI)</text>
  <text x="50" y="134" font-size="12.5" fill="#444">보안 특화 에이전트 모델 — 취약점 발굴·수정</text>
  <text x="50" y="154" font-size="12.5" fill="#444">ExploitGym 48.5% (전작 32.1%)</text>
  <text x="50" y="176" font-size="12.5" fill="#444">Preparedness "Critical" — 승인 고객 한정 공개</text>
  <text x="50" y="202" font-size="12.5" fill="#666">API + Codex 경유, 일반 공개는 추후</text>

  <!-- 논문 -->
  <text x="430" y="84" font-size="15" font-weight="700" fill="#1e7a35">📚 논문</text>
  <text x="430" y="112" font-size="14" font-weight="600" fill="#222">Harness-S — 형제 하네스로 RL 구제</text>
