<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="브렌트유 100달러 돌파와 10년물 금리 4.85%라는 두 역풍에 뉴욕 3대 지수가 사흘 연속 하락하는 동안, 코스피는 7,051.64로 33거래일 만에 7,000선을 회복했음을 나타낸 표지">
  <defs>
