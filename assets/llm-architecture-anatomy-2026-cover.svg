<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="트랜스포머 블록 뼈대 하나를 가운데 두고, 어텐션·MoE·정규화·위치 인코딩 네 개의 다이얼이 둘러싼 표지 그림">
  <defs>
    <linearGradient id="laa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#122036"/>
    </linearGradient>
    <linearGradient id="laa-block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#laa-bg)"/>

  <!-- 왼쪽: 제목 -->
  <text x="80" y="215" font-family="sans-serif" font-size="58" font-weight="800" fill="#f1f5f9">오픈 LLM</text>
  <text x="80" y="285" font-family="sans-serif" font-size="58" font-weight="800" fill="#f1f5f9">아키텍처 해부학</text>
  <text x="80" y="345" font-family="sans-serif" font-size="34" font-weight="700" fill="#38bdf8">GPT-2 뼈대 + 다이얼 4개</text>
  <text x="80" y="405" font-family="sans-serif" font-size="22" fill="#94a3b8">MLA · MoE · 슬라이딩 윈도우 · Gated DeltaNet</text>
  <text x="80" y="440" font-family="sans-serif" font-size="22" fill="#94a3b8">아키텍처 갤러리 103개 모델이 말해주는 것</text>

  <!-- 가운데-오른쪽: 트랜스포머 블록 스택 -->
  <g transform="translate(700,90)">
    <rect x="60" y="380" width="220" height="52" rx="10" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="170" y="413" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#94a3b8">토큰 임베딩</text>
    <rect x="40" y="230" width="260" height="130" rx="14" fill="none" stroke="url(#laa-block)" stroke-width="4"/>
    <rect x="62" y="300" width="216" height="42" rx="8" fill="#38bdf8" opacity="0.25"/>
    <text x="170" y="328" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#e2e8f0">어텐션</text>
    <rect x="62" y="248" width="216" height="42" rx="8" fill="#818cf8" opacity="0.25"/>
    <text x="170" y="276" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#e2e8f0">FFN / MoE</text>
    <text x="330" y="305" font-family="sans-serif" font-size="26" font-weight="700" fill="#64748b">× N</text>
    <rect x="60" y="160" width="220" height="52" rx="10" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="170" y="193" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#94a3b8">LM Head</text>
    <line x1="170" y1="380" x2="170" y2="362" stroke="#64748b" stroke-width="3"/>
    <line x1="170" y1="230" x2="170" y2="214" stroke="#64748b" stroke-width="3"/>

    <!-- 다이얼 4개 -->
    <g font-family="sans-serif">
      <circle cx="-40" cy="120" r="42" fill="none" stroke="#f472b6" stroke-width="4"/>
      <line x1="-40" y1="120" x2="-14" y2="94" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
      <text x="-40" y="190" text-anchor="middle" font-size="19" fill="#f472b6">어텐션</text>
      <circle cx="400" cy="120" r="42" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <line x1="400" y1="120" x2="428" y2="140" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
      <text x="400" y="190" text-anchor="middle" font-size="19" fill="#fbbf24">MoE</text>
      <circle cx="-40" cy="440" r="42" fill="none" stroke="#4ade80" stroke-width="4"/>
      <line x1="-40" y1="440" x2="-68" y2="418" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
      <text x="-40" y="515" text-anchor="middle" font-size="19" fill="#4ade80">정규화</text>
      <circle cx="400" cy="440" r="42" fill="none" stroke="#38bdf8" stroke-width="4"/>
      <line x1="400" y1="440" x2="400" y2="406" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <text x="400" y="515" text-anchor="middle" font-size="19" fill="#38bdf8">위치 인코딩</text>
    </g>
  </g>
</svg>
