<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="코스피가 7.6퍼센트 폭락해 서킷브레이커가 발동된 목요일 아시아 급락이 뉴욕에서는 다우 1.1퍼센트 상승으로 멈췄고, 비트코인은 한 달여 만에 8만달러가 장중 깨지며 10억달러 가까이 청산됐다가 8만2,000달러로 돌아온 하루를 요약한 금요일 아침 브리핑 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.10.16 · 나스닥 &amp; 비트코인 5분 요약 · 금요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">서울발 반도체 투매가 지구를 한 바퀴 돌고, 뉴욕에서 멈췄습니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">목요일 — 아시아 폭락, 뉴욕 복원</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">코스피 -7.6%</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">서킷브레이커 · 닛케이 -4.9%</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.14"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#4ade80">다우 +1.08%</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">나스닥은 낙폭 만회 마감</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">비트코인 — 8만 깨졌다 복귀</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#f59e0b" opacity="0.15"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fbbf24">$79,676</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fde68a">장중 저점 · 청산 ~10억달러</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#a5b4fc">$82,000대</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">저녁 회복 · 매도 유지</text>
  </g>
</svg>
