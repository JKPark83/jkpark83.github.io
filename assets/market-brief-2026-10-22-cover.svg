<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="목요일 아침 브리핑 표지. 스페이스X 깜짝 실적에 나스닥이 1.1% 올랐고 메타도 시간외에서 합격점을 받았습니다. 주식 공포·탐욕 지수는 22에서 29로 올라 역발상 신호가 소멸했지만 분할 매수는 유지하고, 비트코인은 ETF 유입이 하루 만에 96% 급감해 매도를 유지합니다">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.10.22 · 나스닥 &amp; 비트코인 5분 요약 · 목요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">스페이스X가 AI 트레이드에 다시 불을 붙였습니다 — 실적 시험의 첫 고비는 통과</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 공포 구간 탈출</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#f59e0b" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fbbf24">심리 22→29</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fde68a">역발상 신호 소멸</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.15"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#4ade80">나스닥 매수</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">분할 매수 유지</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 유입 96% 급감</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#a5b4fc">탐욕 64</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">횡보장 속 부조화</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.15"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">비트코인 매도</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">84,000달러 미달</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">나스닥 26,702.86(+1.1%) · S&amp;P 7,757.17(+0.6%) · BTC 82,000~83,000달러 · 수요일(10/21) 종가 기준</text>
</svg>
