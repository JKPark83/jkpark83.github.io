<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="주식 공포·탐욕 지수가 금요일 종가 18로 극단적 공포에 진입해 기다리던 역발상 매수 신호가 켜졌고, 나스닥을 분할 매수로 전환하는 일요일 아침 브리핑 표지. 비트코인은 8만1,000달러대에서 조용한 주말을 보내지만 ETF 주간 6억달러 유출에 매도를 유지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.10.18 · 나스닥 &amp; 비트코인 5분 요약 · 일요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">기다리던 마지막 조건이 채워졌습니다 — 주식 심리 18, 극단적 공포입니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 역발상 신호 점등</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">심리 18</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">극단적 공포 · 1주 전 46</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.15"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#4ade80">나스닥 매수</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">분할·소규모 전환</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">비트코인 — 조용한 주말</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.18"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#a5b4fc">81,000달러대</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">10월 누적 약 -4%</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">매도 유지</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">ETF 주간 -6.1억달러</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">유가 급등(WTI 101달러) · MSCI 지수 제외 리스크 · 연준 블랙아웃 돌입 — 본 글은 투자 자문이 아닙니다</text>
</svg>
