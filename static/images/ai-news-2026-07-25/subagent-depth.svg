<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="760" height="300" fill="#0f172a"/>
  <text x="380" y="30" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">이번 주 서브에이전트 정책 — 정반대로 갈렸다</text>
  <text x="380" y="50" text-anchor="middle" fill="#94a3b8" font-size="11.5">출처: Claude Code v2.1.219 changelog · Codex changelog</text>

  <!-- LEFT: Claude Code -->
  <rect x="40" y="70" width="330" height="200" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="205" y="96" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">🟦 Claude Code v2.1.219</text>
  <text x="205" y="116" text-anchor="middle" fill="#cbd5e1" font-size="11.5">중첩 서브에이전트 기본 depth 3 (기존 1)</text>
  <!-- depth chain -->
  <rect x="90" y="135" width="230" height="26" rx="5" fill="#0ea5e9"/>
  <text x="205" y="153" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">부모 에이전트</text>
  <rect x="120" y="170" width="200" height="26" rx="5" fill="#38bdf8"/>
  <text x="220" y="188" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">서브에이전트 (depth 2)</text>
  <rect x="150" y="205" width="170" height="26" rx="5" fill="#7dd3fc"/>
  <text x="235" y="223" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">중첩 서브 (depth 3)</text>
  <text x="205" y="252" text-anchor="middle" fill="#94a3b8" font-size="10.5">막으려면 CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=1</text>

  <!-- RIGHT: Codex -->
  <rect x="390" y="70" width="330" height="200" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="555" y="96" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">🟩 Codex</text>
  <text x="555" y="116" text-anchor="middle" fill="#cbd5e1" font-size="11.5">중첩 서브에이전트 기본 OFF · depth로 제어</text>
  <rect x="440" y="135" width="230" height="26" rx="5" fill="#10b981"/>
  <text x="555" y="153" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">부모 에이전트</text>
  <rect x="470" y="170" width="200" height="26" rx="5" fill="#34d399"/>
  <text x="570" y="188" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">서브에이전트 (백그라운드 가능)</text>
  <text x="555" y="216" text-anchor="middle" fill="#64748b" font-size="11">✕ 기본은 여기서 멈춤 (중첩 차단)</text>
  <text x="555" y="252" text-anchor="middle" fill="#94a3b8" font-size="10.5">필요 시 subagent_depth로 상향</text>
</svg>
