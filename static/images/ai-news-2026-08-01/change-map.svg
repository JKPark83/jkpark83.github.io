<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="100%" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="820" height="470" fill="#0f172a"/>
  <text x="410" y="34" fill="#f8fafc" font-size="21" font-weight="700" text-anchor="middle">오늘의 AI 변화 지도 · 2026-08-01</text>
  <text x="410" y="58" fill="#94a3b8" font-size="13" text-anchor="middle">축: 에이전트의 과거(기억·궤적)를 재생하지 말고 재구성하라</text>

  <!-- center -->
  <rect x="285" y="200" width="250" height="72" rx="12" fill="#f59e0b"/>
  <text x="410" y="230" fill="#1e293b" font-size="15" font-weight="700" text-anchor="middle">replay ✗  →  reconstruct ✓</text>
  <text x="410" y="252" fill="#1e293b" font-size="12.5" text-anchor="middle">과거를 그대로 넣지 말고</text>
  <text x="410" y="266" fill="#1e293b" font-size="12.5" text-anchor="middle">현재 맥락에 맞게 다시 쓴다</text>

  <!-- edges -->
  <g stroke="#475569" stroke-width="2">
    <line x1="285" y1="220" x2="205" y2="130"/>
    <line x1="535" y1="220" x2="615" y2="130"/>
    <line x1="285" y1="252" x2="205" y2="350"/>
    <line x1="535" y1="252" x2="615" y2="350"/>
  </g>

  <!-- papers -->
  <rect x="30" y="90" width="285" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="114" fill="#38bdf8" font-size="14" font-weight="700">📚 논문</text>
  <text x="46" y="136" fill="#e2e8f0" font-size="12.5">MemHarness — 기억을 비평·재구성</text>
  <text x="46" y="155" fill="#e2e8f0" font-size="12.5">Traj. Graph Copilot — 실행 전 오류 진단</text>
  <text x="46" y="172" fill="#94a3b8" font-size="11.5">arXiv 2607.28272 · 2607.27443</text>

  <!-- standard -->
  <rect x="505" y="90" width="285" height="90" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="521" y="114" fill="#a78bfa" font-size="14" font-weight="700">📐 표준 신호</text>
  <text x="521" y="136" fill="#e2e8f0" font-size="12.5">AGENTS.md, 개방 표준으로 채택</text>
  <text x="521" y="155" fill="#e2e8f0" font-size="12.5">Codex·Cursor·Gemini·Copilot 공용</text>
  <text x="521" y="172" fill="#94a3b8" font-size="11.5">에이전트 지침 파일 = 도구 공통 기반</text>

  <!-- open source -->
  <rect x="30" y="330" width="285" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="46" y="354" fill="#34d399" font-size="14" font-weight="700">🛠 오픈소스 메모리</text>
  <text x="46" y="376" fill="#e2e8f0" font-size="12.5">mem0 — 붙이는 메모리 레이어</text>
  <text x="46" y="395" fill="#e2e8f0" font-size="12.5">letta — 메모리 내장 에이전트 런타임</text>
  <text x="46" y="414" fill="#e2e8f0" font-size="12.5">Agent_Memory_Techniques — 30 실습</text>

  <!-- tips -->
  <rect x="505" y="330" width="285" height="100" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="521" y="354" fill="#f472b6" font-size="14" font-weight="700">🧑‍💻 실전 팁</text>
  <text x="521" y="376" fill="#e2e8f0" font-size="12.5">🟦 CLAUDE.md(명시) + MEMORY.md(학습)</text>
  <text x="521" y="395" fill="#e2e8f0" font-size="12.5">🟩 AGENTS.md 계층 병합 규칙</text>
  <text x="521" y="414" fill="#e2e8f0" font-size="12.5">🟪 검색한 기억을 verbatim 주입 금지</text>

  <text x="410" y="458" fill="#64748b" font-size="11" text-anchor="middle">자체 제작 SVG · 수치·ID는 arXiv/공식 출처 검증</text>
