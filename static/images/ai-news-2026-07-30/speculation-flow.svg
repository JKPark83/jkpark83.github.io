<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif">
  <rect width="820" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">Self-Speculating Agent — 한 모델이 풀고, 다음 툴콜을 미리 예측</text>
  <text x="30" y="55" font-size="12" fill="#64748b">prefix KV 캐시를 재사용해 대기시간을 숨긴다 (arXiv 2607.25816)</text>

  <!-- one model box -->
  <rect x="30" y="80" width="430" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="245" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">단일 모델 (dual-mode) · prefix KV cache 공유</text>

  <!-- agent mode -->
  <rect x="55" y="126" width="170" height="80" rx="10" fill="#2563eb"/>
  <text x="140" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Agent 모드</text>
  <text x="140" y="174" text-anchor="middle" font-size="11" fill="#dbeafe">과제를 풀고</text>
  <text x="140" y="190" text-anchor="middle" font-size="11" fill="#dbeafe">툴을 호출</text>

  <!-- speculator mode -->
  <rect x="265" y="126" width="170" height="80" rx="10" fill="#0d9488"/>
  <text x="350" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Speculator 모드</text>
  <text x="350" y="174" text-anchor="middle" font-size="11" fill="#ccfbf1">부분 궤적으로</text>
  <text x="350" y="190" text-anchor="middle" font-size="11" fill="#ccfbf1">다음 툴콜 예측</text>

  <path d="M225 166 L265 166" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- flow steps -->
  <rect x="55" y="230" width="380" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="72" y="258" font-size="12" fill="#0f172a">① 툴 결과를 기다리는 동안 다음 호출을 <tspan font-weight="700" fill="#7c3aed">미리 실행</tspan></text>

  <rect x="55" y="286" width="380" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="72" y="314" font-size="12" fill="#0f172a">② 예측이 실제 호출과 <tspan font-weight="700" fill="#16a34a">일치</tspan>하면 그 대기시간을 회수</text>

  <rect x="55" y="342" width="380" height="46" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="72" y="370" font-size="12" fill="#0f172a">③ agent·speculator를 <tspan font-weight="700" fill="#d97706">번갈아 RL</tspan> 업데이트</text>

  <!-- Hit@1 chart -->
  <text x="500" y="106" font-size="13" font-weight="700" fill="#0f172a">Next tool-call Hit@1 (%)</text>
  <text x="500" y="124" font-size="11" fill="#64748b">기존(회색) → 제안 기법(파랑)</text>

  <!-- axis -->
  <line x1="560" y1="150" x2="560" y2="380" stroke="#cbd5e1"/>
  <line x1="560" y1="380" x2="800" y2="380" stroke="#cbd5e1"/>

  <!-- scale: 0..70 over 200px width starting x=560; value*3 -->
  <!-- Qwen3-4B group -->
  <rect x="585" y="248" width="44" height="132" fill="#cbd5e1"/>
  <text x="607" y="242" text-anchor="middle" font-size="11" fill="#475569">44.1</text>
  <rect x="637" y="196" width="44" height="184" fill="#2563eb"/>
  <text x="659" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">61.2</text>
  <text x="633" y="398" text-anchor="middle" font-size="11" fill="#0f172a">Qwen3-4B</text>

  <!-- Qwen3.5-4B group -->
  <rect x="705" y="233" width="44" height="147" fill="#cbd5e1"/>
  <text x="727" y="227" text-anchor="middle" font-size="11" fill="#475569">48.9</text>
  <rect x="757" y="181" width="42" height="199" fill="#0d9488"/>
  <text x="778" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">66.3</text>
  <text x="752" y="398" text-anchor="middle" font-size="11" fill="#0f172a">Qwen3.5-4B</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
