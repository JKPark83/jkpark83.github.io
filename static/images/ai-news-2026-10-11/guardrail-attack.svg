<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="400" fill="#fafafa"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Option-Channel Attack: 가드레일 결정 모델의 fail-open 비율</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#666">합성 에이전트 툴콜 스위트, 모델이 원래 맞게 처리하던 정책 기준 (논문 보고 수치)</text>

  <!-- 축 -->
  <line x1="250" y1="80" x2="250" y2="290" stroke="#999" stroke-width="1"/>

  <!-- bar 1: 기본 -->
  <text x="238" y="112" text-anchor="end" font-size="13" fill="#333">공격 없음</text>
  <rect x="250" y="96" width="4" height="24" rx="2" fill="#1baf7a"/>
  <text x="264" y="112" font-size="13" font-weight="700" fill="#047857">0%</text>

  <!-- bar 2: 로그 주입 -->
  <text x="238" y="182" text-anchor="end" font-size="13" fill="#333">무관한 서버 로그</text>
  <text x="238" y="198" text-anchor="end" font-size="11" fill="#888">6줄 주입</text>
  <rect x="250" y="172" width="302" height="24" rx="2" fill="#f59e0b"/>
  <text x="562" y="189" font-size="13" font-weight="700" fill="#b45309">63%</text>

  <!-- bar 3: 라벨 변경 -->
  <text x="238" y="252" text-anchor="end" font-size="13" fill="#333">허용 옵션 라벨만</text>
  <text x="238" y="268" text-anchor="end" font-size="11" fill="#888">오해되게 변경</text>
  <rect x="250" y="242" width="480" height="24" rx="2" fill="#dc2626"/>
  <text x="640" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">93–100%</text>
  <text x="250" y="284" font-size="11" fill="#888">* 라벨을 입력에 포함하는 4개 모델 기준. 정의·심사 대상 텍스트는 그대로.</text>

  <!-- 하단 요약 -->
  <rect x="40" y="310" width="720" height="70" rx="10" fill="#fff" stroke="#ddd"/>
  <text x="60" y="336" font-size="13" font-weight="700" fill="#1a1a2e">기본 성능부터 문제</text>
  <text x="60" y="358" font-size="12" fill="#333">프롬프트 인젝션·탈옥·유해성 스크리닝 정확도 36–72% (찍기 기준 50%) · 테스트한 방어 기법 전부 우회됨</text>
  <text x="60" y="374" font-size="11" fill="#888">출처: arXiv 2610.12292, 오픈웨이트 모델 7종 평가</text>
</svg>
