  <text x="50" y="206" font-size="12.5" fill="#666">그 외 큰 모델 발표 없음</text>

  <!-- 논문 -->
  <text x="430" y="84" font-size="15" font-weight="700" fill="#1e7a35">📚 논문</text>
  <text x="430" y="112" font-size="14" font-weight="600" fill="#222">LeanGuard — 증명 기반 툴 콜 가드레일</text>
