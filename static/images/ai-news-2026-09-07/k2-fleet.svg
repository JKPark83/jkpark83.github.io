  <text x="400" y="412" text-anchor="middle" font-size="10.5" fill="#6c757d">출처: ifm.ai 발표·Hugging Face IFM 조직 모델 카드 (32B 카드에서 직접 확인). 0.9B·3.7B·7B는 동급 SOTA 주장(벤더 자체 보고).</text>
