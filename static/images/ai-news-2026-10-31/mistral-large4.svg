<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="440" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Mistral Large 4 "Le Chonk" — 오픈 웨이트 한눈에</text>

  <!-- spec cards -->
  <g font-size="12.5">
    <rect x="30" y="52" width="178" height="74" rx="10" fill="#fff" stroke="#ddd"/>
    <text x="119" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#d9480f">~1T / 52B</text>
    <text x="119" y="104" text-anchor="middle" fill="#555">전체 / 활성 파라미터 (MoE)</text>

    <rect x="218" y="52" width="178" height="74" rx="10" fill="#fff" stroke="#ddd"/>
    <text x="307" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#d9480f">1M 토큰</text>
    <text x="307" y="104" text-anchor="middle" fill="#555">컨텍스트 (텍스트+이미지 입력)</text>

    <rect x="406" y="52" width="178" height="74" rx="10" fill="#fff" stroke="#ddd"/>
    <text x="495" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#d9480f">128 experts</text>
    <text x="495" y="104" text-anchor="middle" fill="#555">토큰당 4개 활성 + 공유 1개</text>

    <rect x="594" y="52" width="178" height="74" rx="10" fill="#fff" stroke="#ddd"/>
    <text x="683" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#d9480f">$0.7 / $2.1</text>
    <text x="683" y="104" text-anchor="middle" fill="#555">API 입력/출력 (1M 토큰당)</text>
  </g>

  <!-- benchmark bars -->
  <text x="30" y="166" font-size="14" font-weight="700" fill="#333">벤치마크 (벤더 공개치, %)</text>

  <!-- AA Coding Agent Index -->
  <text x="30" y="196" font-size="12.5" fill="#444">AA Coding Agent Index</text>
  <rect x="240" y="184" width="240" height="16" rx="4" fill="#d9480f"/>
  <text x="488" y="197" font-size="12.5" font-weight="600" fill="#333">48 — GLM-5.3과 동률, 토큰은 47% 적게</text>

  <!-- Terminal-Bench 4.0 -->
  <text x="30" y="226" font-size="12.5" fill="#444">Terminal-Bench 4.0</text>
  <rect x="240" y="214" width="205" height="16" rx="4" fill="#d9480f"/>
  <text x="453" y="227" font-size="12.5" font-weight="600" fill="#333">41 — 공개 프리뷰 대비 +13pt</text>

  <!-- AA Intelligence Index -->
  <text x="30" y="256" font-size="12.5" fill="#444">AA Intelligence Index v5</text>
  <rect x="240" y="244" width="130" height="16" rx="4" fill="#e8825e"/>
  <text x="378" y="257" font-size="12.5" font-weight="600" fill="#333">26 — 서구권 오픈 웨이트 중 최고 (벤더 주장)</text>

  <!-- license / deploy -->
  <rect x="30" y="286" width="360" height="118" rx="10" fill="#fff4ec" stroke="#eac4a8"/>
  <text x="50" y="314" font-size="13.5" font-weight="700" fill="#9c4a1f">라이선스 체크포인트</text>
  <text x="50" y="338" font-size="12.5" fill="#444">· Mistral Ecosystem Open-Weight (수정 MIT)</text>
  <text x="50" y="358" font-size="12.5" fill="#444">· 상업 이용·파인튜닝 가능</text>
  <text x="50" y="378" font-size="12.5" fill="#444">· 단, Model-as-a-Service 사업은 별도 라이선스</text>
  <text x="50" y="398" font-size="12.5" fill="#444">· OSI 승인 오픈소스는 아님</text>

  <rect x="410" y="286" width="362" height="118" rx="10" fill="#eef4ff" stroke="#b9cdf2"/>
  <text x="430" y="314" font-size="13.5" font-weight="700" fill="#1f4e9c">배포 포맷</text>
  <text x="430" y="338" font-size="12.5" fill="#444">· FP8 메인 + NVFP4 (Blackwell, vLLM/SGLang)</text>
  <text x="430" y="358" font-size="12.5" fill="#444">· GGUF (llama.cpp) · 총 약 1.06TB</text>
  <text x="430" y="378" font-size="12.5" fill="#444">· DSpark 추측 디코딩 헤드 내장 (~1.9x 처리량)</text>
  <text x="430" y="398" font-size="12.5" fill="#444">· 예시 서빙: 8-GPU 텐서 병렬</text>

  <text x="400" y="430" text-anchor="middle" font-size="11" fill="#888">출처: mistral.ai 발표 + Hugging Face 모델 카드 (벤치마크는 벤더 자체 보고치)</text>
</svg>
