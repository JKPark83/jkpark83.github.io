  <text x="430" y="400" font-size="12.5" fill="#444">diff 패널이 플러그인 하나로 — mods/diff 정독 권장</text>
  <text x="430" y="426" font-size="14" font-weight="600" fill="#222">공통 — lesson에 근거 링크 달기</text>
  <text x="430" y="448" font-size="12.5" fill="#444">WikiTrace 패턴을 내 메모리 설계에 적용</text>
