<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">오늘의 AI 변화 지도 — 2026-09-29</text>

  <!-- center hub -->
  <rect x="290" y="210" width="220" height="52" rx="26" fill="#1a1a2e"/>
  <text x="400" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">모델 교체 주간:</text>
  <text x="400" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">갈아끼우기 전에 검증부터</text>

  <!-- connectors -->
  <line x1="230" y1="130" x2="330" y2="212" stroke="#c5c9d6" stroke-width="2"/>
  <line x1="570" y1="130" x2="470" y2="212" stroke="#c5c9d6" stroke-width="2"/>
  <line x1="230" y1="360" x2="330" y2="260" stroke="#c5c9d6" stroke-width="2"/>
  <line x1="570" y1="360" x2="470" y2="260" stroke="#c5c9d6" stroke-width="2"/>

  <!-- quadrant: models -->
  <rect x="40" y="60" width="330" height="118" rx="12" fill="#eef4ff" stroke="#4a7dff" stroke-width="1.5"/>
  <text x="56" y="86" font-size="15" font-weight="700" fill="#2453c9">🤖 모델</text>
  <text x="56" y="112" font-size="13" fill="#1a1a2e">Claude Sonnet 5.5 (9/28)</text>
  <text x="56" y="130" font-size="12" fill="#555f77">가격 동결 $2/$10 · 30% 빠른 출력 · 1M 컨텍스트</text>
  <text x="56" y="152" font-size="13" fill="#1a1a2e">단, Sonnet 5 대비 API 파괴적 변경 5건</text>
  <text x="56" y="170" font-size="12" fill="#555f77">thinking 끄기·강제 tool_choice 금지 등 → 본문 체크리스트</text>

  <!-- quadrant: papers -->
  <rect x="430" y="60" width="330" height="118" rx="12" fill="#f3efff" stroke="#8a63e8" stroke-width="1.5"/>
  <text x="446" y="86" font-size="15" font-weight="700" fill="#6b3fd4">📚 논문</text>
  <text x="446" y="112" font-size="13" fill="#1a1a2e">AgentWorld (2609.31590)</text>
  <text x="446" y="130" font-size="12" fill="#555f77">멀티에이전트 장기 협업 벤치 — 최고 모델도 52.0%</text>
  <text x="446" y="152" font-size="13" fill="#1a1a2e">SLCA-GRPO (2609.29050)</text>
  <text x="446" y="170" font-size="12" fill="#555f77">툴 토큰과 요약 토큰의 보상을 분리하는 RL</text>

  <!-- quadrant: open source -->
  <rect x="40" y="300" width="330" height="118" rx="12" fill="#eafaf1" stroke="#2fb673" stroke-width="1.5"/>
  <text x="56" y="326" font-size="15" font-weight="700" fill="#1d8a55">🛠 오픈소스</text>
  <text x="56" y="352" font-size="13" fill="#1a1a2e">agentproto/ts — 백그라운드 에이전트 런타임</text>
  <text x="56" y="370" font-size="12" fill="#555f77">14개 코딩 에이전트를 하나의 수명주기 + 검증 게이트</text>
  <text x="56" y="392" font-size="13" fill="#1a1a2e">SLCA-GRPO — 툴콜 RL 레퍼런스 구현</text>
  <text x="56" y="410" font-size="12" fill="#555f77">실 API 없이 학습하는 스키마 기반 시뮬레이터 포함</text>

  <!-- quadrant: tools -->
  <rect x="430" y="300" width="330" height="118" rx="12" fill="#fff4e8" stroke="#e8963f" stroke-width="1.5"/>
  <text x="446" y="326" font-size="15" font-weight="700" fill="#c26a10">🧑‍💻 도구</text>
  <text x="446" y="352" font-size="13" fill="#1a1a2e">Codex — 터미널에서 Mermaid 네이티브 렌더링</text>
  <text x="446" y="370" font-size="12" fill="#555f77">flowchart 문법 확장(9/28) · 5개 다이어그램 계열</text>
  <text x="446" y="392" font-size="13" fill="#1a1a2e">Claude Code 2.1.284 — 기본 auto 모드 전환</text>
  <text x="446" y="410" font-size="12" fill="#555f77">Sonnet 5.5 탑재 · permissions.defaultMode로 되돌리기</text>

  <text x="400" y="452" text-anchor="middle" font-size="11" fill="#8a90a3">검증: Anthropic 발표(복수 매체)·arXiv API·GitHub 클론 (2026-09-29 KST)</text>
</svg>
