<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="일요일 아침 브리핑 표지. 나스닥은 주간 3.4% 하락으로 4주 연속 내림세를 이어갔고, 주말 비트코인은 76,000달러 공방 중입니다. 비트코인 ETF는 이틀 연속 8억4천만달러가 빠졌고, 화요일 10월 CPI가 다음 관문입니다. 나스닥 관망, 비트코인 매도 유지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101723"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.08 · 나스닥 &amp; 비트코인 5분 요약 · 일요일 주말판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#fdba74">나스닥 주간 -3.4% · 4주 연속 하락 · 주말 BTC 76,000달러 공방 · 화요일 CPI 관문</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 한 주를 복기</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">주간 -3.4%</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">4주 연속 · VIX 25.64</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">나스닥 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">월요일 지지 + CPI 확인</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 주말 공방</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#06b6d4" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#22d3ee">BTC 76,000대</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a5f3fc">ETF 이틀 -8.4억달러</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">비트코인 매도</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">유출 중단 전까지 유지</text>
  </g>

  <text x="80" y="580" font-family="sans-serif" font-size="16" fill="#64748b">본 글은 정보 제공 목적이며 투자 자문이 아닙니다</text>
</svg>
