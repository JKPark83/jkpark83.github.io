<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="수요일 아침 브리핑 표지. 반도체가 사흘 만에 반등해 나스닥은 0.83% 올랐고, AMD는 더블 비트에 시간외 7% 상승했습니다. 주식 공포·탐욕 지수는 23으로 극단 공포에 들어섰고, 남은 관문은 중간선거 개표입니다. 나스닥 관망에 매수 준비, 비트코인 매도 유지입니다">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.04 · 나스닥 &amp; 비트코인 5분 요약 · 수요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">반도체 반등 · AMD 시간외 +7% · 주식 심리 23 극단 공포 — 남은 관문은 개표입니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 조건이 거의 다 찼다</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#a5b4fc">심리 23</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">극단 공포 — 역발상 점등</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">나스닥 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">개표 확인 후 분할 매수</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 수급이 아직이다</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#06b6d4" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#22d3ee">ETF -3.99억</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a5f3fc">이틀째 대규모 유출</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.15"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">비트코인 매도</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">BTC 77,000 · 심리 26</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">본 콘텐츠는 정보 제공 목적이며 투자 자문이 아닙니다</text>
</svg>
