<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="360" fill="#fafafa"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Gemini 4 Argon — 공개 단계와 가격 타임라인</text>

  <!-- 타임라인 축 -->
  <line x1="70" y1="150" x2="730" y2="150" stroke="#999" stroke-width="2"/>
  <circle cx="130" cy="150" r="8" fill="#2a78d6"/>
  <circle cx="400" cy="150" r="10" fill="#eb6834"/>
  <circle cx="670" cy="150" r="8" fill="#6250d6"/>

  <!-- 9/30 -->
  <text x="130" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#2a78d6">9/30 발표</text>
  <text x="130" y="130" text-anchor="middle" font-size="11.5" fill="#333">Fairwind 사이버 방어</text>
  <text x="130" y="186" text-anchor="middle" font-size="11.5" fill="#555">조직 한정 선공개</text>

  <!-- 10/13 -->
  <text x="400" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b5431a">10/13 일반 공개</text>
  <text x="400" y="110" text-anchor="middle" font-size="11.5" fill="#333">개발자·기업 API 개방</text>
  <text x="400" y="128" text-anchor="middle" font-size="11.5" fill="#333">Pro/Ultra: Gemini 앱 + AI Mode</text>
  <text x="400" y="186" text-anchor="middle" font-size="11.5" fill="#555">Antigravity는 Ultra 전용</text>
  <text x="400" y="204" text-anchor="middle" font-size="11.5" fill="#555">무료·Plus 계정은 아직 제외</text>

  <!-- 11/30 -->
  <text x="670" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">11/30 도입가 종료</text>
  <text x="670" y="130" text-anchor="middle" font-size="11.5" fill="#333">이후 2배 인상 보도</text>
  <text x="670" y="186" text-anchor="middle" font-size="11.5" fill="#555">$2/$10 → $4/$20 (MTok)</text>

  <!-- 스펙 박스 -->
  <rect x="70" y="236" width="320" height="94" rx="10" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="90" y="262" font-size="13" font-weight="700" fill="#1d4ed8">스펙 (Vals AI 등재 기준)</text>
  <text x="90" y="286" font-size="12" fill="#333">컨텍스트 1M 토큰 · 최대 출력 262K</text>
  <text x="90" y="306" font-size="12" fill="#333">도입가 입력 $2 / 출력 $10 (MTok)</text>

  <!-- 벤치 박스 -->
  <rect x="410" y="236" width="320" height="94" rx="10" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="430" y="262" font-size="13" font-weight="700" fill="#b5431a">벤치마크 (출처 혼재, 주의)</text>
  <text x="430" y="286" font-size="12" fill="#333">자사 카드: Vals Index·AutomationBench 우위</text>
  <text x="430" y="306" font-size="12" fill="#333">3자 보도: Terminal-Bench 4.0 등은 열세</text>
</svg>
