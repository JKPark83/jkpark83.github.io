<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="840" height="420" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Agensh — 에이전트 수를 늘리면 테스트 통과율이 오른다</text>
  <text x="420" y="54" text-anchor="middle" font-size="12" fill="#6b7280">ProgramBench 최고 난도 5개 태스크 · GPT-5.6-sol 기반 · 논문(arXiv 2609.26781) 보고치</text>

  <!-- Left group: hard-5 mean -->
  <text x="220" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">난도 상위 5개 평균 test-pass</text>
  <!-- axis baseline -->
  <line x1="90" y1="330" x2="350" y2="330" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- 1 agent: 19.31% -->
  <rect x="120" y="253" width="80" height="77" rx="4" fill="#93c5fd"/>
  <text x="160" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">19.31%</text>
  <text x="160" y="350" text-anchor="middle" font-size="12" fill="#374151">에이전트 1개</text>
  <!-- 128 agents: 28.78% -->
  <rect x="240" y="215" width="80" height="115" rx="4" fill="#2563eb"/>
  <text x="280" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">28.78%</text>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#374151">에이전트 128개</text>
  <text x="220" y="380" text-anchor="middle" font-size="11" fill="#6b7280">상대 개선 약 +49%</text>

  <!-- Divider -->
  <line x1="420" y1="80" x2="420" y2="380" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Right group: pandoc -->
  <text x="620" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">pandoc 태스크 test-pass</text>
  <line x1="490" y1="330" x2="750" y2="330" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- 1 agent: 33.89% -->
  <rect x="520" y="194" width="80" height="136" rx="4" fill="#93c5fd"/>
  <text x="560" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">33.89%</text>
  <text x="560" y="350" text-anchor="middle" font-size="12" fill="#374151">에이전트 1개</text>
  <!-- 1024 agents: 55.06% -->
  <rect x="640" y="110" width="80" height="220" rx="4" fill="#2563eb"/>
  <text x="680" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">55.06%</text>
  <text x="680" y="350" text-anchor="middle" font-size="12" fill="#374151">에이전트 1,024개</text>
  <text x="620" y="380" text-anchor="middle" font-size="11" fill="#6b7280">+21.17%p</text>

  <text x="420" y="408" text-anchor="middle" font-size="10" fill="#9ca3af">막대 높이는 통과율 비례 · 자체 제작, 데이터: 논문 초록</text>
</svg>
