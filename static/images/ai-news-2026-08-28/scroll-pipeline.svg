<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="420" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">Scroll — 컨텍스트 관리를 프롬프트가 아니라 코드 실행으로</text>

  <!-- pipeline boxes -->
  <rect x="40" y="70" width="200" height="96" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140" y="96" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">① 이벤트 로그</text>
  <text x="140" y="120" text-anchor="middle" fill="#e2e8f0" font-size="12">append-only 무손실 기록</text>
  <text x="140" y="139" text-anchor="middle" fill="#94a3b8" font-size="11.5">대화·도구 결과 원본 보존</text>
  <text x="140" y="156" text-anchor="middle" fill="#94a3b8" font-size="11.5">= 역사적 그라운드 트루스</text>

  <rect x="300" y="70" width="200" height="96" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="400" y="96" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">② Python 커널</text>
  <text x="400" y="120" text-anchor="middle" fill="#e2e8f0" font-size="12">샌드박스 · 세션 내내 유지</text>
  <text x="400" y="139" text-anchor="middle" fill="#94a3b8" font-size="11.5">타입 있는 네임스페이스에</text>
  <text x="400" y="156" text-anchor="middle" fill="#94a3b8" font-size="11.5">세션 상태를 변수로 저장</text>

  <rect x="560" y="70" width="200" height="96" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="660" y="96" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">③ print된 것만 입장</text>
  <text x="660" y="120" text-anchor="middle" fill="#e2e8f0" font-size="12">모델이 코드로 검색·변환 후</text>
  <text x="660" y="139" text-anchor="middle" fill="#94a3b8" font-size="11.5">명시적으로 출력한 투영만</text>
  <text x="660" y="156" text-anchor="middle" fill="#94a3b8" font-size="11.5">다음 호출의 컨텍스트로</text>

  <!-- arrows -->
  <line x1="240" y1="118" x2="295" y2="118" stroke="#64748b" stroke-width="2"/>
  <polygon points="295,113 305,118 295,123" fill="#64748b"/>
  <line x1="500" y1="118" x2="555" y2="118" stroke="#64748b" stroke-width="2"/>
  <polygon points="555,113 565,118 555,123" fill="#64748b"/>

  <!-- loop back -->
  <path d="M 660 166 L 660 196 L 140 196 L 140 166" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="400" y="212" text-anchor="middle" fill="#94a3b8" font-size="11.5">매 호출 반복 — 컨텍스트 관리가 LLM의 코딩 능력을 그대로 물려받는다</text>

  <!-- results bars -->
  <text x="60" y="256" fill="#f8fafc" font-size="14" font-weight="bold">벤치마크 (백본: Qwen3.8-Max, 논문 초록 기준)</text>

  <text x="60" y="288" fill="#e2e8f0" font-size="12.5">LongMemEval_S</text>
  <rect x="200" y="274" width="521" height="20" rx="4" fill="#1e293b"/>
  <rect x="200" y="274" width="494" height="20" rx="4" fill="#38bdf8"/>
  <text x="705" y="289" fill="#38bdf8" font-size="12.5" font-weight="bold" text-anchor="start">94.8%</text>

  <text x="60" y="322" fill="#e2e8f0" font-size="12.5">LOCA_256K</text>
  <rect x="200" y="308" width="521" height="20" rx="4" fill="#1e293b"/>
  <rect x="200" y="308" width="452" height="20" rx="4" fill="#34d399"/>
  <text x="662" y="323" fill="#34d399" font-size="12.5" font-weight="bold" text-anchor="start">86.7%</text>

  <text x="60" y="356" fill="#e2e8f0" font-size="12.5">종전 최고 (LOCA_256K)</text>
  <rect x="200" y="342" width="521" height="20" rx="4" fill="#1e293b"/>
  <rect x="200" y="342" width="257" height="20" rx="4" fill="#64748b"/>
  <text x="467" y="357" fill="#94a3b8" font-size="12.5" text-anchor="start">49.3% (+37.4pt 차이)</text>

  <text x="400" y="396" text-anchor="middle" fill="#64748b" font-size="11">arXiv 2608.21690 · Alibaba Group + Columbia University · 자체 제작</text>
</svg>
