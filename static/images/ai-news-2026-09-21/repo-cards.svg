<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="840" height="440" fill="#fafafa"/>
  <text x="420" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">오늘의 오픈소스 — 검증하는 에이전트 vs 검증 가능한 온디바이스 모델</text>

  <!-- left card -->
  <rect x="40" y="60" width="370" height="330" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="92" font-size="15" font-weight="700" fill="#b91c1c">cloudflare/security-audit-skill</text>
  <text x="60" y="112" font-size="11" fill="#6b7280">Markdown 스킬 + Node.js 검증기 · MIT</text>
  <line x1="60" y1="126" x2="390" y2="126" stroke="#fecaca"/>
  <text x="60" y="150" font-size="12" font-weight="700" fill="#374151">무엇: 코딩 에이전트 → 보안 감사자</text>
  <text x="60" y="172" font-size="12" fill="#4b5563">· 정찰 → 커버리지 기반 헌팅 → 후보 검증</text>
  <text x="60" y="192" font-size="12" fill="#4b5563">· → 구조화 출력 → 독립 재검증 → 리포트</text>
  <text x="60" y="214" font-size="12" font-weight="700" fill="#374151">핵심 설계</text>
  <text x="60" y="236" font-size="12" fill="#4b5563">· 찾은 에이전트 ≠ 검증하는 에이전트</text>
  <text x="60" y="256" font-size="12" fill="#4b5563">· confirmed / needs_validation / rejected 구분</text>
  <text x="60" y="276" font-size="12" fill="#4b5563">· 커버리지 원장(ledger)을 스크립트로 검증</text>
  <text x="60" y="298" font-size="12" font-weight="700" fill="#374151">이럴 때</text>
  <text x="60" y="320" font-size="12" fill="#4b5563">· 자기 레포 정기 보안 감사 자동화</text>
  <text x="60" y="340" font-size="12" fill="#4b5563">· 멀티에이전트 교차 검증 패턴 학습 자료</text>
  <text x="60" y="368" font-size="11" fill="#9ca3af">Cloudflare 취약점 하네스의 출발점이 된 스킬</text>

  <!-- right card -->
  <rect x="430" y="60" width="370" height="330" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="450" y="92" font-size="15" font-weight="700" fill="#a16207">cactus-compute/needle</text>
  <text x="450" y="112" font-size="11" fill="#6b7280">Python SDK · Apache-2.0 · 모델은 HF 배포</text>
  <line x1="450" y1="126" x2="780" y2="126" stroke="#fde68a"/>
  <text x="450" y="150" font-size="12" font-weight="700" fill="#374151">무엇: 8~29MB 단일 바이너리 파운데이션 모델</text>
  <text x="450" y="172" font-size="12" fill="#4b5563">· 모바일·웨어러블·MCU용 툴콜 특화</text>
  <text x="450" y="192" font-size="12" fill="#4b5563">· 툴콜 · 구조화 추출 · 임베딩 3가지 용도</text>
  <text x="450" y="214" font-size="12" font-weight="700" fill="#374151">핵심 설계 (README 주장)</text>
  <text x="450" y="236" font-size="12" fill="#4b5563">· 스키마 컴파일 문법이 토큰을 제약 → 항상 파싱됨</text>
  <text x="450" y="256" font-size="12" fill="#4b5563">· 응답마다 보정된 confidence 점수 동봉</text>
  <text x="450" y="276" font-size="12" fill="#4b5563">· 커버 못 하는 요청엔 빈 리스트 (추측 금지)</text>
  <text x="450" y="298" font-size="12" font-weight="700" fill="#374151">이럴 때</text>
  <text x="450" y="320" font-size="12" fill="#4b5563">· 클라우드 왕복 없는 로컬 툴 라우팅</text>
  <text x="450" y="340" font-size="12" fill="#4b5563">· @needle.tool 데코레이터로 5분 프로토타입</text>
  <text x="450" y="368" font-size="11" fill="#9ca3af">pip install cactus-needle</text>

  <text x="420" y="420" text-anchor="middle" font-size="11" fill="#9ca3af">두 repo 모두 클론으로 존재·내용 확인 (2026-09-21) · 스타 수는 API 접근 제한으로 미검증</text>
</svg>
