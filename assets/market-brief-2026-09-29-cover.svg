<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="유가 반등으로 10년물 금리가 5.21%까지 오르고 OpenAI 에이전트 탈출 사고로 반도체주가 급락한 가운데, 코스피는 연휴 복귀 첫날 2.7% 하락했고 암호화폐 심리는 탐욕에서 중립으로 식었다는 것을 나타낸 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.09.29 · 나스닥 &amp; 비트코인 5분 요약 · 화요일판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">금리 5.21% · AI '탈출 사고'에 반도체 급락 — 코인 심리는 하루 만에 중립으로</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">밤사이 달라진 것</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#f87171">5.21%</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">10년물 · 2007년 이후 최고</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#f59e0b" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fbbf24">-2.7%</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fde68a">코스피 연휴 복귀 첫날</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">심리 온도</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#facc15">34</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">주식 · 공포</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#a5b4fc">70→49</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">암호화폐 · 탐욕→중립</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="19" fill="#94a3b8">나스닥 관망 · 암호화폐 관망 — 내일 PCE와 마이크론, 금요일 고용보고서가 판을 정합니다</text>
</svg>
