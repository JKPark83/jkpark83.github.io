<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="430" fill="#0f172a"/>
  <text x="400" y="34" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="700">오늘의 논문 수치 — RealCLI &amp; TAO</text>

  <!-- left panel: RealCLI -->
  <text x="200" y="72" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">RealCLI: 실행 점수 vs 협업 점수</text>
  <text x="200" y="92" text-anchor="middle" fill="#94a3b8" font-size="11.5">프런티어 에이전트 최고 구성 기준 (%)</text>

  <!-- bars: scale 100% = 220px height, base y=330 -->
  <rect x="110" y="221.8" width="70" height="108.2" fill="#a78bfa" rx="4"/>
  <text x="145" y="212" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">49.2</text>
  <text x="145" y="352" text-anchor="middle" fill="#cbd5e1" font-size="12">태스크 실행</text>
  <text x="145" y="368" text-anchor="middle" fill="#64748b" font-size="11">(EXEC 평균)</text>

  <rect x="220" y="247.3" width="70" height="82.7" fill="#64748b" rx="4"/>
  <text x="255" y="238" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">37.6</text>
  <text x="255" y="352" text-anchor="middle" fill="#cbd5e1" font-size="12">협업 통합 점수</text>
  <text x="255" y="368" text-anchor="middle" fill="#64748b" font-size="11">(J_collab 최고)</text>

  <line x1="90" y1="330" x2="310" y2="330" stroke="#334155" stroke-width="1.5"/>
  <text x="200" y="398" text-anchor="middle" fill="#94a3b8" font-size="11.5">잘 "실행"해도 조종 가능성·신뢰 보정·안전 경계는</text>
  <text x="200" y="414" text-anchor="middle" fill="#94a3b8" font-size="11.5">별개 축 — 협업 점수가 11.6p 더 낮다</text>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="400" stroke="#1e293b" stroke-width="2"/>

  <!-- right panel: TAO -->
  <text x="595" y="72" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">TAO: 툴 인지 스케줄링 개선폭</text>
  <text x="595" y="92" text-anchor="middle" fill="#94a3b8" font-size="11.5">최고 SOTA 베이스라인 대비, 최대치 (%)</text>

  <!-- horizontal bars: scale 40% = 240px -->
  <text x="450" y="140" fill="#cbd5e1" font-size="12.5">지연시간</text>
  <rect x="450" y="150" width="160.8" height="24" fill="#34d399" rx="4"/>
  <text x="620" y="167" fill="#e2e8f0" font-size="14" font-weight="700">-26.8%</text>

  <text x="450" y="212" fill="#cbd5e1" font-size="12.5">TTFT (첫 토큰까지)</text>
  <rect x="450" y="222" width="217.8" height="24" fill="#34d399" rx="4"/>
  <text x="677" y="239" fill="#e2e8f0" font-size="14" font-weight="700">-36.3%</text>

  <text x="450" y="284" fill="#cbd5e1" font-size="12.5">디코드 처리량</text>
  <rect x="450" y="294" width="177" height="24" fill="#38bdf8" rx="4"/>
  <text x="636" y="311" fill="#e2e8f0" font-size="14" font-weight="700">+29.5%</text>

  <text x="595" y="365" text-anchor="middle" fill="#94a3b8" font-size="11.5">GPU 추론과 CPU 툴 실행을 묶어 스케줄링:</text>
  <text x="595" y="381" text-anchor="middle" fill="#94a3b8" font-size="11.5">툴 리턴 시점·캐시 크레딧·토큰 풋프린트 기반 배치</text>

  <text x="400" y="426" text-anchor="middle" fill="#64748b" font-size="10.5">출처: arXiv 2610.22507, 2610.37230 (논문 보고치, arXiv API 검증)</text>
</svg>
