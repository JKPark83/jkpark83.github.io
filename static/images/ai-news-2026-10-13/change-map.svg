<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="430" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">오늘의 AI 변화 지도 — 2026-10-13</text>

  <!-- 중앙 허브 -->
  <circle cx="400" cy="230" r="46" fill="#1a1a2e"/>
  <text x="400" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">위임과</text>
  <text x="400" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">검증</text>

  <!-- 연결선 -->
  <line x1="400" y1="184" x2="205" y2="128" stroke="#bbb" stroke-width="1.5"/>
  <line x1="400" y1="184" x2="595" y2="128" stroke="#bbb" stroke-width="1.5"/>
  <line x1="400" y1="276" x2="205" y2="330" stroke="#bbb" stroke-width="1.5"/>
  <line x1="400" y1="276" x2="595" y2="330" stroke="#bbb" stroke-width="1.5"/>

  <!-- 벤더 -->
  <rect x="30" y="60" width="350" height="115" rx="12" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="50" y="86" font-size="14" font-weight="700" fill="#b5431a">🤖 벤더</text>
  <text x="50" y="110" font-size="12" fill="#333">Meta Muse Wonder 출시 — 예약·업무 '실행형 에이전트'</text>
  <text x="50" y="129" font-size="12" fill="#333">상위 모델 Wonder Full은 Muse Code 구독 전용</text>
  <text x="50" y="151" font-size="12" fill="#b5431a">프런티어 4파전: 에이전트가 과금 단위가 된다</text>

  <!-- 논문 -->
  <rect x="420" y="60" width="350" height="115" rx="12" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="440" y="86" font-size="14" font-weight="700" fill="#1d4ed8">📚 논문</text>
  <text x="440" y="110" font-size="12" fill="#333">AgentSWE: 에이전트가 만든 에이전트, 평균 11.2/100점</text>
  <text x="440" y="129" font-size="12" fill="#333">RATED: 장애 인지 툴 검색 — 오선택 86.2%→2.9%</text>
  <text x="440" y="151" font-size="12" fill="#1d4ed8">시연은 통과, 납품은 불합격 — 검증이 병목</text>

  <!-- 오픈소스 -->
  <rect x="30" y="285" width="350" height="115" rx="12" fill="#eefbf2" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="50" y="311" font-size="14" font-weight="700" fill="#047857">🛠 오픈소스</text>
  <text x="50" y="335" font-size="12" fill="#333">cua: 에이전트에게 통째로 내주는 데스크톱 (Spaces)</text>
  <text x="50" y="354" font-size="12" fill="#333">docker-agent: YAML 선언형 멀티 에이전트 + OCI 배포</text>
  <text x="50" y="376" font-size="12" fill="#047857">에이전트 런타임이 인프라 레이어로 내려간다</text>

  <!-- 툴링 -->
  <rect x="420" y="285" width="350" height="115" rx="12" fill="#f3efff" stroke="#6250d6" stroke-width="1.5"/>
  <text x="440" y="311" font-size="14" font-weight="700" fill="#5b21b6">🧑‍💻 툴링</text>
  <text x="440" y="335" font-size="12" fill="#333">Codex: 독립 런타임끼리 공유하는 메시지 보드 + 권한</text>
  <text x="440" y="354" font-size="12" fill="#333">CC: 스킬·서브에이전트 frontmatter 훅, once 옵션</text>
  <text x="440" y="376" font-size="12" fill="#5b21b6">멀티 에이전트 조율 수단이 CLI에 내장되는 중</text>
</svg>
