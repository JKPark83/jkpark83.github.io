<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="400" fill="#fafafa"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">MMDM: 지식은 강하고, 제약·다중선택은 약하다</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#666">Hard Single-select 정확도(%) — 최상위권 모델 Perplexity Decider-V1.2 기준</text>

  <!-- gridlines -->
  <g stroke="#e2e2e2" stroke-width="1">
    <line x1="260" y1="80" x2="260" y2="310"/>
    <line x1="370" y1="80" x2="370" y2="310"/>
    <line x1="480" y1="80" x2="480" y2="310"/>
    <line x1="590" y1="80" x2="590" y2="310"/>
    <line x1="700" y1="80" x2="700" y2="310"/>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="260" y="328">0</text>
    <text x="370" y="328">25</text>
    <text x="480" y="328">50</text>
    <text x="590" y="328">75</text>
    <text x="700" y="328">100</text>
  </g>

  <!-- bars: value * 4.4 px -->
  <g font-size="13.5">
    <text x="248" y="112" text-anchor="end" fill="#333">세계 지식</text>
    <rect x="260" y="96" width="346.5" height="26" rx="4" fill="#4e86d4"/>
    <text x="614" y="114" fill="#1f4e9c" font-weight="700">78.75</text>

    <text x="248" y="168" text-anchor="end" fill="#333">옵션 간 논리</text>
    <rect x="260" y="152" width="237.4" height="26" rx="4" fill="#e8a33d"/>
    <text x="505" y="170" fill="#9a6a1d" font-weight="700">53.95</text>

    <text x="248" y="224" text-anchor="end" fill="#333">제약 계획</text>
    <rect x="260" y="208" width="211" height="26" rx="4" fill="#e8a33d"/>
    <text x="479" y="226" fill="#9a6a1d" font-weight="700">47.95</text>

    <text x="248" y="280" text-anchor="end" fill="#333">다중선택 (Hard)</text>
    <rect x="260" y="264" width="162" height="26" rx="4" fill="#d4604e"/>
    <text x="430" y="282" fill="#a33" font-weight="700">36.81</text>
  </g>
  <text x="260" y="302" font-size="11.5" fill="#888">* 다중선택은 28개 평가 모델 전체의 최고치</text>

  <text x="400" y="368" text-anchor="middle" font-size="13" fill="#555">5,448문항 · 16개 과제 유형 · 옵션 2~1,024개 · 입력 최대 64,817 토큰 (arXiv 2611.14309)</text>
</svg>
