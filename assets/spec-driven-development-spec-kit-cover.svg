<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="명세 주도 개발(Spec-Driven Development)을 나타낸 그림. 왼쪽에는 '바이브 코딩'이라고 적힌 채 두루뭉술한 프롬프트 하나가 곧장 코드로 이어지고, 의도가 표류해 재작업 화살표가 빙빙 도는 모습이 있다. 오른쪽에는 constitution, specify, plan, tasks, implement로 이어지는 다섯 칸의 파이프라인이 있고, 각 단계가 spec.md, plan.md, tasks.md 같은 파일 산출물을 남기며 마지막에 깔끔한 코드로 수렴한다. 아래 띠에는 '명세가 single source of truth'라는 문구와 함께 GitHub Spec Kit이 별 12만 개를 넘겼다는 사실이 적혀 있다.">
  <defs>
    <linearGradient id="sdg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="sd-file" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <marker id="sd-arrow" markerWidth="14" markerHeight="14" refX="9" refY="7" orient="auto">
      <path d="M0,1 L13,7 L0,13 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="sd-arrow-r" markerWidth="14" markerHeight="14" refX="9" refY="7" orient="auto">
      <path d="M0,1 L13,7 L0,13 Z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#sdg)"/>

  <!-- title -->
  <text x="80" y="92" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="50" font-weight="800">명세 주도 개발</text>
  <text x="80" y="136" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="500">Spec-Driven Development · 코딩 에이전트에게 '무엇을' 먼저 못박기</text>

  <!-- divider label -->
  <line x1="470" y1="180" x2="470" y2="500" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- LEFT: vibe coding -->
  <text x="90" y="205" fill="#fb7185" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700">바이브 코딩</text>
  <rect x="90" y="230" width="300" height="66" rx="12" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="240" y="262" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="600">"대충 이런 앱 만들어줘"</text>
  <text x="240" y="285" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="15">두루뭉술한 프롬프트 한 방</text>

  <path d="M240,296 L240,344" stroke="#fb7185" stroke-width="2.5" fill="none" marker-end="url(#sd-arrow-r)"/>
  <rect x="120" y="352" width="240" height="58" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="240" y="387" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="16">코드 (의도 불명)</text>

  <!-- rework loop -->
  <path d="M360,381 C440,381 440,300 372,266" stroke="#fb7185" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#sd-arrow-r)"/>
  <text x="240" y="452" text-anchor="middle" fill="#fb7185" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600">표류 → 재작업 → 표류 …</text>

  <!-- RIGHT: SDD pipeline -->
  <text x="520" y="205" fill="#38bdf8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700">명세 주도(SDD)</text>

  <!-- five stages -->
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="520" y="228" width="120" height="50" rx="9" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="580" y="258" text-anchor="middle" fill="#c4b5fd" font-size="16.5" font-weight="700">constitution</text>

    <rect x="660" y="228" width="110" height="50" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="715" y="258" text-anchor="middle" fill="#7dd3fc" font-size="16.5" font-weight="700">specify</text>

    <rect x="790" y="228" width="90" height="50" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="835" y="258" text-anchor="middle" fill="#7dd3fc" font-size="16.5" font-weight="700">plan</text>

    <rect x="900" y="228" width="90" height="50" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="945" y="258" text-anchor="middle" fill="#7dd3fc" font-size="16.5" font-weight="700">tasks</text>

    <rect x="1010" y="228" width="120" height="50" rx="9" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="1070" y="258" text-anchor="middle" fill="#6ee7b7" font-size="16.5" font-weight="700">implement</text>
  </g>
  <!-- connectors -->
  <path d="M640,253 L658,253" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#sd-arrow)"/>
  <path d="M770,253 L788,253" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#sd-arrow)"/>
  <path d="M880,253 L898,253" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#sd-arrow)"/>
  <path d="M990,253 L1008,253" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#sd-arrow)"/>

  <!-- artifacts row -->
  <g font-family="ui-monospace,monospace" font-size="14.5">
    <rect x="655" y="316" width="120" height="40" rx="7" fill="url(#sd-file)" opacity="0.9"/>
    <text x="715" y="341" text-anchor="middle" fill="#0b1220" font-weight="700">spec.md</text>
    <rect x="790" y="316" width="90" height="40" rx="7" fill="url(#sd-file)" opacity="0.9"/>
    <text x="835" y="341" text-anchor="middle" fill="#0b1220" font-weight="700">plan.md</text>
    <rect x="900" y="316" width="90" height="40" rx="7" fill="url(#sd-file)" opacity="0.9"/>
    <text x="945" y="341" text-anchor="middle" fill="#0b1220" font-weight="700">tasks.md</text>
  </g>
  <path d="M715,278 L715,314" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M835,278 L835,314" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M945,278 L945,314" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 4"/>

  <!-- converge to clean code -->
  <path d="M1070,278 L1070,400 L720,400 L720,362" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#sd-arrow)"/>
  <rect x="880" y="386" width="250" height="58" rx="10" fill="#0b1220" stroke="#34d399"/>
  <text x="1005" y="421" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">명세대로 구현된 코드 · 리뷰 가능</text>

  <!-- bottom band -->
  <rect x="0" y="520" width="1200" height="110" fill="#0b1220"/>
  <text x="80" y="566" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700">명세(spec)가 single source of truth — 코드가 아니라 '무엇을'이 자산이다</text>
  <text x="80" y="602" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="18">GitHub Spec Kit ★ 127k · MIT · specify-cli · 2025-09 공개, 30+ 에이전트 지원</text>
</svg>
