  <text x="50" y="290" font-size="15" font-weight="700" fill="#9c6a1f">🛠 오픈소스</text>
  <text x="50" y="318" font-size="14" font-weight="600" fill="#222">HKUDS/nanobot v0.4.0</text>
  <text x="50" y="340" font-size="12.5" fill="#444">초경량 셀프호스팅 개인 에이전트 프레임워크</text>
  <text x="50" y="368" font-size="14" font-weight="600" fill="#222">claude-mem v15.7.0</text>
  <text x="50" y="390" font-size="12.5" fill="#444">Claude Code 세션 간 영속 메모리 압축</text>

