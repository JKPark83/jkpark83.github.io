<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="400" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">가드레일 3종 비교 — 오늘 나온 fail-closed 패턴</text>

  <!-- Codex card -->
  <rect x="30" y="56" width="236" height="290" rx="12" fill="#f0fbf2" stroke="#b5dfc0"/>
  <text x="148" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1e7a35">🟩 Codex Guardian</text>
  <text x="148" y="112" text-anchor="middle" font-size="12" fill="#555">동기 리뷰어가 위험 액션 거부</text>
  <line x1="50" y1="126" x2="246" y2="126" stroke="#b5dfc0"/>
  <text x="48" y="150" font-size="12.5" fill="#333">새 기능: 거부 1회 재심</text>
  <text x="48" y="170" font-size="11.5" fill="#666">guardian_denial_</text>
  <text x="48" y="186" font-size="11.5" fill="#666">reconsideration (기본 off)</text>
  <text x="48" y="212" font-size="12.5" fill="#333">같은 리뷰 세션·증거·마감 재사용</text>
  <text x="48" y="232" font-size="12.5" fill="#333">유효한 재평가만 거부를 대체</text>
  <text x="48" y="252" font-size="12.5" fill="#333">실패/무효 → 원래 거부 유지</text>
  <text x="48" y="282" font-size="12" font-weight="600" fill="#1e7a35">실패 기본값: 거부 유지</text>
  <text x="48" y="306" font-size="11.5" fill="#666">커스텀 프롬프트 1,000바이트 제한</text>
  <text x="48" y="324" font-size="11.5" fill="#666">새 권한 부여 없음</text>

  <!-- Claude Code card -->
  <rect x="282" y="56" width="236" height="290" rx="12" fill="#eef4ff" stroke="#b9cdf2"/>
  <text x="400" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e9c">🟦 Claude Code 훅</text>
  <text x="400" y="112" text-anchor="middle" font-size="12" fill="#555">Agent SDK 훅 콜백 (v2.1.317)</text>
  <line x1="302" y1="126" x2="498" y2="126" stroke="#b9cdf2"/>
  <text x="300" y="150" font-size="12.5" fill="#333">새 기능: onFailure: "block"</text>
  <text x="300" y="176" font-size="12.5" fill="#333">훅 콜백이 던지거나 죽으면</text>
  <text x="300" y="196" font-size="12.5" fill="#333">액션을 그냥 실행하는 대신 차단</text>
  <text x="300" y="222" font-size="12.5" fill="#333">보안·권한 검사 훅에 필수적인</text>
  <text x="300" y="242" font-size="12.5" fill="#333">의미 변화 (기존엔 fail-open)</text>
  <text x="300" y="282" font-size="12" font-weight="600" fill="#1f4e9c">실패 기본값: 선택 가능해짐</text>
  <text x="300" y="306" font-size="11.5" fill="#666">검사 훅 = block,</text>
  <text x="300" y="324" font-size="11.5" fill="#666">로깅 훅 = 기존 동작 유지 권장</text>

  <!-- LeanGuard card -->
  <rect x="534" y="56" width="236" height="290" rx="12" fill="#fff7ec" stroke="#eed3a8"/>
  <text x="652" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#9c6a1f">🟪 LeanGuard (연구)</text>
  <text x="652" y="112" text-anchor="middle" font-size="12" fill="#555">Lean4 증명 기반 정책 검사</text>
  <line x1="554" y1="126" x2="750" y2="126" stroke="#eed3a8"/>
  <text x="552" y="150" font-size="12.5" fill="#333">모든 툴 콜을 실행 전에 검사</text>
  <text x="552" y="176" font-size="12.5" fill="#333">판정 절차가 LeanLTL 의미론과</text>
  <text x="552" y="196" font-size="12.5" fill="#333">동치임을 증명</text>
  <text x="552" y="222" font-size="12.5" fill="#333">거부 시: 규칙+힌트 피드백 또는</text>
  <text x="552" y="242" font-size="12.5" fill="#333">증명 기반 콜 수선</text>
  <text x="552" y="282" font-size="12" font-weight="600" fill="#9c6a1f">실패 기본값: fail-closed</text>
  <text x="552" y="306" font-size="11.5" fill="#666">금지 콜 33+ → 0</text>
  <text x="552" y="324" font-size="11.5" fill="#666">인젝션 57.9% → 5.9%</text>

  <text x="400" y="380" text-anchor="middle" font-size="12.5" fill="#666">셋 다 같은 질문에 답한다: "검사가 실패하면 액션을 실행할 것인가?" — 오늘의 답은 모두 "아니오"</text>
</svg>
