<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="270" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">오늘의 실전 팁 — 에이전트 런타임 하드닝 편</text>

  <!-- Claude Code -->
  <rect x="30" y="50" width="360" height="185" rx="12" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="50" y="80" font-size="14" font-weight="700" fill="#1d4ed8">🟦 Claude Code — mods/ 소스 공개</text>
  <text x="50" y="108" font-size="12" fill="#333">내장 보안 mod(sec-default)의 전체 소스가</text>
  <text x="50" y="128" font-size="12" fill="#333">레포 mods/에 공개 — 10/11 업데이트로</text>
  <text x="50" y="148" font-size="12" fill="#333">고정 환경변수 보호(pinned-variable) 추가</text>
  <text x="50" y="176" font-size="12" fill="#1d4ed8">플러그인이 정책 경로·로그인 변수를 못 바꾸게</text>
  <text x="50" y="196" font-size="12" fill="#1d4ed8">막는 실전 훅 패턴을 소스로 학습 가능</text>
  <text x="50" y="222" font-size="11.5" fill="#555">claude --plugin-dir mods/diff 로 직접 실행</text>

  <!-- Codex -->
  <rect x="410" y="50" width="360" height="185" rx="12" fill="#eefbf2" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="430" y="80" font-size="14" font-weight="700" fill="#047857">🟩 Codex — /daemon 서버 재시작</text>
  <text x="430" y="108" font-size="12" fill="#333">백그라운드 서버가 켜질 때 설정이 박제돼</text>
  <text x="430" y="128" font-size="12" fill="#333">config 고쳐도 경고가 남는 문제 → TUI 안</text>
  <text x="430" y="148" font-size="12" fill="#333">/daemon에서 바로 재시작 (10/11 머지)</text>
  <text x="430" y="176" font-size="12" fill="#047857">다른 채팅의 진행 중 작업 중단 경고 포함,</text>
  <text x="430" y="196" font-size="12" fill="#047857">TUI가 꺼져도 재시작은 끝까지 진행</text>
  <text x="430" y="222" font-size="11.5" fill="#555">codex agents로 띄운 서버에도 적용</text>
</svg>
