  <text x="50" y="218" font-size="12" fill="#047857">출력은 자르지 않고 통째로 유지/드롭</text>
  <text x="50" y="246" font-size="11" fill="#888">기본 꺼짐 · 10/10 머지 (#52937)</text>

  <!-- CC 카드 -->
  <rect x="410" y="56" width="360" height="210" rx="12" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="430" y="86" font-size="14" font-weight="700" fill="#1d4ed8">🟦 Claude Code</text>
