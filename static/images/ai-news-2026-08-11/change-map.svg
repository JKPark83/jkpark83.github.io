<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="820" height="500" rx="16" fill="#0f172a"/>
