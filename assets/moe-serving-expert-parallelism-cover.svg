<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="왼쪽에는 671B짜리 거대한 MoE 모델 블록 하나가 GPU 한 장보다 훨씬 커서 담기지 않는 모습이 그려져 있고, 붉은 X 표시가 있다. 오른쪽에는 여덟 개의 GPU가 격자로 놓여 각 GPU가 전문가(expert) 몇 개씩을 나눠 들고 있으며, GPU들 사이를 오가는 all-to-all 화살표가 토큰을 각자의 전문가로 보내고 다시 모으는 모습을 보여 준다. 이것이 expert parallelism이다.">
  <defs>
    <linearGradient id="moe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111f38"/>
    </linearGradient>
    <linearGradient id="moe-big" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="moe-gpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a44"/><stop offset="1" stop-color="#0b2036"/>
    </linearGradient>
    <marker id="moe-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#moe-bg)"/>

  <!-- title -->
  <text x="60" y="88" fill="#e5edf7" font-family="'Segoe UI',system-ui,sans-serif" font-size="46" font-weight="800">MoE 서빙 &amp; Expert Parallelism</text>
  <text x="60" y="132" fill="#7f9cbd" font-family="'Segoe UI',system-ui,sans-serif" font-size="24">전문가를 GPU에 나눠 얹어 거대한 스파스 모델을 굴리기</text>

  <!-- LEFT: one giant model doesn't fit -->
  <g>
    <text x="255" y="210" text-anchor="middle" fill="#c4b5fd" font-family="'Segoe UI',system-ui,sans-serif" font-size="21" font-weight="700">모델 하나 = 671B</text>
    <rect x="120" y="235" width="270" height="300" rx="16" fill="url(#moe-big)" stroke="#a78bfa" stroke-width="2"/>
    <text x="255" y="330" text-anchor="middle" fill="#ede9fe" font-family="'Segoe UI',system-ui,sans-serif" font-size="30" font-weight="800">256 experts</text>
    <text x="255" y="372" text-anchor="middle" fill="#ddd6fe" font-family="'Segoe UI',system-ui,sans-serif" font-size="20">+ shared expert</text>
    <text x="255" y="430" text-anchor="middle" fill="#c4b5fd" font-family="'Segoe UI',system-ui,sans-serif" font-size="18">한 GPU에 안 들어감</text>
    <!-- small gpu outline for scale -->
    <rect x="150" y="452" width="120" height="66" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="210" y="491" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI',system-ui,sans-serif" font-size="16">1 GPU</text>
    <!-- red X -->
    <line x1="150" y1="255" x2="360" y2="515" stroke="#ef4444" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- arrow to right -->
  <path d="M405 385 L470 385" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#moe-ar)"/>
  <text x="437" y="365" text-anchor="middle" fill="#7f9cbd" font-family="'Segoe UI',system-ui,sans-serif" font-size="16">EP</text>

  <!-- RIGHT: experts sharded across GPUs with all-to-all -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <text x="820" y="210" text-anchor="middle" fill="#7dd3fc" font-size="21" font-weight="700">전문가를 GPU들에 쪼개서 (Expert Parallelism)</text>
    <!-- 8 gpu cells 4x2 -->
    <!-- row1 -->
    <g>
      <rect x="520" y="240" width="140" height="120" rx="12" fill="url(#moe-gpu)" stroke="#38bdf8" stroke-width="2"/>
      <text x="590" y="266" text-anchor="middle" fill="#7dd3fc" font-size="15">GPU0</text>
      <rect x="536" y="280" width="46" height="30" rx="5" fill="#0ea5e9" opacity=".85"/><rect x="590" y="280" width="46" height="30" rx="5" fill="#0ea5e9" opacity=".55"/>
      <rect x="536" y="318" width="46" height="30" rx="5" fill="#0ea5e9" opacity=".7"/><rect x="590" y="318" width="46" height="30" rx="5" fill="#0ea5e9" opacity=".4"/>
    </g>
    <g>
      <rect x="680" y="240" width="140" height="120" rx="12" fill="url(#moe-gpu)" stroke="#38bdf8" stroke-width="2"/>
      <text x="750" y="266" text-anchor="middle" fill="#7dd3fc" font-size="15">GPU1</text>
      <rect x="696" y="280" width="46" height="30" rx="5" fill="#22c55e" opacity=".85"/><rect x="750" y="280" width="46" height="30" rx="5" fill="#22c55e" opacity=".5"/>
      <rect x="696" y="318" width="46" height="30" rx="5" fill="#22c55e" opacity=".7"/><rect x="750" y="318" width="46" height="30" rx="5" fill="#22c55e" opacity=".4"/>
    </g>
    <g>
      <rect x="840" y="240" width="140" height="120" rx="12" fill="url(#moe-gpu)" stroke="#38bdf8" stroke-width="2"/>
      <text x="910" y="266" text-anchor="middle" fill="#7dd3fc" font-size="15">GPU2</text>
      <rect x="856" y="280" width="46" height="30" rx="5" fill="#f59e0b" opacity=".85"/><rect x="910" y="280" width="46" height="30" rx="5" fill="#f59e0b" opacity=".5"/>
      <rect x="856" y="318" width="46" height="30" rx="5" fill="#f59e0b" opacity=".7"/><rect x="910" y="318" width="46" height="30" rx="5" fill="#f59e0b" opacity=".4"/>
    </g>
    <g>
      <rect x="1000" y="240" width="140" height="120" rx="12" fill="url(#moe-gpu)" stroke="#38bdf8" stroke-width="2"/>
      <text x="1070" y="266" text-anchor="middle" fill="#7dd3fc" font-size="15">GPU3</text>
      <rect x="1016" y="280" width="46" height="30" rx="5" fill="#e879f9" opacity=".85"/><rect x="1070" y="280" width="46" height="30" rx="5" fill="#e879f9" opacity=".5"/>
      <rect x="1016" y="318" width="46" height="30" rx="5" fill="#e879f9" opacity=".7"/><rect x="1070" y="318" width="46" height="30" rx="5" fill="#e879f9" opacity=".4"/>
    </g>

    <!-- all-to-all bus -->
    <rect x="520" y="400" width="620" height="30" rx="8" fill="#0b2036" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="830" y="421" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="700">all-to-all dispatch / combine  (DeepEP)</text>
    <!-- connectors -->
    <line x1="590" y1="360" x2="590" y2="400" stroke="#38bdf8" stroke-width="2"/>
    <line x1="750" y1="360" x2="750" y2="400" stroke="#22c55e" stroke-width="2"/>
    <line x1="910" y1="360" x2="910" y2="400" stroke="#f59e0b" stroke-width="2"/>
    <line x1="1070" y1="360" x2="1070" y2="400" stroke="#e879f9" stroke-width="2"/>

    <!-- tokens flowing in -->
    <text x="520" y="470" fill="#94a3b8" font-size="15">토큰 → router가 top-8 전문가 선택 → 각 전문가가 있는 GPU로 보냄 → 결과를 다시 모음</text>
  </g>

  <text x="1140" y="600" text-anchor="end" fill="#43546b" font-family="'Segoe UI',system-ui,sans-serif" font-size="16">jkpark83.github.io · AI 엔지니어링</text>
</svg>
