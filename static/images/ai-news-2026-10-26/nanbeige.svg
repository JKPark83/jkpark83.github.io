<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Nanbeige4.3-33B vs 비교군 최고치 (제조사 발표)</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6b7280">비교군: Qwen3.8-27B · Muse-Glimmer-30B · Gemma4-31B 중 각 벤치마크 최고 점수</text>

  <!-- legend -->
  <rect x="250" y="70" width="12" height="12" rx="3" fill="#2563eb"/>
  <text x="268" y="81" font-size="12" fill="#374151">Nanbeige4.3-33B</text>
  <rect x="420" y="70" width="12" height="12" rx="3" fill="#9ca3af"/>
  <text x="438" y="81" font-size="12" fill="#374151">비교군 최고</text>

  <!-- Terminal-Bench 2.1 : 80.9 vs 73.0 -->
  <text x="190" y="124" text-anchor="end" font-size="13" font-weight="600" fill="#111827">Terminal-Bench 2.1</text>
  <rect x="200" y="106" width="420.7" height="18" rx="4" fill="#2563eb"/>
  <text x="628" y="120" font-size="12" font-weight="700" fill="#111827">80.9</text>
  <rect x="200" y="128" width="379.6" height="18" rx="4" fill="#9ca3af"/>
  <text x="587" y="142" font-size="12" fill="#6b7280">73.0</text>

  <!-- DeepSWE : 65.5 vs 42.5 -->
  <text x="190" y="192" text-anchor="end" font-size="13" font-weight="600" fill="#111827">DeepSWE</text>
  <rect x="200" y="174" width="340.6" height="18" rx="4" fill="#2563eb"/>
  <text x="548" y="188" font-size="12" font-weight="700" fill="#111827">65.5</text>
  <rect x="200" y="196" width="221" height="18" rx="4" fill="#9ca3af"/>
  <text x="428" y="210" font-size="12" fill="#6b7280">42.5</text>

  <!-- SWE-Bench Pro : 60.3 vs 61.7 -->
  <text x="190" y="260" text-anchor="end" font-size="13" font-weight="600" fill="#111827">SWE-Bench Pro</text>
  <rect x="200" y="242" width="313.6" height="18" rx="4" fill="#2563eb"/>
  <text x="521" y="256" font-size="12" font-weight="700" fill="#111827">60.3</text>
  <rect x="200" y="264" width="320.8" height="18" rx="4" fill="#9ca3af"/>
  <text x="528" y="278" font-size="12" fill="#6b7280">61.7 (Qwen3.8-27B)</text>

  <!-- GDPval : 84.8 vs 86.4 -->
  <text x="190" y="328" text-anchor="end" font-size="13" font-weight="600" fill="#111827">GDPval</text>
  <rect x="200" y="310" width="441" height="18" rx="4" fill="#2563eb"/>
  <text x="648" y="324" font-size="12" font-weight="700" fill="#111827">84.8</text>
  <rect x="200" y="332" width="449.3" height="18" rx="4" fill="#9ca3af"/>
  <text x="656" y="346" font-size="12" fill="#6b7280">86.4</text>

  <!-- axis -->
  <line x1="200" y1="362" x2="720" y2="362" stroke="#e5e7eb"/>
  <text x="200" y="380" font-size="11" fill="#9ca3af">0</text>
  <text x="460" y="380" text-anchor="middle" font-size="11" fill="#9ca3af">50</text>
  <text x="720" y="380" text-anchor="end" font-size="11" fill="#9ca3af">100</text>

  <text x="400" y="406" text-anchor="middle" font-size="12" fill="#9ca3af">터미널·이슈 해결 류 agentic 과제에서 크게 앞서고, SWE-Bench Pro·GDPval은 근소하게 뒤진다 — 전부 자체 측정치</text>
</svg>
