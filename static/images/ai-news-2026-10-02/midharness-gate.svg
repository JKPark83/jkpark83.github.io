<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Mid-Harness: 모델과 하네스 사이의 액션 검증 게이트</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#8a90a3">arXiv 2609.39982 — 생성기·하네스는 그대로, 실행 직전 액션만 걸러낸다</text>

  <!-- pipeline -->
  <rect x="40" y="90" width="150" height="70" rx="12" fill="#eef3fc" stroke="#4a7fd4" stroke-width="2"/>
  <text x="115" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#2d5bb0">생성 모델</text>
  <text x="115" y="140" text-anchor="middle" font-size="11" fill="#555f77">(TMAX-9B)</text>

  <path d="M190 125 L235 125" stroke="#8a90a3" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a90a3"/></marker></defs>

  <rect x="240" y="78" width="160" height="94" rx="12" fill="#fdf8ec" stroke="#d4a94a" stroke-width="2"/>
  <text x="320" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#a8842f">후보 액션 N개 샘플</text>
  <text x="320" y="126" text-anchor="middle" font-size="11" fill="#555f77">같은 상태에서</text>
  <text x="320" y="144" text-anchor="middle" font-size="11" fill="#555f77">명령 후보를 병렬 생성</text>

  <path d="M400 125 L445 125" stroke="#8a90a3" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="450" y="78" width="160" height="94" rx="12" fill="#fdf0ee" stroke="#d4604a" stroke-width="2"/>
  <text x="530" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#b03a2d">검증자 (Verifier)</text>
  <text x="530" y="126" text-anchor="middle" font-size="11" fill="#555f77">최선의 후보 1개 선택</text>
  <text x="530" y="144" text-anchor="middle" font-size="11" fill="#555f77">(GPT-5.6 Sol 사용 시 최대 효과)</text>

  <path d="M610 125 L655 125" stroke="#8a90a3" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="660" y="90" width="110" height="70" rx="12" fill="#f0fbf4" stroke="#3fa96b" stroke-width="2"/>
  <text x="715" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#27804d">터미널 실행</text>
  <text x="715" y="140" text-anchor="middle" font-size="11" fill="#555f77">1개만 환경에 반영</text>

  <text x="400" y="205" text-anchor="middle" font-size="12" fill="#555f77">나쁜 명령(잘못된 패키지 설치 등)이 환경을 망치기 전에 차단 → 궤적 전체의 성공률 상승</text>

  <!-- result bars -->
  <text x="400" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">TerminalBench-Lite Pass@1 (논문 보고치)</text>

  <rect x="150" y="270" width="250" height="34" rx="6" fill="#c9d4e8"/>
  <text x="160" y="292" font-size="12" font-weight="700" fill="#1a1a2e">기본 (게이트 없음)</text>
  <text x="410" y="292" font-size="13" font-weight="700" fill="#555f77">50.00%</text>

  <rect x="150" y="316" width="340" height="34" rx="6" fill="#4a7fd4"/>
  <text x="160" y="338" font-size="12" font-weight="700" fill="#ffffff">+ 액션 8개 샘플 · 검증 게이트</text>
  <text x="500" y="338" font-size="13" font-weight="700" fill="#2d5bb0">68.03%</text>

  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#8a90a3">약한 검증자는 샘플을 늘려도 이득이 거의 없음 — 게이트의 성능은 검증자 품질이 좌우</text>
  <text x="400" y="412" text-anchor="middle" font-size="11" fill="#8a90a3">액션 스케일링 + 궤적 스케일링 조합이 궤적만 늘리는 것보다 토큰 비용 대비 효율적</text>
</svg>
