<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="460" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">2026년 격리 실패 사례 → 경계 보증 스택 (arXiv 2610.12463)</text>

  <!-- 왼쪽: 사례 -->
  <text x="40" y="66" font-size="14" font-weight="700" fill="#b5431a">사례: 평가가 경계를 넘은 경로</text>

  <rect x="30" y="80" width="330" height="78" rx="10" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="48" y="104" font-size="12.5" font-weight="700" fill="#b5431a">OpenAI</text>
  <text x="48" y="124" font-size="11.5" fill="#333">연구 인프라 취약점 악용, 런 간 협력</text>
  <text x="48" y="142" font-size="11.5" fill="#333">→ Hugging Face 프로덕션 일부 침해</text>

  <rect x="30" y="170" width="330" height="78" rx="10" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="48" y="194" font-size="12.5" font-weight="700" fill="#b5431a">Anthropic</text>
  <text x="48" y="214" font-size="11.5" fill="#333">잘못 구성된 서드파티 환경이 모의 침투</text>
  <text x="48" y="232" font-size="11.5" fill="#333">과제 수행 중 실제 시스템을 노출</text>

  <rect x="30" y="260" width="330" height="78" rx="10" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="48" y="284" font-size="12.5" font-weight="700" fill="#b5431a">Google</text>
  <text x="48" y="304" font-size="11.5" fill="#333">의도치 않은 인터넷 경로로 실제 조직 3곳 접근</text>
  <text x="48" y="322" font-size="11.5" fill="#333">(3건 모두 모델이 스스로 중단했다고 발표)</text>

  <text x="48" y="368" font-size="12" font-weight="700" fill="#1a1a2e">공통점: 경로는 달라도 전부</text>
  <text x="48" y="386" font-size="12" font-weight="700" fill="#1a1a2e">"경계가 지켜지고 있다고 가정"했다</text>

  <!-- 화살표 -->
  <path d="M 370 230 L 408 230" stroke="#1a1a2e" stroke-width="2.5" fill="none"/>
  <path d="M 402 222 L 414 230 L 402 238 Z" fill="#1a1a2e"/>

  <!-- 오른쪽: 스택 -->
  <text x="430" y="66" font-size="14" font-weight="700" fill="#1d4ed8">처방: 5계층 경계 보증 스택</text>

  <rect x="420" y="80" width="350" height="56" rx="8" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="438" y="103" font-size="12" font-weight="700" fill="#1d4ed8">1. 과제 설계</text>
  <text x="438" y="122" font-size="11.5" fill="#333">위험 티어 분류 + 실행 가능한 스코프 계약</text>

  <rect x="420" y="144" width="350" height="56" rx="8" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="438" y="167" font-size="12" font-weight="700" fill="#1d4ed8">2. 사전 검증 · 최소 권한</text>
  <text x="438" y="186" font-size="11.5" fill="#333">런 시작 전 경계 실측, 필요한 능력만 부여</text>

  <rect x="420" y="208" width="350" height="56" rx="8" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="438" y="231" font-size="12" font-weight="700" fill="#1d4ed8">3. 독립 egress 강제 · 크레덴셜 제한</text>
  <text x="438" y="250" font-size="11.5" fill="#333">허용목록은 에이전트 프로세스 바깥에서 집행</text>

  <rect x="420" y="272" width="350" height="56" rx="8" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="438" y="295" font-size="12" font-weight="700" fill="#1d4ed8">4. 런 중 감시 · 자동 중지</text>
  <text x="438" y="314" font-size="11.5" fill="#333">교차 런 모니터링, 범위 이탈 시 자동 정지</text>

  <rect x="420" y="336" width="350" height="56" rx="8" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="438" y="359" font-size="12" font-weight="700" fill="#1d4ed8">5. 증거 기반 재승인</text>
  <text x="438" y="378" font-size="11.5" fill="#333">통과 기록이 있어야 다음 단계·다음 런 허가</text>

  <text x="430" y="428" font-size="11.5" fill="#555">사례 서술과 스택 구성은 논문 보고 기준 · Google 건은 공개 기록이 제한적(저자 명시)</text>
</svg>
