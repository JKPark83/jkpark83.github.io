<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="왼쪽은 에이전트가 차단 벽에 직접 막히는 모습, 오른쪽은 공개 URL 스캐너와 GET을 POST로 바꿔 주는 릴레이 서비스를 이어 붙여 벽을 돌아가는 우회 체인을 그린 그림.">
  <defs>
    <linearGradient id="aopbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#aopbg)"/>

  <text x="600" y="80" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="44" font-weight="800">막으면 돌아간다</text>
  <text x="600" y="124" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="23">공개 URL 스캐너를 프록시로 쓴 에이전트들 — 아웃바운드 경계 설계</text>

  <!-- 차단 벽 -->
  <rect x="560" y="180" width="18" height="360" fill="#334155"/>
  <g fill="#475569">
    <rect x="560" y="200" width="18" height="6"/>
    <rect x="560" y="260" width="18" height="6"/>
    <rect x="560" y="320" width="18" height="6"/>
    <rect x="560" y="380" width="18" height="6"/>
    <rect x="560" y="440" width="18" height="6"/>
    <rect x="560" y="500" width="18" height="6"/>
  </g>
  <text x="569" y="570" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="17">봇 차단 · 로그인 · 페이월</text>

  <!-- 왼쪽: 에이전트 / 직접 접근 -->
  <g font-family="system-ui,sans-serif">
    <rect x="90" y="300" width="220" height="72" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="200" y="331" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="700">에이전트</text>
    <text x="200" y="358" text-anchor="middle" fill="#94a3b8" font-size="15">과제: "통계 수치를 찾아라"</text>
  </g>

  <!-- 직접 시도 (막힘) -->
  <line x1="310" y1="336" x2="548" y2="336" stroke="#fb7185" stroke-width="3" stroke-dasharray="10 7"/>
  <g stroke="#fb7185" stroke-width="4">
    <line x1="516" y1="318" x2="548" y2="354"/>
    <line x1="548" y1="318" x2="516" y2="354"/>
  </g>
  <text x="410" y="322" text-anchor="middle" fill="#fb7185" font-family="system-ui,sans-serif" font-size="17" font-weight="700">직접 접근 → 403</text>

  <!-- 우회 경로 -->
  <path d="M 200 300 C 200 210, 430 205, 470 232" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <g font-family="system-ui,sans-serif">
    <rect x="430" y="212" width="200" height="60" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="530" y="238" text-anchor="middle" fill="#fde68a" font-size="18" font-weight="700">GET→POST 브리지</text>
    <text x="530" y="260" text-anchor="middle" fill="#94a3b8" font-size="13.5">httpbin.org 등 공개 서비스</text>
  </g>
  <path d="M 630 242 C 700 242, 730 250, 762 268" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <g font-family="system-ui,sans-serif">
    <rect x="730" y="268" width="220" height="66" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="840" y="296" text-anchor="middle" fill="#7dd3fc" font-size="19" font-weight="700">urlquery.net 스캐너</text>
    <text x="840" y="320" text-anchor="middle" fill="#94a3b8" font-size="13.5">원격 브라우저가 대신 방문</text>
  </g>
  <path d="M 840 334 C 840 380, 800 404, 760 416" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <g font-family="system-ui,sans-serif">
    <rect x="620" y="404" width="240" height="66" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2.5"/>
    <text x="740" y="432" text-anchor="middle" fill="#86efac" font-size="18" font-weight="700">공개 스캔 리포트</text>
    <text x="740" y="456" text-anchor="middle" fill="#94a3b8" font-size="13.5">스크린샷·페이지 제목으로 회수</text>
  </g>
  <path d="M 616 440 C 460 448, 300 420, 232 376" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="2 8"/>

  <!-- 표적 -->
  <g font-family="system-ui,sans-serif">
    <rect x="980" y="300" width="150" height="72" rx="12" fill="#1e293b" stroke="#fb7185" stroke-width="2.5"/>
    <text x="1055" y="331" text-anchor="middle" fill="#fda4af" font-size="19" font-weight="700">차단된 사이트</text>
    <text x="1055" y="356" text-anchor="middle" fill="#94a3b8" font-size="13.5">정부 통계 포털 포함</text>
  </g>
  <line x1="950" y1="301" x2="986" y2="316" stroke="#38bdf8" stroke-width="3"/>

  <text x="600" y="602" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="19">에이전트의 실제 능력 = 준 도구 + 도달 가능한 모든 서비스가 대신 해 주는 일</text>
</svg>
