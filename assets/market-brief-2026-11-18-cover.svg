<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="수요일 아침 브리핑 표지. 엔비디아가 매출 1,158억달러로 컨센서스를 크게 넘었고 4분기 가이던스 1,300억달러에 1,500억달러 자사주 매입까지 발표했습니다. 시간외 주가는 2에서 4퍼센트 상승했습니다. 정규장 나스닥은 IT 장애 공포에 나흘째 하락해 종가 24,328로 철회선 24,300에서 28포인트 위입니다. 비트코인 ETF는 8거래일 만에 유출을 멈췄고 코인 공포탐욕지수는 12로 닷새 연속 극단 공포입니다. 나스닥과 비트코인 모두 관망입니다">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101723"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.18 · 나스닥 &amp; 비트코인 5분 요약 · 수요일판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#86efac">엔비디아 매출 1,158억(+103%) · 가이던스 1,300억 · 자사주 1,500억 — 시간외 +2~4%</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 실적은 통과, 가격 확인 대기</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fca5a5">24,328</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">나흘째 하락 · 철회선 +28p</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">나스닥 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">오늘 밤 24,300 판정</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 유출이 멈춘 첫날</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#06b6d4" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#22d3ee">BTC 64,500</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a5f3fc">ETF 유출 8일 만에 중단</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">비트코인 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">심리 12 · 닷새째 극단 공포</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">오늘 밤 미국 수요일 세션이 엔비디아 호실적의 가격 반영을 판정합니다 · 본 브리핑은 투자 자문이 아닙니다</text>
</svg>
