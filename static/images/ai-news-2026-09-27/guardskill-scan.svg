<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="sans-serif">
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">폴더를 여는 순간이 공격면 — GitSpawn 클래스와 방어 지점</text>

  <!-- attack path -->
  <text x="30" y="66" font-size="14" font-weight="bold" fill="#c0392b">공격 경로 (클론이 아니라 "파일로 도착한" 저장소)</text>
  <rect x="30" y="80" width="170" height="64" rx="8" fill="#fdecea" stroke="#e74c3c"/>
  <text x="115" y="106" text-anchor="middle" font-size="12" fill="#333">zip / 공유드라이브 / USB로</text>
  <text x="115" y="124" text-anchor="middle" font-size="12" fill="#333">.git 디렉터리째 도착</text>

  <path d="M200 112 L245 112" stroke="#e74c3c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="248" y="80" width="170" height="64" rx="8" fill="#fdecea" stroke="#e74c3c"/>
  <text x="333" y="106" text-anchor="middle" font-size="12" fill="#333">에이전트가 컨텍스트 수집:</text>
  <text x="333" y="124" text-anchor="middle" font-size="12" fill="#333">git status / git diff 자동 실행</text>

  <path d="M418 112 L463 112" stroke="#e74c3c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="466" y="80" width="170" height="64" rx="8" fill="#fbd3cd" stroke="#c0392b" stroke-width="2"/>
  <text x="551" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">.git/config의 core.fsmonitor</text>
  <text x="551" y="118" text-anchor="middle" font-size="12" fill="#333">등 실행형 키가 지목한 명령이</text>
  <text x="551" y="136" text-anchor="middle" font-size="12" fill="#333">샌드박스 밖·승인 전 실행</text>

  <!-- defense layers -->
  <text x="30" y="190" font-size="14" font-weight="bold" fill="#1e8449">방어 3중선</text>
  <rect x="30" y="204" width="740" height="56" rx="8" fill="#eaf7ee" stroke="#27ae60"/>
  <text x="45" y="227" font-size="13" font-weight="bold" fill="#1e8449">1. 클론으로만 받기</text>
  <text x="45" y="248" font-size="12" fill="#333">git clone은 .git/config를 전송하지 않음 — 파일째 온 저장소는 원격에서 다시 clone</text>

  <rect x="30" y="270" width="740" height="56" rx="8" fill="#eaf7ee" stroke="#27ae60"/>
  <text x="45" y="293" font-size="13" font-weight="bold" fill="#1e8449">2. git 전역 하드닝</text>
  <text x="45" y="314" font-size="12" fill="#333">git config --global safe.bareRepository explicit — 트리 안에 숨은 bare repo 설정 적용 차단 (Copilot CLI 1.0.43 패치 방식)</text>

  <rect x="30" y="336" width="740" height="88" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="2"/>
  <text x="45" y="359" font-size="13" font-weight="bold" fill="#1e8449">3. 열기 전 스캔: npx guardskill .</text>
  <text x="45" y="380" font-size="12" fill="#333">클래스 1 — git 실행 키 약 24개: core.fsmonitor·pager·editor, filter/diff 드라이버, hooksPath, 중첩 .git·bare repo 구조</text>
  <text x="45" y="400" font-size="12" fill="#333">클래스 2 — 저장소가 실어오는 에이전트 설정: .mcp.json, .claude/settings.json, .vscode/mcp.json, .cursor/mcp.json 등</text>
  <text x="45" y="418" font-size="11" fill="#777">읽기 전용 · 네트워크 호출 0 · 의존성 0 (soemoescode/guardskill)</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>
