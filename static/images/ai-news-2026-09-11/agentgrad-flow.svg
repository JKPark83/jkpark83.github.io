<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="400" rx="12" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">AgentGrad: 개입 유도 프롬프트 최적화 흐름</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="36" y="70" width="220" height="86" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="146" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">멀티에이전트 실패 케이스</text>
  <text x="146" y="120" text-anchor="middle" font-size="12" fill="#334155">어느 에이전트 프롬프트가</text>
  <text x="146" y="138" text-anchor="middle" font-size="12" fill="#334155">문제인지 알 수 없음</text>

  <line x1="256" y1="113" x2="296" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <rect x="300" y="70" width="220" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">순차 개입 (Intervention)</text>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#334155">에이전트를 한 번에 하나씩 수정해</text>
  <text x="410" y="138" text-anchor="middle" font-size="12" fill="#334155">실패가 풀리는 타깃을 식별</text>

  <line x1="520" y1="113" x2="560" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="564" y="70" width="200" height="86" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="664" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">에이전트 수준 감독</text>
  <text x="664" y="120" text-anchor="middle" font-size="12" fill="#334155">수정된 중간 출력을 근거로</text>
  <text x="664" y="138" text-anchor="middle" font-size="12" fill="#334155">세밀한 텍스트 그래디언트 추출</text>

  <line x1="664" y1="156" x2="664" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <rect x="564" y="200" width="200" height="86" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="664" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">의미 기반 클러스터링</text>
  <text x="664" y="250" text-anchor="middle" font-size="12" fill="#334155">비슷한 실패 모드끼리 묶어</text>
  <text x="664" y="268" text-anchor="middle" font-size="12" fill="#334155">일반화된 그래디언트로 추상화</text>

  <line x1="564" y1="243" x2="524" y2="243" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 5 -->
  <rect x="300" y="200" width="220" height="86" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="410" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">타깃 프롬프트 업데이트</text>
  <text x="410" y="250" text-anchor="middle" font-size="12" fill="#334155">무관한 실패 모드가 섞이지 않아</text>
  <text x="410" y="268" text-anchor="middle" font-size="12" fill="#334155">일반화되는 프롬프트 생성</text>

  <!-- result box -->
  <rect x="36" y="200" width="220" height="86" rx="10" fill="#0f172a"/>
  <text x="146" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">결과</text>
  <text x="146" y="252" text-anchor="middle" font-size="12" fill="#e2e8f0">MAS 벤치마크 5종 SOTA</text>
  <text x="146" y="270" text-anchor="middle" font-size="12" fill="#e2e8f0">최적화 시간 평균 2.5배 단축</text>
  <line x1="300" y1="243" x2="260" y2="243" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#64748b">핵심: "어떤 프롬프트를 고칠지"를 추측하지 않고, 개입 실험으로 인과를 확인한 뒤 고친다</text>
  <text x="400" y="352" text-anchor="middle" font-size="11" fill="#94a3b8">출처: arXiv 2609.08572 초록 기반 재구성</text>
</svg>
