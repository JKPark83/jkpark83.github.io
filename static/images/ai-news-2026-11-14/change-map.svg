  <text x="424" y="160" fill="#e2e8f0" font-size="13" font-weight="600">Evidence-Guided Recovery — 도구 타임아웃 복구</text>
  <text x="424" y="180" fill="#94a3b8" font-size="12">증거 기반 복구로 완료 인증 30 vs 9 (+36.2%p)</text>
  <text x="424" y="226" fill="#facc15" font-size="12" font-weight="600">→ 사후 행동 심판 = 싼 평가·보상 신호</text>

  <!-- 오픈소스 -->
  <rect x="24" y="256" width="368" height="186" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
