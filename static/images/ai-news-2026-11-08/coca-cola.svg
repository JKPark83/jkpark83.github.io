<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="440" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Coca-Cola — 도구 출력을 텍스트가 아닌 잠재 토큰으로</text>

  <!-- flow: tool output -> compressor -> latent tokens -> agent -->
  <rect x="30" y="64" width="190" height="96" rx="10" fill="#eef4ff" stroke="#b9cdf2"/>
  <text x="125" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f4e9c">도구 관측(raw)</text>
  <text x="125" y="114" text-anchor="middle" font-size="12" fill="#444">웹 검색 결과 등</text>
  <text x="125" y="132" text-anchor="middle" font-size="12" fill="#444">길고 노이즈 많은 텍스트</text>

  <path d="M220 112 L262 112" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="264" y="64" width="190" height="96" rx="10" fill="#f0fbf2" stroke="#b5dfc0"/>
  <text x="359" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e7a35">압축 모델</text>
  <text x="359" y="114" text-anchor="middle" font-size="12" fill="#444">연속 잠재 토큰으로 변환</text>
  <text x="359" y="132" text-anchor="middle" font-size="12" fill="#444">(이산 텍스트 한계 탈피)</text>

  <path d="M454 112 L496 112" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="498" y="64" width="272" height="96" rx="10" fill="#f7f0fb" stroke="#d7bfe8"/>
  <text x="634" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d3a9c">에이전트 입력 임베딩 공간</text>
  <text x="634" y="114" text-anchor="middle" font-size="12" fill="#444">잠재 토큰을 그대로 주입</text>
  <text x="634" y="132" text-anchor="middle" font-size="12" fill="#444">다음 행동 결정에 필요한 정보만 유지</text>

  <!-- training note -->
  <rect x="30" y="180" width="740" height="52" rx="10" fill="#fff7ec" stroke="#eed3a8"/>
  <text x="50" y="202" font-size="13" font-weight="700" fill="#9c6a1f">Action-Preserving Training</text>
  <text x="50" y="222" font-size="12.5" fill="#444">원본 관측일 때와 압축 관측일 때의 '다음 행동 분포'가 같아지도록 정렬 — 행동에 충분한 정보만 남긴다</text>

  <!-- results bars -->
  <text x="30" y="270" font-size="14" font-weight="700" fill="#1a1a1a">보고된 결과 (웹 검색 에이전트 · QA 벤치마크 4종 · 모델 2계열)</text>

  <text x="30" y="300" font-size="12.5" fill="#333">토큰 소비 절감</text>
  <rect x="190" y="288" width="520" height="18" rx="4" fill="#e8e8e8"/>
  <rect x="190" y="288" width="364" height="18" rx="4" fill="#4a7fd4"/>
  <rect x="190" y="288" width="464" height="18" rx="4" fill="#4a7fd4" opacity="0.45"/>
  <text x="720" y="302" font-size="12" fill="#333">70.0~89.2%</text>

  <text x="30" y="334" font-size="12.5" fill="#333">엔드투엔드 런타임 절감</text>
  <rect x="190" y="322" width="520" height="18" rx="4" fill="#e8e8e8"/>
  <rect x="190" y="322" width="127" height="18" rx="4" fill="#4aa86b"/>
  <rect x="190" y="322" width="291" height="18" rx="4" fill="#4aa86b" opacity="0.45"/>
  <text x="720" y="336" font-size="12" fill="#333">24.5~56.0%</text>

  <text x="30" y="368" font-size="12.5" fill="#333">과제 성능</text>
  <rect x="190" y="356" width="520" height="18" rx="4" fill="#e8e8e8"/>
  <rect x="190" y="356" width="520" height="18" rx="4" fill="#9a6fc4" opacity="0.6"/>
  <text x="720" y="370" font-size="12" fill="#333">유지~개선</text>

  <text x="30" y="404" font-size="11.5" fill="#888">진한 색 = 범위 하한, 연한 색 = 상한. 수치는 arXiv 2611.06500 초록 기준 (자기 보고).</text>
  <text x="30" y="424" font-size="11.5" fill="#888">코드: github.com/THU-Agent/Coca-cola</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>
</svg>
