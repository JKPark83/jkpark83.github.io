<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">DeepSeek-V4.1-Flash-1017을 책상 위에서 — GSQ-RCO 양자화 + Strata</text>

  <!-- Left: quant options -->
  <text x="40" y="72" font-size="14" font-weight="700" fill="#1d4ed8">양자화 옵션 (용량 · 성능 회복률*)</text>

  <!-- IQ2_XXS recommended -->
  <rect x="40" y="88" width="340" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="112" font-size="14" font-weight="700" fill="#1d4ed8">IQ2_XXS — 2.00bpw · 248.8GB</text>
  <rect x="58" y="124" width="280" height="12" rx="4" fill="#dbeafe"/>
  <rect x="58" y="124" width="280" height="12" rx="4" fill="#2563eb"/>
  <text x="58" y="158" font-size="12" fill="#374151">회복률 100.0% · 제작자 권장</text>

  <!-- IQ2_XS -->
  <rect x="40" y="184" width="340" height="80" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="58" y="208" font-size="13" font-weight="700" fill="#111827">IQ2_XS — 2.25bpw · 265.8GB</text>
  <rect x="58" y="220" width="280" height="12" rx="4" fill="#e5e7eb"/>
  <rect x="58" y="220" width="279" height="12" rx="4" fill="#60a5fa"/>
  <text x="58" y="252" font-size="12" fill="#374151">회복률 99.8%</text>

  <!-- IQ1_M -->
  <rect x="40" y="274" width="340" height="80" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="58" y="298" font-size="13" font-weight="700" fill="#111827">IQ1_M — 1.75bpw · 231.3GB</text>
  <rect x="58" y="310" width="280" height="12" rx="4" fill="#e5e7eb"/>
  <rect x="58" y="310" width="276" height="12" rx="4" fill="#93c5fd"/>
  <text x="58" y="342" font-size="12" fill="#374151">회복률 98.7% · 17.5GB 절약</text>

  <text x="40" y="384" font-size="11" fill="#9ca3af">* 제작자 자체 측정: AIME25·GPQA-D·LiveCodeBench v6 평균(기준 93.54) 대비</text>
  <text x="40" y="402" font-size="11" fill="#9ca3af">· 용량에는 3종 공통 Engram 룩업 110.6GB 포함</text>

  <!-- Right: hardware stack -->
  <text x="430" y="72" font-size="14" font-weight="700" fill="#15803d">Strata 실행 스택 (권장 배치)</text>

  <rect x="430" y="88" width="330" height="78" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="448" y="114" font-size="14" font-weight="700" fill="#15803d">GPU — 12GB면 충분</text>
  <text x="448" y="136" font-size="12" fill="#374151">활성 파라미터·컴퓨트 담당</text>
  <text x="448" y="154" font-size="12" fill="#374151">초대형 MoE라도 토큰당 활성분만 올린다</text>

  <path d="M 595 166 L 595 182" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="430" y="186" width="330" height="78" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="448" y="212" font-size="14" font-weight="700" fill="#111827">시스템 RAM</text>
  <text x="448" y="234" font-size="12" fill="#374151">나머지 전문가(expert) 가중치 상주</text>
  <text x="448" y="252" font-size="12" fill="#374151">2비트라서 250GB 안팎까지 내려온 상태</text>

  <path d="M 595 264 L 595 280" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="430" y="284" width="330" height="78" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="448" y="310" font-size="14" font-weight="700" fill="#111827">SSD — Engram 110.6GB</text>
  <text x="448" y="332" font-size="12" fill="#374151">룩업 파일을 메모리맵(mmap)으로 두고 읽기</text>
  <text x="448" y="350" font-size="12" fill="#374151">3개 빌드가 같은 파일 공유 — 한 번만 받으면 됨</text>

  <text x="430" y="402" font-size="11" fill="#9ca3af">llama.cpp는 10/23 기준 V4.1 미지원 — 실행은 Strata(MIT) 경유</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="400" y="442" text-anchor="middle" font-size="12" fill="#9ca3af">프런티어급 MoE의 로컬 구동 공식: 비트는 GSQ-RCO가 깎고, 배치는 Strata가 나눈다</text>
</svg>
