  <line x1="30" y1="396" x2="770" y2="396" stroke="#e5e7eb"/>

  <text x="30" y="424" font-size="14" font-weight="700" fill="#111827">스펙 요약</text>
  <rect x="30" y="438" width="175" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="117" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">320B / 15B</text>
