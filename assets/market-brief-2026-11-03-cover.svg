<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="화요일 아침 브리핑 표지. 유가 7% 폭락에도 반도체가 또 팔려 나스닥은 1.07% 내렸고, 장 마감 뒤 애플과 팔란티어는 어닝 비트를 냈습니다. 바이낸스 준비금 증명은 하루 일찍 통과됐습니다. 나스닥 관망, 비트코인 매도 유지입니다">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.03 · 나스닥 &amp; 비트코인 5분 요약 · 화요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">유가 폭락 · 애플 비트 · 준비금 증명 통과 — 오늘 밤은 중간선거입니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 유가가 길을 열었다</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#a5b4fc">WTI -6.4%</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">금리 4.89%로 동반 하락</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">나스닥 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">심리 25~26 · 선거 대기</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 증명은 끝났다</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#06b6d4" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#22d3ee">PoR 1:1 통과</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a5f3fc">10개 자산 · 하루 일찍</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.15"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">비트코인 매도</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">BTC 77,800 · ETF 유출</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">본 콘텐츠는 정보 제공 목적이며 투자 자문이 아닙니다</text>
</svg>
