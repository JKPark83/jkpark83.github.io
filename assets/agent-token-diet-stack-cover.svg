<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="왼쪽에는 토큰 덩어리가 깔때기 모양의 압축 계층 세 개를 지나며 점점 작아지는 모습이 있고, 오른쪽에는 그럼에도 금액이 오히려 올라간 청구서가 물음표와 함께 그려져 있다. 토큰을 줄여도 비용이 줄지 않을 수 있다는 역설을 나타낸 그림.">
  <defs>
    <linearGradient id="tdsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#1b2232"/>
    </linearGradient>
    <marker id="tdsc-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#tdsbg)"/>

  <text x="600" y="84" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="42" font-weight="800">토큰은 38% 줄였는데, 청구서는 늘었다?</text>
  <text x="600" y="130" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="24">코딩 에이전트 '토큰 다이어트' 스택 해부 — Headroom · Caveman · context-mode</text>

  <!-- 왼쪽: 토큰이 압축 계층을 지나며 줄어드는 깔때기 -->
  <g font-family="system-ui,sans-serif">
    <rect x="110" y="200" width="300" height="90" rx="12" fill="#38bdf8" opacity="0.28"/>
    <text x="260" y="255" text-anchor="middle" fill="#bae6fd" font-size="26" font-weight="700">도구 출력 56KB</text>

    <rect x="150" y="320" width="220" height="56" rx="10" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="260" y="356" text-anchor="middle" fill="#4ade80" font-size="20">압축 프록시</text>

    <rect x="185" y="400" width="150" height="46" rx="10" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="260" y="430" text-anchor="middle" fill="#4ade80" font-size="18">샌드박스</text>

    <rect x="215" y="470" width="90" height="40" rx="10" fill="#4ade80" opacity="0.85"/>
    <text x="260" y="497" text-anchor="middle" fill="#0b1a26" font-size="18" font-weight="800">5.4KB</text>

    <line x1="260" y1="290" x2="260" y2="314" stroke="#38bdf8" stroke-width="3" marker-end="url(#tdsc-arrow)"/>
    <line x1="260" y1="376" x2="260" y2="394" stroke="#38bdf8" stroke-width="3" marker-end="url(#tdsc-arrow)"/>
    <line x1="260" y1="446" x2="260" y2="464" stroke="#38bdf8" stroke-width="3" marker-end="url(#tdsc-arrow)"/>
    <text x="260" y="560" text-anchor="middle" fill="#94a3b8" font-size="20">토큰 ↓↓↓</text>
  </g>

  <!-- 가운데 vs -->
  <text x="600" y="400" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="40" font-weight="800">그런데…</text>

  <!-- 오른쪽: 오히려 올라간 청구서 -->
  <g font-family="system-ui,sans-serif">
    <rect x="800" y="210" width="290" height="320" rx="14" fill="#e2e8f0" opacity="0.92"/>
    <text x="945" y="258" text-anchor="middle" fill="#334155" font-size="24" font-weight="700">INVOICE</text>
    <line x1="830" y1="280" x2="1060" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <text x="840" y="320" fill="#475569" font-size="19">cache write  1.25×</text>
    <text x="840" y="356" fill="#475569" font-size="19">cache miss  ↑↑</text>
    <text x="840" y="392" fill="#475569" font-size="19">재시도 턴  +3</text>
    <line x1="830" y1="420" x2="1060" y2="420" stroke="#94a3b8" stroke-width="2"/>
    <text x="945" y="470" text-anchor="middle" fill="#e11d48" font-size="34" font-weight="800">합계 +6.8%</text>
    <text x="945" y="508" text-anchor="middle" fill="#64748b" font-size="17">(토큰 −38.4% 인데도)</text>
  </g>
  <text x="945" y="570" text-anchor="middle" fill="#fb7185" font-family="system-ui,sans-serif" font-size="22" font-weight="700">비용 ↑ ?!</text>
</svg>
