<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Adaptive Skill Granularity — 스킬을 "실행 추상화"로 다루기</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6b7280">arXiv 2610.31461 방법 구조. 핵심은 매크로 실패를 마이크로 복구로 받아내는 FSM</text>

  <!-- Task -->
  <rect x="40" y="90" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="115" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">코딩 태스크</text>
  <text x="115" y="132" text-anchor="middle" font-size="11" fill="#475569">구조·실행 상태 피처</text>

  <!-- Controller -->
  <rect x="250" y="82" width="190" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="345" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">입도 컨트롤러</text>
  <text x="345" y="126" text-anchor="middle" font-size="11" fill="#374151">태스크 구조·실행 상태·실패 이력</text>
  <text x="345" y="142" text-anchor="middle" font-size="11" fill="#374151">기반으로 실행 경로 라우팅</text>
  <line x1="190" y1="118" x2="248" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Three routes -->
  <rect x="520" y="76" width="240" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="640" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">매크로 스킬 실행</text>
  <text x="640" y="116" text-anchor="middle" font-size="11" fill="#374151">맞으면 가장 싸고 빠름 — 그러나 brittle</text>

  <rect x="520" y="142" width="240" height="52" rx="8" fill="#fdf4ff" stroke="#a855f7"/>
  <text x="640" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7e22ce">프리미티브 툴 콜</text>
  <text x="640" y="182" text-anchor="middle" font-size="11" fill="#374151">유연하지만 스텝·비용 증가</text>

  <rect x="520" y="208" width="240" height="52" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="640" y="230" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c2410c">하이브리드</text>
  <text x="640" y="248" text-anchor="middle" font-size="11" fill="#374151">매크로로 시작 → 실패 시 마이크로 복구</text>

  <line x1="440" y1="102" x2="518" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="120" x2="518" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="138" x2="518" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Recovery FSM -->
  <rect x="250" y="250" width="190" height="88" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="345" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">복구 실행기 (FSM)</text>
  <text x="345" y="296" text-anchor="middle" font-size="11" fill="#374151">매크로 실패 감지 → 상태 전이</text>
  <text x="345" y="312" text-anchor="middle" font-size="11" fill="#374151">마이크로 스텝으로 이어받아 복구</text>
  <text x="345" y="328" text-anchor="middle" font-size="11" fill="#374151">전이 정확성·경로 일치를 평가 지표로</text>

  <line x1="560" y1="262" x2="442" y2="290" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text x="505" y="292" font-size="10.5" fill="#dc2626">매크로 실패</text>
  <line x1="345" y1="250" x2="345" y2="156" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text x="352" y="205" font-size="10.5" fill="#dc2626">재라우팅</text>

  <!-- takeaway -->
  <rect x="40" y="368" width="720" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="390" font-size="12" font-weight="600" fill="#0f172a">🛠 Agent Builder 시사점</text>
  <text x="60" y="409" font-size="11.5" fill="#334155">스킬(SKILL.md 등)을 만들 땐 "실패하면 원시 툴로 어떻게 돌아올지"까지 설계하라. 고정 매크로만 쓰면 미스매치에서 복구 불가.</text>
</svg>
