<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="360" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">SpecAgent — 약한 모델이 쓰고, 강한 모델은 검증만 한다</text>

  <!-- 1단계: 약한 모델 드래프트 -->
  <rect x="30" y="60" width="230" height="130" rx="12" fill="#eefaf0" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="145" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1e7a42">① 약한 모델 (드래프터)</text>
  <text x="48" y="115" font-size="12" fill="#333">툴 콜 시퀀스를 초안 작성</text>
  <text x="48" y="137" font-size="12" fill="#333">읽기 전용 툴은 실제 실행</text>
  <text x="48" y="159" font-size="12" fill="#333">→ 매 스텝이 실관측에 근거</text>
  <text x="48" y="181" font-size="12" font-weight="700" fill="#1e7a42">쓰기 작업은 실행 보류 ✋</text>

  <!-- 화살표 -->
  <line x1="260" y1="125" x2="310" y2="125" stroke="#888" stroke-width="2"/>
  <path d="M310 125 l-10 -5 v10 z" fill="#888"/>

  <!-- 2단계: 강한 모델 검증 -->
  <rect x="315" y="60" width="230" height="130" rx="12" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="430" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">② 강한 모델 (리뷰어)</text>
  <text x="333" y="115" font-size="12" fill="#333">드래프트 구간 전체를</text>
  <text x="333" y="137" font-size="12" fill="#333">프리필 1회로 의미 검증</text>
  <text x="333" y="159" font-size="12" fill="#333">(자기회귀 디코딩 없음)</text>
  <text x="333" y="181" font-size="12" font-weight="700" fill="#1d4ed8">짧은 판정 토큰만 생성</text>

  <!-- 화살표 -->
  <line x1="545" y1="125" x2="595" y2="125" stroke="#888" stroke-width="2"/>
  <path d="M595 125 l-10 -5 v10 z" fill="#888"/>

  <!-- 3단계: 커밋/수선 -->
  <rect x="600" y="60" width="170" height="130" rx="12" fill="#f5efff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="685" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">③ 커밋 + 수선</text>
  <text x="615" y="115" font-size="12" fill="#333">유효한 최장 프리픽스</text>
  <text x="615" y="137" font-size="12" fill="#333">는 그대로 커밋</text>
  <text x="615" y="159" font-size="12" fill="#333">첫 거부 스텝만</text>
  <text x="615" y="181" font-size="12" fill="#333">강한 모델이 재작성</text>

  <!-- 결과 박스 -->
  <rect x="30" y="220" width="740" height="95" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="50" y="248" font-size="13" font-weight="700" fill="#1a1a2e">저자 보고 결과</text>
  <text x="50" y="273" font-size="12.5" fill="#333">τ²-Bench: 강한 모델 단독 대비 성공률 ~1pt 이내 · 월타임과 메모리 트래픽 약 절반</text>
  <text x="50" y="296" font-size="12.5" fill="#333">AutomationBench·VitaBench: 약한↔강한 격차의 44~75% 회복 · MCP-Atlas: 53~75% 회복, 강한 모델 토큰 ≤ 절반</text>

  <text x="400" y="342" text-anchor="middle" font-size="11" fill="#999">출처: arXiv 2610.21463 (저자 보고치) · 자체 제작</text>
</svg>
