<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96ad"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="12" fill="#1c2333"/>
  <text x="400" y="34" text-anchor="middle" fill="#f5f7fa" font-size="18" font-weight="700">VeriHarness: 다수결 대신 '증거로 검증'</text>

  <!-- rollouts -->
  <rect x="30" y="70" width="170" height="110" rx="10" fill="#242e45" stroke="#3a4766"/>
  <text x="115" y="96" text-anchor="middle" fill="#7fb3ff" font-size="13" font-weight="700">반복 샘플링</text>
  <text x="115" y="118" text-anchor="middle" fill="#d7deeb" font-size="12">동일 과제 N개 롤아웃</text>
  <text x="115" y="136" text-anchor="middle" fill="#aeb8cc" font-size="11">서로 맞는 부분도,</text>
  <text x="115" y="152" text-anchor="middle" fill="#aeb8cc" font-size="11">틀린 부분도 섞여 있음</text>

  <!-- verifier -->
  <rect x="260" y="56" width="280" height="250" rx="10" fill="#2a3142" stroke="#ffd27f"/>
  <text x="400" y="82" text-anchor="middle" fill="#ffd27f" font-size="13" font-weight="700">에이전틱 검증자 (같은 베이스 모델)</text>
  <text x="400" y="100" text-anchor="middle" fill="#aeb8cc" font-size="11">워크스페이스 + 증거 도구 + 재사용 검증 스킬</text>
  <rect x="280" y="116" width="240" height="80" rx="8" fill="#242e45"/>
  <text x="400" y="140" text-anchor="middle" fill="#f0f3f8" font-size="12" font-weight="600">① Disagreement Resolver</text>
  <text x="400" y="160" text-anchor="middle" fill="#aeb8cc" font-size="11">롤아웃끼리 충돌하는 주장을</text>
  <text x="400" y="176" text-anchor="middle" fill="#aeb8cc" font-size="11">환경 증거와 대조해 판정</text>
  <rect x="280" y="206" width="240" height="80" rx="8" fill="#242e45"/>
  <text x="400" y="230" text-anchor="middle" fill="#f0f3f8" font-size="12" font-weight="600">② Consensus Challenger</text>
  <text x="400" y="250" text-anchor="middle" fill="#aeb8cc" font-size="11">모두가 동의한 주장도 다시 시험</text>
  <text x="400" y="266" text-anchor="middle" fill="#aeb8cc" font-size="11">(합의가 오류를 숨길 수 있으므로)</text>

  <!-- output -->
  <rect x="600" y="70" width="170" height="110" rx="10" fill="#242e45" stroke="#8be28b"/>
  <text x="685" y="96" text-anchor="middle" fill="#8be28b" font-size="13" font-weight="700">선택 + 수정</text>
  <text x="685" y="118" text-anchor="middle" fill="#d7deeb" font-size="12">증거 기반으로 최종본 선택,</text>
  <text x="685" y="136" text-anchor="middle" fill="#d7deeb" font-size="12">부족한 부분은 보완</text>
  <text x="685" y="158" text-anchor="middle" fill="#aeb8cc" font-size="11">단일 롤아웃 대비 +6.2~6.4점</text>

  <line x1="200" y1="125" x2="256" y2="125" stroke="#8b96ad" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="540" y1="125" x2="596" y2="125" stroke="#8b96ad" stroke-width="2" marker-end="url(#arr)"/>

  <!-- insight bar -->
  <rect x="30" y="330" width="740" height="46" rx="8" fill="#2a3142"/>
  <text x="400" y="349" text-anchor="middle" fill="#ffd27f" font-size="12" font-weight="600">핵심 관찰: "불일치는 정답 후보를 드러내고, 합의는 오류를 감춘다"</text>
  <text x="400" y="367" text-anchor="middle" fill="#aeb8cc" font-size="11">검증 스킬은 실패 피드백으로 스스로 개선 가능 · 26K 롤아웃 데이터 공개 (약 $100K 비용)</text>
</svg>
