<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="미국 증시가 주말 휴장에 들어간 가운데 비트코인은 8만4,000달러에서 옆걸음하고 솔라나와 XRP 등 알트코인이 앞서 올랐으며, ETF 주간 유입 24억달러를 기록한 채 PCE와 고용보고서가 몰린 지표 슈퍼위크를 기다린다는 것을 나타낸 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.09.27 · 나스닥 &amp; 비트코인 5분 요약 · 일요일판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">증시는 쉬고, 코인만 열려 있는 주말 — 다음 주는 지표 슈퍼위크입니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주말의 코인 시장</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#facc15">8.4만$</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">BTC 옆걸음 · 지지 무사</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#4ade80">SOL 120$</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">알트 강세 · XRP +5%대</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">자금과 다음 주</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.18"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#a5b4fc">+24억$</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">ETF 주간 · 1년 만 최대</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#f59e0b" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fbbf24">10/2 고용</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fde68a">PCE·GDP·ISM 슈퍼위크</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="19" fill="#94a3b8">나스닥 관망 · 암호화폐 관망 — 월요일 아시아장이 답을 확인하는 시점입니다</text>
</svg>
