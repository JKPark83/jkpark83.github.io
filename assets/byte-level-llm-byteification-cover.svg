<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="LLM 파이프라인에서 토크나이저 블록이 분리되어 아래로 떨어져 나가고, 원시 바이트들이 동적 패치로 묶여 곧바로 트랜스포머로 흘러 들어가는 그림. 아래에는 '토크나이저를 떼어내다 — byte-level LLM과 byteification' 문구가 있다.">
  <defs>
    <linearGradient id="blc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blc-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#blc-bg)"/>
  <g font-family="'Segoe UI',system-ui,sans-serif">

    <!-- 제목 -->
    <text x="600" y="78" fill="#e2e8f0" font-size="44" font-weight="800" text-anchor="middle">토크나이저를 떼어내다</text>
    <text x="600" y="118" fill="#94a3b8" font-size="22" text-anchor="middle">byte-level LLM · byteification — Bolmo가 Nature에 실리기까지</text>

    <!-- 바이트 입력 (왼쪽) -->
    <g font-size="20" font-weight="700">
      <rect x="70" y="250" width="56" height="56" rx="10" fill="#f59e0b"/><text x="98" y="286" text-anchor="middle" fill="#0b1220">0x74</text>
      <rect x="134" y="250" width="56" height="56" rx="10" fill="#f59e0b"/><text x="162" y="286" text-anchor="middle" fill="#0b1220">0x65</text>
      <rect x="198" y="250" width="56" height="56" rx="10" fill="#f59e0b"/><text x="226" y="286" text-anchor="middle" fill="#0b1220">0x78</text>
      <rect x="262" y="250" width="56" height="56" rx="10" fill="#f59e0b"/><text x="290" y="286" text-anchor="middle" fill="#0b1220">0x74</text>
    </g>
    <text x="194" y="230" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">원시 바이트</text>

    <!-- 패치 묶음 표시 -->
    <path d="M70 322 L190 322" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <path d="M198 322 L318 322" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <text x="194" y="352" fill="#6ee7b7" font-size="16" text-anchor="middle">학습된 경계 예측기가 패치로 묶음</text>

    <!-- 흐름 화살표: 바이트 → 트랜스포머 -->
    <path d="M340 278 C 430 278, 460 278, 540 278" stroke="url(#blc-flow)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M540 278 l-22 -14 v28 z" fill="#34d399"/>

    <!-- 트랜스포머 본체 (오른쪽) -->
    <g>
      <rect x="570" y="190" width="420" height="180" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="3.5"/>
      <text x="780" y="238" fill="#6ee7b7" font-size="26" font-weight="800" text-anchor="middle">기존 트랜스포머 본체</text>
      <text x="780" y="272" fill="#a7f3d0" font-size="18" text-anchor="middle">동결·재활용 — 추가 훈련은 1% 미만</text>
      <text x="780" y="330" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">OLMo 3 → Bolmo · Qwen3 → Bwen · Llama 3 → Blama</text>
    </g>

    <!-- 떨어져 나간 토크나이저 블록 -->
    <g transform="rotate(12 420 480)">
      <rect x="330" y="440" width="180" height="80" rx="14" fill="#7f1d1d" stroke="#fb7185" stroke-width="3"/>
      <text x="420" y="474" fill="#fecaca" font-size="22" font-weight="800" text-anchor="middle">Tokenizer</text>
      <text x="420" y="502" fill="#fca5a5" font-size="15" text-anchor="middle">고정 어휘 200K</text>
    </g>
    <line x1="420" y1="430" x2="445" y2="395" stroke="#fb7185" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="560" y="490" fill="#fb7185" font-size="18" font-weight="700">✂ 분리</text>

    <!-- 하단 문구 -->
    <text x="600" y="585" fill="#cbd5e1" font-size="24" font-weight="700" text-anchor="middle">"바이트 모델은 새로 키우는 게 아니라, 있는 모델을 개조하는 것"</text>
  </g>
</svg>
