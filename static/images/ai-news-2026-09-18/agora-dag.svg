<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="840" height="470" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Agora — Git을 멀티에이전트 공유 메모리로 쓰는 법</text>
  <text x="420" y="54" text-anchor="middle" font-size="12" fill="#6b7280">arXiv 2609.18094 · 중앙 플래너 없이 13개 LM 워커가 12일간 협업</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- workers -->
  <rect x="40" y="100" width="180" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="130" y="126" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">LM 워커 × 13</text>
  <text x="130" y="148" text-anchor="middle" font-size="11.5" fill="#4b5563">할당된 태스크 없음</text>
  <text x="130" y="166" text-anchor="middle" font-size="11.5" fill="#4b5563">중앙 플래너 없음</text>
  <text x="130" y="184" text-anchor="middle" font-size="11.5" fill="#4b5563">각자 실험 → 결과 발행</text>

  <!-- git DAG -->
  <rect x="290" y="85" width="260" height="140" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="420" y="111" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Git 저장소 = append-only DAG</text>
  <text x="420" y="133" text-anchor="middle" font-size="11.5" fill="#4b5563">결과·인사이트·가설·검증·리포트가</text>
  <text x="420" y="150" text-anchor="middle" font-size="11.5" fill="#4b5563">각각 불변 커밋, 부모 엣지 = 무엇 위에 쌓였나</text>
  <circle cx="340" cy="185" r="9" fill="#8b5cf6"/>
  <circle cx="380" cy="200" r="9" fill="#8b5cf6"/>
  <circle cx="380" cy="170" r="9" fill="#a78bfa"/>
  <circle cx="420" cy="185" r="9" fill="#8b5cf6"/>
  <circle cx="460" cy="200" r="9" fill="#a78bfa"/>
  <circle cx="460" cy="170" r="9" fill="#8b5cf6"/>
  <circle cx="500" cy="185" r="9" fill="#c4b5fd"/>
  <line x1="349" y1="185" x2="371" y2="197" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="349" y1="182" x2="371" y2="172" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="389" y1="197" x2="411" y2="187" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="389" y1="172" x2="411" y2="182" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="429" y1="187" x2="451" y2="197" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="429" y1="182" x2="451" y2="172" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="469" y1="197" x2="491" y2="187" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="469" y1="172" x2="491" y2="182" stroke="#8b5cf6" stroke-width="1.5"/>

  <!-- index -->
  <rect x="620" y="100" width="180" height="110" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="710" y="126" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">파생 인덱스</text>
  <text x="710" y="148" text-anchor="middle" font-size="11.5" fill="#4b5563">탐색 프론티어 노출</text>
  <text x="710" y="166" text-anchor="middle" font-size="11.5" fill="#4b5563">방치된 브랜치 표시</text>
  <text x="710" y="184" text-anchor="middle" font-size="11.5" fill="#4b5563">주장별 검증 상태</text>

  <!-- arrows top row -->
  <line x1="220" y1="155" x2="283" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="252" y="144" text-anchor="middle" font-size="10.5" fill="#6b7280">커밋 발행</text>
  <line x1="550" y1="155" x2="613" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="582" y="144" text-anchor="middle" font-size="10.5" fill="#6b7280">자동 파생</text>

  <!-- selection rule feedback -->
  <rect x="290" y="265" width="260" height="64" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="420" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">다양성 인지 선택 규칙</text>
  <text x="420" y="311" text-anchor="middle" font-size="11.5" fill="#4b5563">1등 레시피로의 쏠림(모노컬처) 방지</text>
  <line x1="710" y1="210" x2="710" y2="297" stroke="#6b7280" stroke-width="2" fill="none"/>
  <line x1="710" y1="297" x2="557" y2="297" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="290" y1="297" x2="130" y2="297" stroke="#6b7280" stroke-width="2" fill="none"/>
  <line x1="130" y1="297" x2="130" y2="217" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="286" text-anchor="middle" font-size="10.5" fill="#6b7280">다음 탐색 방향 제안</text>

  <!-- results strip -->
  <rect x="40" y="365" width="760" height="60" rx="10" fill="#111827"/>
  <text x="130" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1,703 기여</text>
  <text x="130" y="408" text-anchor="middle" font-size="10.5" fill="#9ca3af">12일 · 15개 계정</text>
  <text x="330" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3.39 → 1.899 bpb</text>
  <text x="330" y="408" text-anchor="middle" font-size="10.5" fill="#9ca3af">가중치 전이 평가 지표</text>
  <text x="530" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">GPT-2 124M 갭 62% 해소</text>
  <text x="530" y="408" text-anchor="middle" font-size="10.5" fill="#9ca3af">학습 데이터·그래디언트 없이</text>
  <text x="710" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">재현 165건 · 실패 0</text>
  <text x="710" y="408" text-anchor="middle" font-size="10.5" fill="#9ca3af">커밋 = 체크아웃해 재실행 가능</text>

  <text x="420" y="450" text-anchor="middle" font-size="11" fill="#9ca3af">수치는 arXiv 초록 기준 · 사람 개입은 모노컬처 탈출을 위한 1회뿐이었다고 보고</text>
</svg>
