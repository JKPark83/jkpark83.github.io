<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="일요일 비트코인이 8만3,000달러 선에서 이틀째 조용한 가운데 암호화폐 공포·탐욕 지수가 공포 없이 탐욕 60까지 되돌아왔고, 레저가 변조 기기에서 무단 하드웨어 부품을 공식 확인했으며, 화요일 은행 실적과 수요일 CPI가 기다리는 월요일 아침 브리핑 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.10.12 · 나스닥 &amp; 비트코인 5분 요약 · 월요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">급락 주간이 끝나자마자 심리는 탐욕(60)으로 — 공포 없는 바닥은 믿지 않습니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주말 이틀 — 조용한 비트코인</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.18"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#a5b4fc">$83,294</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">일 저녁 · 83,500 저항 전</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.14"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#facc15">탐욕 60</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">급락 주간에도 공포 미진입</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">이번 주 — 검증의 사흘</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#f87171">레저 확인</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">기기 내 무단 부품 공식화</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.14"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#4ade80">화 은행 · 수 CPI</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">목 TSMC까지 연속 이벤트</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="20" fill="#94a3b8">오늘의 포지션 — 나스닥: 관망 · 암호화폐: 매도 유지 · 해제 조건은 8만5,000달러 회복 + 유입 연속 확인</text>
  <text x="80" y="594" font-family="sans-serif" font-size="15" fill="#64748b">본 콘텐츠는 정보 제공 목적이며 투자 자문이 아닙니다</text>
</svg>
