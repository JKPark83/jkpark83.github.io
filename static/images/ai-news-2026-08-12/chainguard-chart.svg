<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="820" height="430" rx="16" fill="#0f172a"/>
  <text x="32" y="42" fill="#e2e8f0" font-size="21" font-weight="700">ColluSkill vs ChainGuard — 6개 스킬 스캐너 대상</text>
  <text x="32" y="66" fill="#94a3b8" font-size="13">공격 성공률(ASR, 낮을수록 방어 강함) · 정상 워크플로 통과율 · arXiv 2608.09732</text>

  <!-- axis -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="150" y1="110" x2="150" y2="330"/>
    <line x1="308" y1="110" x2="308" y2="330"/>
    <line x1="466" y1="110" x2="466" y2="330"/>
    <line x1="624" y1="110" x2="624" y2="330"/>
    <line x1="782" y1="110" x2="782" y2="330"/>
  </g>
  <line x1="150" y1="330" x2="782" y2="330" stroke="#475569" stroke-width="2"/>
  <text x="150" y="350" fill="#64748b" font-size="11" text-anchor="middle">0%</text>
  <text x="466" y="350" fill="#64748b" font-size="11" text-anchor="middle">50%</text>
  <text x="782" y="350" fill="#64748b" font-size="11" text-anchor="middle">100%</text>

  <!-- bar 1: ColluSkill ASR 96.0 -->
  <text x="140" y="140" fill="#cbd5e1" font-size="13" text-anchor="end">단일 검사 회피 (ColluSkill)</text>
  <rect x="150" y="126" width="606.7" height="26" rx="5" fill="#f87171"/>
  <text x="748" y="144" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">96.0%</text>

  <!-- bar 2: ChainGuard ASR 22.5 -->
  <text x="140" y="200" fill="#cbd5e1" font-size="13" text-anchor="end">체인 스캔 방어 (ChainGuard)</text>
  <rect x="150" y="186" width="142.2" height="26" rx="5" fill="#34d399"/>
  <text x="302" y="204" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="start">22.5%</text>

  <!-- bar 3: benign pass 99.5 -->
  <text x="140" y="260" fill="#cbd5e1" font-size="13" text-anchor="end">정상 워크플로 통과율</text>
  <rect x="150" y="246" width="628.8" height="26" rx="5" fill="#60a5fa"/>
  <text x="770" y="264" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">99.5%</text>

  <text x="150" y="392" fill="#94a3b8" font-size="12.5">핵심: 개별 스킬은 다 통과해도, 조합되면 악성. 방어는 "이미 깔린 스킬"과 함께 봐야 한다.</text>
</svg>
