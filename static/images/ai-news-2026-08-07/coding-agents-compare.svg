<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="터미널 코딩 에이전트 3종 비교: Meta Muse Code, OpenAI Codex, Claude Code의 모델, 설치, 코드리뷰, 대표 기능 비교">
  <rect width="840" height="430" fill="#0f172a"/>
  <text x="420" y="34" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">터미널 코딩 에이전트 3파전</text>
  <text x="420" y="56" text-anchor="middle" fill="#94a3b8" font-size="13">Meta가 참전 — 격전지는 "장기 실행 신뢰성"</text>

  <!-- Muse Code -->
  <rect x="24" y="76" width="256" height="330" rx="14" fill="#2e1065" stroke="#c084fc" stroke-width="1.6"/>
  <text x="44" y="106" fill="#e9d5ff" font-size="15" font-weight="700">🆕 Muse Code</text>
  <text x="44" y="126" fill="#c4b5fd" font-size="11.5">Meta · beta</text>
  <g font-size="12" fill="#ede9fe">
    <text x="44" y="156">모델: Muse Spark 1.2</text>
    <text x="44" y="180">리뷰: /plan · /grill · /goal</text>
    <text x="44" y="204">특징: 영속 백그라운드 에이전트</text>
    <text x="44" y="226">이벤트 로그 → 크래시 재개</text>
    <text x="44" y="250">가격: $1.25 / $4.25 (per MTok)</text>
    <text x="44" y="272">캐시 입력 $0.15</text>
  </g>
  <rect x="44" y="288" width="216" height="42" rx="8" fill="#1e1b4b" stroke="#6d28d9"/>
  <text x="56" y="313" fill="#c4b5fd" font-size="10.5" font-family="ui-monospace,Menlo,monospace">curl .../install.sh | bash</text>
  <text x="44" y="356" fill="#a78bfa" font-size="11">→ 24h 테스트서 tool call 1,000+</text>
  <text x="44" y="378" fill="#8b5cf6" font-size="10.5">벤더 발표 기준 · 독립평가 아직</text>

  <!-- Codex -->
  <rect x="292" y="76" width="256" height="330" rx="14" fill="#052e16" stroke="#4ade80" stroke-width="1.6"/>
  <text x="312" y="106" fill="#bbf7d0" font-size="15" font-weight="700">🟩 Codex CLI</text>
  <text x="312" y="126" fill="#86efac" font-size="11.5">OpenAI · rust-v0.146.x</text>
  <g font-size="12" fill="#dcfce7">
    <text x="312" y="156">모델: GPT-5.6 계열</text>
    <text x="312" y="180">리뷰: /review · @codex review</text>
    <text x="312" y="204">규칙: AGENTS.md 리뷰 섹션</text>
    <text x="312" y="226">특징: 헤드리스 codex exec</text>
    <text x="312" y="250">auto-review 기본값 안전화</text>
    <text x="312" y="272">(사이버-역량 모델 대상)</text>
  </g>
  <rect x="312" y="288" width="216" height="42" rx="8" fill="#022c1a" stroke="#166534"/>
  <text x="324" y="313" fill="#86efac" font-size="10.5" font-family="ui-monospace,Menlo,monospace">$ codex → /review</text>
  <text x="312" y="356" fill="#4ade80" font-size="11">→ CI/CD·PR·터미널 3단 리뷰</text>
  <text x="312" y="378" fill="#22c55e" font-size="10.5">Aug 5 rust-v0.146.1</text>

  <!-- Claude Code -->
  <rect x="560" y="76" width="256" height="330" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="580" y="106" fill="#bfdbfe" font-size="15" font-weight="700">🟦 Claude Code</text>
  <text x="580" y="126" fill="#93c5fd" font-size="11.5">Anthropic · v2.1.223</text>
  <g font-size="12" fill="#dbeafe">
    <text x="580" y="156">모델: Opus 5 (기본)</text>
    <text x="580" y="180">리뷰: /code-review + effort</text>
    <text x="580" y="204">/code-review ultra (클라우드)</text>
    <text x="580" y="226">특징: subagent · hook · MCP</text>
    <text x="580" y="250">Bash 권한 우회 버그 수정</text>
    <text x="580" y="272">worktree 격리 강화</text>
  </g>
  <rect x="580" y="288" width="216" height="42" rx="8" fill="#0b1e42" stroke="#1d4ed8"/>
  <text x="592" y="313" fill="#93c5fd" font-size="10.5" font-family="ui-monospace,Menlo,monospace">/review → /code-review</text>
  <text x="580" y="356" fill="#60a5fa" font-size="11">→ 보안 픽스 포함, 업그레이드 권장</text>
  <text x="580" y="378" fill="#3b82f6" font-size="10.5">Aug 6 changelog</text>

  <text x="420" y="422" text-anchor="middle" fill="#64748b" font-size="10.5">출처: Meta AI Research 블로그 · Codex GitHub 릴리스 · Claude Code changelog · 가격/수치는 벤더 발표 기준</text>
</svg>
