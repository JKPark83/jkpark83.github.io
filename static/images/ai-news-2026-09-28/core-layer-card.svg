<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">코어 확장 계층, 소스로 읽기 — Codex vs Claude Code</text>

  <!-- Codex card -->
  <rect x="40" y="56" width="352" height="290" rx="12" fill="#eafaf1" stroke="#2fb673" stroke-width="1.5"/>
  <text x="56" y="86" font-size="15" font-weight="700" fill="#1d8a55">🟩 Codex — Guardian v2</text>
  <text x="56" y="112" font-size="12.5" fill="#333d55">위치: codex-rs/prompts/templates/guardian/</text>
  <text x="56" y="136" font-size="12.5" fill="#333d55">• policy.md — 4대 위험 분류와 allow/deny 규칙</text>
  <text x="56" y="156" font-size="12.5" fill="#333d55">• classifier_instructions.md — 증거 취급·승인 채점</text>
  <text x="56" y="180" font-size="12.5" fill="#333d55">설정: config.toml [features.guardianv2]</text>
  <text x="56" y="200" font-size="12.5" fill="#333d55">• review_threshold, reasoning_effort</text>
  <text x="56" y="220" font-size="12.5" fill="#333d55">• review_scope.sandboxed_exec_commands</text>
  <text x="56" y="240" font-size="12.5" fill="#333d55">• transcript.sources (tool_calls/outputs/reasoning)</text>
  <text x="56" y="268" font-size="12.5" fill="#333d55">최근: 컴팩션 후에도 Guardian 히스토리 유지,</text>
  <text x="56" y="286" font-size="12.5" fill="#333d55">서킷브레이커 중단을 구조화 에러로 (9/26~27 커밋)</text>
  <text x="56" y="320" font-size="12.5" font-weight="700" fill="#1d8a55">읽는 법: 정책 전문이 곧 레퍼런스 문서</text>

  <!-- Claude Code card -->
  <rect x="408" y="56" width="352" height="290" rx="12" fill="#eef4ff" stroke="#4a7dff" stroke-width="1.5"/>
  <text x="424" y="86" font-size="15" font-weight="700" fill="#2453c9">🟦 Claude Code — mods/</text>
  <text x="424" y="112" font-size="12.5" fill="#333d55">위치: anthropics/claude-code 저장소 mods/</text>
  <text x="424" y="136" font-size="12.5" fill="#333d55">• sec-default — 조직 정책을 플러그인에서 격리</text>
  <text x="424" y="156" font-size="12.5" fill="#333d55">• diff — /diff 사이드 패널 (수정분 실시간)</text>
  <text x="424" y="176" font-size="12.5" fill="#333d55">• telemetry — 자사 분석 이벤트 훅</text>
  <text x="424" y="196" font-size="12.5" fill="#333d55">• agents-md — AGENTS.md를 프로젝트 지침으로</text>
  <text x="424" y="224" font-size="12.5" fill="#333d55">형태: register(on, options) 하나로 엔진 이벤트를</text>
  <text x="424" y="242" font-size="12.5" fill="#333d55">($, e, next) 미들웨어처럼 후킹하는 플러그인</text>
  <text x="424" y="268" font-size="12.5" fill="#333d55">실행: claude --plugin-dir mods/diff</text>
  <text x="424" y="286" font-size="12.5" fill="#333d55">테스트: claude plugin test mods/diff</text>
  <text x="424" y="320" font-size="12.5" font-weight="700" fill="#2453c9">읽는 법: 내장 기능이 곧 플러그인 예제 4종</text>

  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#8a8fa3">두 CLI 모두 '바이너리에 밀봉돼 있던 계층'을 저장소에 소스로 공개 — 커스텀 정책·플러그인 제작의 1차 교재</text>
</svg>
