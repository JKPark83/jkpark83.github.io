<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="100%" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="820" height="430" fill="#0f172a"/>
  <text x="410" y="34" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Change2Task — 병합된 PR을 검증된 코딩 태스크로</text>
  <text x="410" y="57" fill="#94a3b8" font-size="12.5" text-anchor="middle">1,130개 변경 → 검증 성공률 79.6% · 최신 healthy 리비전 위에서 재구성</text>

  <!-- step 1 -->
  <rect x="30" y="90" width="180" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="120" y="120" fill="#e2e8f0" font-size="13.5" font-weight="700" text-anchor="middle">Merged PR</text>
  <text x="120" y="140" fill="#94a3b8" font-size="11.5" text-anchor="middle">개발자 증거(diff·테스트)</text>

  <!-- arrow -->
  <line x1="210" y1="125" x2="255" y2="125" stroke="#475569" stroke-width="2"/>
  <polygon points="255,120 265,125 255,130" fill="#475569"/>

  <!-- step 2 (3 methods) -->
  <rect x="270" y="78" width="270" height="94" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="405" y="98" fill="#f59e0b" font-size="12.5" font-weight="700" text-anchor="middle">상태 재구성 (3가지 방법)</text>
  <text x="286" y="120" fill="#e2e8f0" font-size="11.5">• Patch Reversal — 패치를 되돌려 태스크화</text>
  <text x="286" y="139" fill="#e2e8f0" font-size="11.5">• Code Mapping — 진화한 코드에 정렬</text>
  <text x="286" y="158" fill="#e2e8f0" font-size="11.5">• Agent Reconstruction — 에이전트가 복원</text>

  <!-- arrow -->
  <line x1="540" y1="125" x2="585" y2="125" stroke="#475569" stroke-width="2"/>
  <polygon points="585,120 595,125 585,130" fill="#475569"/>

  <!-- step 3 -->
  <rect x="600" y="90" width="190" height="70" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="695" y="115" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">검증된 태스크</text>
  <text x="695" y="136" fill="#94a3b8" font-size="11" text-anchor="middle">healthy→task→restored</text>
  <text x="695" y="151" fill="#94a3b8" font-size="11" text-anchor="middle">라이프사이클 검증</text>

  <!-- lifecycle bar -->
  <text x="410" y="215" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">지원하는 5개 태스크 패밀리</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="235" width="140" height="46" rx="8" fill="#312e81"/>
    <text x="110" y="263" fill="#e0e7ff">Bug Fix</text>
    <rect x="196" y="235" width="140" height="46" rx="8" fill="#164e63"/>
    <text x="266" y="263" fill="#cffafe">Feature 추가</text>
    <rect x="352" y="235" width="140" height="46" rx="8" fill="#134e4a"/>
    <text x="422" y="263" fill="#ccfbf1">Test 생성</text>
    <rect x="508" y="235" width="140" height="46" rx="8" fill="#713f12"/>
    <text x="578" y="263" fill="#fef3c7">API 마이그레이션</text>
    <rect x="664" y="235" width="120" height="46" rx="8" fill="#7f1d1d"/>
    <text x="724" y="263" fill="#fee2e2">Security 수정</text>
  </g>

  <!-- implication -->
  <rect x="40" y="315" width="744" height="80" rx="10" fill="#0b2545" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="60" y="342" fill="#7dd3fc" font-size="13" font-weight="700">🛠 에이전트 빌더 시사점</text>
  <text x="60" y="366" fill="#e2e8f0" font-size="12.5">외부 벤치마크에 의존하지 말고 — 내 repo의 병합된 PR을 그대로 "실행 가능한 eval"로 바꾼다.</text>
  <text x="60" y="386" fill="#e2e8f0" font-size="12.5">오염 없는(contamination-free) 회귀 셋을 CI에 붙여 에이전트 성능 변화를 지속 추적.</text>
</svg>
