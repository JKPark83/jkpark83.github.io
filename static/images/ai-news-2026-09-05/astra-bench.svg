  <text x="350" y="376" text-anchor="middle" fill="#64748b" font-size="10">전부 OpenAI 자체 측정치. 어제 다룬 Meta Muse Spark 1.3의 DeepSWE 75.4는 자사 하네스 기준이라 직접 비교 불가</text>
