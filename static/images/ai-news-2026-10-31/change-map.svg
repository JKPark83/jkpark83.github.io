  <text x="430" y="318" font-size="14" font-weight="600" fill="#222">Codex: deferred tool world state 기본 ON</text>
  <text x="430" y="340" font-size="12.5" fill="#444">지연 로딩 MCP 네임스페이스가 컨텍스트에 노출</text>
