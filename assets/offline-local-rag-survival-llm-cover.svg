<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="인터넷 경계선 안쪽에서 로컬 모델이 SQLite 전문 검색 인덱스를 도구로 호출해 오프라인 라이브러리를 검색하고, 출처가 달린 답을 내놓는 모습을 그린 커버 이미지">
  <defs>
    <linearGradient id="slmg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#slmg)"/>

  <text x="80" y="96" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="46" font-weight="800">인터넷이 끊겨도 AI는 답해야 한다</text>
  <text x="80" y="154" fill="#4ade80" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800">오프라인 로컬 RAG 엔지니어링</text>
  <text x="80" y="200" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24">Survival LLM 해부 — SQLite FTS5 검색, LLM 저지 평가, 인용 검증</text>

  <!-- 인터넷 경계 -->
  <rect x="70" y="240" width="1060" height="330" rx="18" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="12 10" opacity="0.7"/>
  <text x="600" y="276" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">내 컴퓨터 — 이 선을 넘는 트래픽 없음</text>

  <!-- 질문 -->
  <rect x="110" y="330" width="220" height="90" rx="14" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <text x="220" y="368" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">질문</text>
  <text x="220" y="398" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17">"정전인데 냉장고 음식은?"</text>

  <line x1="330" y1="375" x2="420" y2="375" stroke="#64748b" stroke-width="4"/>
  <polygon points="434,375 414,364 414,386" fill="#64748b"/>

  <!-- 로컬 모델 -->
  <rect x="440" y="315" width="300" height="120" rx="14" fill="#1e293b" stroke="#4ade80" stroke-width="3"/>
  <text x="590" y="356" text-anchor="middle" fill="#4ade80" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="800">로컬 모델 (Ollama)</text>
  <text x="590" y="386" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17">search_library · read_article</text>
  <text x="590" y="412" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17">검색 → 읽기 → 답변 루프</text>

  <line x1="740" y1="375" x2="830" y2="375" stroke="#64748b" stroke-width="4"/>
  <polygon points="844,375 824,364 824,386" fill="#64748b"/>

  <!-- 라이브러리 -->
  <rect x="850" y="300" width="240" height="80" rx="14" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="970" y="334" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">SQLite FTS5 + BM25</text>
  <text x="970" y="362" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">벡터 DB 없는 전문 검색</text>

  <rect x="850" y="400" width="240" height="80" rx="14" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <text x="970" y="434" text-anchor="middle" fill="#fbbf24" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">오프라인 라이브러리</text>
  <text x="970" y="462" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">약 150만 문서 · 21GB</text>

  <!-- 답변 -->
  <line x1="440" y1="435" x2="330" y2="490" stroke="#4ade80" stroke-width="4"/>
  <polygon points="318,496 334,477 344,496" fill="#4ade80"/>
  <rect x="110" y="470" width="400" height="80" rx="14" fill="none" stroke="#4ade80" stroke-width="3"/>
  <text x="310" y="504" text-anchor="middle" fill="#4ade80" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">답변 + Sources (검증됨)</text>
  <text x="310" y="532" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">모델의 주장이 아니라 하네스의 열람 기록</text>

  <!-- 끊어진 클라우드 -->
  <g opacity="0.85">
    <path d="M1045 120 q-14-30 18-36 q6-26 34-22 q26-30 56-10 q30-6 34 24 q26 10 12 34 q-10 18-34 16 l-100 0 q-16 0-20-6z" fill="none" stroke="#fb7185" stroke-width="4"/>
    <line x1="1030" y1="170" x2="1180" y2="60" stroke="#fb7185" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
