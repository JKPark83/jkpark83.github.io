  <text x="430" y="390" font-size="12" fill="#444">유저 모드가 선실행하는 경로 차단</text>
  <text x="430" y="416" font-size="13" font-weight="600" fill="#222">Codex: rollout_budget 소수점 지원</text>
  <text x="430" y="434" font-size="12" fill="#444">limit_budget으로 롤아웃 예산 상한 +</text>
  <text x="430" y="452" font-size="12" fill="#444">잔액 리마인더 임계값 설정</text>
