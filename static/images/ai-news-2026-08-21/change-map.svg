<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="560" fill="#fafaf8"/>
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">오늘의 AI 변화 지도 — 2026-08-21</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#666">에이전트를 둘러싼 "환경" 자체가 엔지니어링 대상이 됐다</text>

  <!-- center node -->
  <rect x="330" y="250" width="240" height="70" rx="12" fill="#1f2937"/>
  <text x="450" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">환경 엔지니어링</text>
  <text x="450" y="302" text-anchor="middle" font-size="12.5" fill="#d1d5db">평가 · 훈련 · 검증 · 하네스</text>

  <!-- links -->
  <g stroke="#9ca3af" stroke-width="1.6" fill="none">
    <path d="M 330 270 Q 260 240 210 200"/>
    <path d="M 570 270 Q 640 240 690 200"/>
    <path d="M 330 305 Q 260 340 210 380"/>
    <path d="M 570 305 Q 640 340 690 380"/>
  </g>

  <!-- top-left: FM-Bench -->
  <rect x="40" y="100" width="330" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="126" font-size="15" font-weight="700" fill="#3730a3">평가 환경 · FM-Bench</text>
  <text x="56" y="148" font-size="12.5" fill="#374151">20시즌 축구단 경영, 툴 26개, 결정 340~400회</text>
  <text x="56" y="166" font-size="12.5" fill="#374151">LLM 심판 없이 결정론적 엔진이 점수 산출</text>
  <text x="56" y="184" font-size="12.5" fill="#6b7280">arXiv 2608.18423</text>

  <!-- top-right: SPADE -->
  <rect x="530" y="100" width="330" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="546" y="126" font-size="15" font-weight="700" fill="#065f46">훈련 환경 · SPADE</text>
  <text x="546" y="148" font-size="12.5" fill="#374151">LLM이 직접 훈련 환경 코드를 작성하는 셀프플레이</text>
  <text x="546" y="166" font-size="12.5" fill="#374151">ACEBench-Agent +13.9, BFCL-v4 멀티턴 +5.7</text>
  <text x="546" y="184" font-size="12.5" fill="#6b7280">arXiv 2608.19197</text>

  <!-- bottom-left: SemaPLC -->
  <rect x="40" y="360" width="330" height="100" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="56" y="386" font-size="15" font-weight="700" fill="#92400e">검증 게이트 · SemaPLC</text>
  <text x="56" y="408" font-size="12.5" fill="#374151">모델의 "다 했다" 선언 무시, 외부 체크 통과만 인정</text>
  <text x="56" y="426" font-size="12.5" fill="#374151">동적 실행 점수 22.4~31.4 → 52.2</text>
  <text x="56" y="444" font-size="12.5" fill="#6b7280">arXiv 2608.18565</text>

  <!-- bottom-right: harness updates -->
  <rect x="530" y="360" width="330" height="100" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="546" y="386" font-size="15" font-weight="700" fill="#991b1b">하네스 업데이트</text>
  <text x="546" y="408" font-size="12.5" fill="#374151">Codex CLI 0.148.0 stable: 세션 포크, /export</text>
  <text x="546" y="426" font-size="12.5" fill="#374151">Claude Code v2.1.236~237: 게이트웨이 캐시 수정</text>
  <text x="546" y="444" font-size="12.5" fill="#6b7280">8/18~8/20 릴리즈</text>

  <!-- bottom takeaway -->
  <rect x="150" y="495" width="600" height="44" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="450" y="522" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">공통 교훈: 에이전트 성능은 모델이 아니라 환경·게이트 설계에서 갈린다</text>
</svg>
