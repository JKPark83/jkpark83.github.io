<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="440" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">LEASH: 불확실성 3겹으로 강한 모델을 "묶어두기"</text>

  <!-- 레이어 1 -->
  <rect x="30" y="60" width="230" height="120" rx="12" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="145" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">① 초기 라우팅</text>
  <text x="145" y="112" text-anchor="middle" font-size="12" fill="#333">태스크 수준 불확실성으로</text>
  <text x="145" y="130" text-anchor="middle" font-size="12" fill="#333">시작부터 약한/강한 모델 배정</text>
  <text x="145" y="158" text-anchor="middle" font-size="11" fill="#1d4ed8">기본값: 약한 모델이 실행</text>

  <!-- 레이어 2 -->
  <rect x="285" y="60" width="230" height="120" rx="12" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="400" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b5431a">② 스텝 단위 에스컬레이션</text>
  <text x="400" y="112" text-anchor="middle" font-size="12" fill="#333">매 스텝 은닉 상태를 과거</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#333">성공/실패 궤적과 비교</text>
  <text x="400" y="158" text-anchor="middle" font-size="11" fill="#b5431a">실패 쪽에 가까우면 → 핸드오프</text>

  <!-- 레이어 3 -->
  <rect x="540" y="60" width="230" height="120" rx="12" fill="#f5efff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="655" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">③ 섀도 옵저버</text>
  <text x="655" y="112" text-anchor="middle" font-size="12" fill="#333">핸드오프 이후에도 약한 모델이</text>
  <text x="655" y="130" text-anchor="middle" font-size="12" fill="#333">블랙박스 강한 모델을 계속 감시</text>
  <text x="655" y="158" text-anchor="middle" font-size="11" fill="#6d28d9">강한 모델이 헤매는 것도 탐지</text>

  <!-- 화살표 -->
  <path d="M260 120 L281 120" stroke="#888" stroke-width="2" fill="none"/>
  <path d="M275 114 L285 120 L275 126 Z" fill="#888"/>
  <path d="M515 120 L536 120" stroke="#888" stroke-width="2" fill="none"/>
  <path d="M530 114 L540 120 L530 126 Z" fill="#888"/>

  <!-- 연료 밴드 -->
  <rect x="30" y="210" width="740" height="64" rx="10" fill="#eefaf0" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="400" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1e7a42">공통 연료: 약한 모델의 잠재(latent) 불확실성</text>
  <text x="400" y="258" text-anchor="middle" font-size="12" fill="#333">액션 생성 때 이미 만들어진 활성값을 재사용 — 추가 forward pass도, 모니터 학습도 불필요</text>

  <!-- 결과 박스 -->
  <rect x="30" y="296" width="740" height="104" rx="10" fill="#fff" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="400" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">결과 (OSWorld, 저자 보고치)</text>
  <text x="400" y="346" text-anchor="middle" font-size="12" fill="#333">Qwen3.5-35B-A3B + LEASH: 성공률 73.66% / 태스크당 $0.41</text>
  <text x="400" y="366" text-anchor="middle" font-size="12" fill="#333">상시 Claude Opus 5 (72.90%)와 동급, 추론 비용은 19.2% 절감</text>
  <text x="400" y="388" text-anchor="middle" font-size="11" fill="#777">동일 에스컬레이션 비율의 무작위 핸드오프 대비 +6.55~11.94pt</text>

  <text x="400" y="424" text-anchor="middle" font-size="11" fill="#999">출처: arXiv 2610.22280 · 자체 제작</text>
</svg>
