  <text x="424" y="310" fill="#e2e8f0" font-size="13" font-weight="600">🟦 CC: AGENTS.md 공식 지원 (agents-md 모드)</text>
  <text x="424" y="330" fill="#94a3b8" font-size="12">instructionFiles 옵션 4모드 · /config에서 선택</text>
  <text x="424" y="356" fill="#e2e8f0" font-size="13" font-weight="600">🟩 Codex: 샌드박스 투명 TCP 라우팅 (11/13)</text>
  <text x="424" y="376" fill="#94a3b8" font-size="12">--transparent-tcp · 네이티브 소켓도 관리 프록시로</text>
  <text x="424" y="402" fill="#e2e8f0" font-size="13" font-weight="600">🟪 공통: "이 행동이 도움됐나" 사후 심판 평가</text>
  <text x="424" y="422" fill="#94a3b8" font-size="12">성공 예측 대신 행동 단위 기여 판정</text>
