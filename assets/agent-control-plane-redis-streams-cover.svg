<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="짧게 사는 에이전트 태스크 수백만 개가 쿠버네티스 etcd를 무너뜨리는 문제를, Google AX가 상태 저장소를 Redis Streams로 옮겨 해결한다는 표지 그림">
  <defs>
    <linearGradient id="acp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <linearGradient id="acp-redis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#acp-bg)"/>

  <!-- 왼쪽: 제목 -->
  <text x="80" y="170" font-family="sans-serif" font-size="54" font-weight="800" fill="#f1f5f9">태스크 100만 개,</text>
  <text x="80" y="238" font-family="sans-serif" font-size="54" font-weight="800" fill="#f1f5f9">etcd는 못 버틴다</text>
  <text x="80" y="308" font-family="sans-serif" font-size="31" font-weight="700" fill="#38bdf8">에이전트 컨트롤 플레인 다시 짜기</text>
  <text x="80" y="360" font-family="sans-serif" font-size="21" fill="#94a3b8">Google AX v0.3.0 — 상태를 etcd에서</text>
  <text x="80" y="390" font-family="sans-serif" font-size="21" fill="#94a3b8">Redis Streams로 옮긴 이유</text>
  <text x="80" y="446" font-family="sans-serif" font-size="19" fill="#4ade80">선언적 매니페스트 · 리컨사일러 · consumer group</text>

  <!-- 오른쪽: before(etcd 과부하) → after(Redis Streams) -->
  <g transform="translate(720,90)">
    <!-- 짧게 사는 태스크 폭풍 -->
    <g fill="#fb7185" opacity="0.9">
      <rect x="20" y="10" width="26" height="26" rx="5"/>
      <rect x="60" y="0" width="26" height="26" rx="5"/>
      <rect x="100" y="14" width="26" height="26" rx="5"/>
      <rect x="140" y="2" width="26" height="26" rx="5"/>
      <rect x="40" y="46" width="26" height="26" rx="5"/>
      <rect x="90" y="44" width="26" height="26" rx="5"/>
      <rect x="130" y="48" width="26" height="26" rx="5"/>
    </g>
    <text x="95" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94a3b8">짧게 사는 태스크 × 100만</text>

    <!-- etcd 과부하 박스 -->
    <rect x="10" y="120" width="170" height="70" rx="12" fill="none" stroke="#fb7185" stroke-width="3.5" stroke-dasharray="6 5"/>
    <text x="95" y="150" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#fecaca">etcd (Raft 합의)</text>
    <text x="95" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fca5a5">컨트롤 플레인 붕괴</text>

    <!-- 화살표 -->
    <path d="M 95 200 L 95 236" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M 89 230 l 6 10 l 6 -10 z" fill="#64748b"/>
    <text x="150" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">상태 이전</text>

    <!-- Redis Streams 박스 -->
    <rect x="10" y="248" width="230" height="150" rx="14" fill="none" stroke="url(#acp-redis)" stroke-width="4"/>
    <text x="125" y="284" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="800" fill="#e2e8f0">Redis Streams</text>
    <!-- 스트림 이벤트 점들 -->
    <g fill="#38bdf8">
      <circle cx="45" cy="320" r="9"/>
      <circle cx="80" cy="320" r="9"/>
      <circle cx="115" cy="320" r="9"/>
      <circle cx="150" cy="320" r="9"/>
      <circle cx="185" cy="320" r="9"/>
    </g>
    <path d="M 40 340 L 210 340" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <text x="125" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#94a3b8">consumer group → 리컨사일러 풀</text>
  </g>
</svg>
