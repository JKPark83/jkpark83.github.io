  <text x="24" y="50" font-size="12" fill="#64748b">학습 없이 추론 프레임워크만 교체. 주 스레드의 순차 디코딩 경로에서 추가 추론을 빼낸다.</text>

  <text x="24" y="86" font-size="12.5" font-weight="700" fill="#b91c1c">기존 ReAct — 추론이 멈추는 구간</text>
