<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="GPU 클러스터 대신 온칩 SRAM 44GB짜리 웨이퍼 스케일 칩 여러 장을 파이프라인으로 이어 2.8조 파라미터 모델을 서빙하는 모습을 단순화한 그림">
  <defs>
    <linearGradient id="wsig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="wsi-green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="wsi-sky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="wsi-amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#wsig)"/>

  <text x="80" y="96" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="46" font-weight="800">GPU 없이 3조 파라미터를 서빙한다고?</text>
  <text x="80" y="152" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800">웨이퍼 스케일 추론의 수학</text>
  <text x="80" y="200" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22">온칩 SRAM 44GB × 59장 · 21PB/s · Kimi K3 2.8T — Cerebras 설계 해부</text>

  <!-- wafer pipeline -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">
    <rect x="80" y="280" width="170" height="170" rx="18" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <rect x="98" y="310" width="134" height="52" rx="9" fill="url(#wsi-sky)" opacity="0.85"/>
    <text x="165" y="342" text-anchor="middle" fill="#0f172a">KDA ×2</text>
    <rect x="98" y="372" width="134" height="52" rx="9" fill="url(#wsi-sky)" opacity="0.5"/>
    <text x="165" y="404" text-anchor="middle" fill="#0f172a">44GB SRAM</text>

    <rect x="310" y="280" width="170" height="170" rx="18" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <rect x="328" y="310" width="134" height="52" rx="9" fill="url(#wsi-sky)" opacity="0.85"/>
    <text x="395" y="342" text-anchor="middle" fill="#0f172a">KDA ×2</text>
    <rect x="328" y="372" width="134" height="52" rx="9" fill="url(#wsi-sky)" opacity="0.5"/>
    <text x="395" y="404" text-anchor="middle" fill="#0f172a">44GB SRAM</text>

    <text x="540" y="372" text-anchor="middle" fill="#64748b" font-size="34">⋯</text>

    <rect x="600" y="280" width="170" height="170" rx="18" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <rect x="618" y="310" width="134" height="52" rx="9" fill="url(#wsi-amber)" opacity="0.85"/>
    <text x="685" y="342" text-anchor="middle" fill="#0f172a">MLA ×1</text>
    <rect x="618" y="372" width="134" height="52" rx="9" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="685" y="404" text-anchor="middle" fill="#fbbf24" font-size="15">KV 캐시</text>

    <rect x="830" y="280" width="170" height="170" rx="18" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
    <rect x="848" y="310" width="134" height="52" rx="9" fill="url(#wsi-amber)" opacity="0.7"/>
    <text x="915" y="342" text-anchor="middle" fill="#0f172a">MLA ×1</text>
    <rect x="848" y="372" width="134" height="52" rx="9" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8"/>
    <text x="915" y="404" text-anchor="middle" fill="#fbbf24" font-size="15">KV 캐시</text>

    <text x="1060" y="372" text-anchor="middle" fill="#64748b" font-size="34">⋯</text>
  </g>

  <!-- activation arrows -->
  <g stroke="#4ade80" stroke-width="4">
    <line x1="250" y1="365" x2="310" y2="365"/>
    <line x1="770" y1="365" x2="830" y2="365"/>
  </g>
  <polygon points="310,365 296,357 296,373" fill="#4ade80"/>
  <polygon points="830,365 816,357 816,373" fill="#4ade80"/>

  <text x="80" y="520" fill="#4ade80" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">웨이퍼 사이를 건너는 건 활성값뿐 — RDMA ~2µs/hop</text>
  <text x="80" y="566" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20">디코드 속도 상한 ≈ 메모리 대역폭 ÷ 토큰당 읽을 바이트 — 그래서 SRAM 21PB/s</text>
</svg>
