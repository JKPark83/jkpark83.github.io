<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="820" height="480" fill="#0f172a" rx="12"/>
  <text x="410" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">SHIFT: 실행 없이 쿼리별 하니스를 조립한다</text>
  <text x="410" y="60" text-anchor="middle" fill="#94a3b8" font-size="12.5">arXiv 2610.04137 내용 기반 자체 제작</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="30" y="100" width="150" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="105" y="135" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">사용자 쿼리</text>
  <text x="105" y="158" text-anchor="middle" fill="#cbd5e1" font-size="11.5">수학 · 문서 · 범용</text>
  <text x="105" y="175" text-anchor="middle" fill="#cbd5e1" font-size="11.5">과제별로 다 다름</text>

  <line x1="180" y1="145" x2="225" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="230" y="85" width="190" height="120" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="325" y="115" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">로컬 아키텍트 LLM</text>
  <text x="325" y="140" text-anchor="middle" fill="#cbd5e1" font-size="11.5">하니스 조립 액션에 대한</text>
  <text x="325" y="157" text-anchor="middle" fill="#cbd5e1" font-size="11.5">정책 + 가치함수(비용·정확도</text>
  <text x="325" y="174" text-anchor="middle" fill="#cbd5e1" font-size="11.5">예측)를 과거 실행에서 학습</text>
  <text x="325" y="196" text-anchor="middle" fill="#fbbf24" font-size="11.5" font-weight="700">추론 시 실행 탐색 없음</text>

  <line x1="420" y1="145" x2="465" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="470" y="85" width="150" height="120" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="545" y="115" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">MCTS 탐색</text>
  <text x="545" y="140" text-anchor="middle" fill="#cbd5e1" font-size="11.5">예측값만으로</text>
  <text x="545" y="157" text-anchor="middle" fill="#cbd5e1" font-size="11.5">역할 · 지침 · 도구 ·</text>
  <text x="545" y="174" text-anchor="middle" fill="#cbd5e1" font-size="11.5">통신 구조를 동시에</text>
  <text x="545" y="191" text-anchor="middle" fill="#cbd5e1" font-size="11.5">선택</text>

  <line x1="620" y1="145" x2="665" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="670" y="100" width="120" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="730" y="135" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700">1회 실행</text>
  <text x="730" y="158" text-anchor="middle" fill="#cbd5e1" font-size="11.5">맞춤 하니스로</text>
  <text x="730" y="175" text-anchor="middle" fill="#cbd5e1" font-size="11.5">과제 수행</text>

  <!-- results -->
  <text x="50" y="268" fill="#f1f5f9" font-size="15" font-weight="700">결과 (논문 보고치 · 9,193개 과제 · Gemini 3.5 Flash 실행기)</text>

  <text x="50" y="305" fill="#cbd5e1" font-size="12.5">평균 정확도 약 80%</text>
  <rect x="300" y="292" width="440" height="18" rx="4" fill="#334155"/>
  <rect x="300" y="292" width="352" height="18" rx="4" fill="#38bdf8"/>
  <text x="745" y="306" fill="#94a3b8" font-size="11.5">17개 베이스라인 중 1위</text>

  <text x="50" y="345" fill="#cbd5e1" font-size="12.5">최강 베이스라인 대비</text>
  <rect x="300" y="332" width="440" height="18" rx="4" fill="#334155"/>
  <rect x="300" y="332" width="130" height="18" rx="4" fill="#34d399"/>
  <text x="440" y="346" fill="#34d399" font-size="12.5" font-weight="700">+7.2pp</text>

  <text x="50" y="385" fill="#cbd5e1" font-size="12.5">저비용 모드 실행 토큰</text>
  <rect x="300" y="372" width="440" height="18" rx="4" fill="#334155"/>
  <rect x="300" y="372" width="141" height="18" rx="4" fill="#f59e0b"/>
  <text x="450" y="386" fill="#f59e0b" font-size="12.5" font-weight="700">-32% (정확도는 모든 베이스라인 이상)</text>

  <text x="50" y="430" fill="#94a3b8" font-size="12">구조 · 지침 · 도구를 "같이" 고르면 하나만 고를 때보다 최대 +9.1pp</text>
  <text x="50" y="452" fill="#94a3b8" font-size="12">시사점: 고정 하니스 하나로 모든 쿼리를 받는 설계가 가장 손해를 본다</text>
</svg>
