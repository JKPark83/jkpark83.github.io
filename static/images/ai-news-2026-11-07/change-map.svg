  <text x="50" y="290" font-size="15" font-weight="700" fill="#9c6a1f">🛠 오픈소스</text>
  <text x="50" y="318" font-size="14" font-weight="600" fill="#222">dsh-superagent — DeepSeek 팀의 자율 에이전트</text>
