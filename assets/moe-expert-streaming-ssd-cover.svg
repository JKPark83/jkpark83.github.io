<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="노트북의 작은 RAM 상자 아래 거대한 SSD 서가에 전문가 블록 수백 개가 쌓여 있고, 라우터가 고른 전문가 몇 개만 SSD에서 RAM의 캐시로 스트리밍되어 올라가는 그림. 아래에는 '전체를 올리지 말고, 필요한 전문가만 올려라'라는 문구가 있다.">
  <defs>
    <linearGradient id="esb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="esb-ram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="esb-stream" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#esb-bg)"/>
  <g font-family="'Segoe UI',system-ui,sans-serif">

    <!-- 제목 -->
    <text x="600" y="70" fill="#e2e8f0" font-size="40" font-weight="800" text-anchor="middle">RAM보다 큰 모델 돌리기</text>
    <text x="600" y="108" fill="#94a3b8" font-size="21" text-anchor="middle">MoE 전문가 스트리밍 · SSD 오프로딩</text>

    <!-- RAM 박스 (위, 작음) -->
    <g>
      <rect x="430" y="150" width="340" height="120" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
      <text x="600" y="182" fill="#6ee7b7" font-size="20" font-weight="700" text-anchor="middle">RAM 32GB — 전문가 캐시</text>
      <g fill="url(#esb-ram)">
        <rect x="455" y="200" width="54" height="44" rx="7"/>
        <rect x="519" y="200" width="54" height="44" rx="7"/>
        <rect x="583" y="200" width="54" height="44" rx="7"/>
        <rect x="647" y="200" width="54" height="44" rx="7" opacity="0.6"/>
        <rect x="711" y="200" width="36" height="44" rx="7" opacity="0.35"/>
      </g>
    </g>

    <!-- 스트리밍 화살표 -->
    <g>
      <path d="M 560 380 L 560 290 M 600 380 L 600 290 M 640 380 L 640 290" stroke="url(#esb-stream)" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M 545 305 L 560 283 L 575 305 Z" fill="#34d399"/>
      <path d="M 585 305 L 600 283 L 615 305 Z" fill="#34d399"/>
      <path d="M 625 305 L 640 283 L 655 305 Z" fill="#34d399"/>
      <text x="765" y="340" fill="#fbbf24" font-size="18" font-weight="700">~7GB/s 스트리밍</text>
      <text x="765" y="366" fill="#64748b" font-size="15">이번 토큰의 전문가만</text>
    </g>

    <!-- SSD 서가 (아래, 큼) -->
    <g>
      <rect x="150" y="390" width="900" height="160" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
      <text x="600" y="425" fill="#fbbf24" font-size="20" font-weight="700" text-anchor="middle">NVMe SSD — 모델 전체 48.4GB (48층 × 512 전문가)</text>
      <g fill="#f59e0b">
        <g opacity="0.45">
          <rect x="185" y="448" width="40" height="30" rx="5"/><rect x="235" y="448" width="40" height="30" rx="5"/><rect x="285" y="448" width="40" height="30" rx="5"/><rect x="335" y="448" width="40" height="30" rx="5"/><rect x="385" y="448" width="40" height="30" rx="5"/><rect x="435" y="448" width="40" height="30" rx="5"/><rect x="485" y="448" width="40" height="30" rx="5"/><rect x="535" y="448" width="40" height="30" rx="5"/><rect x="635" y="448" width="40" height="30" rx="5"/><rect x="685" y="448" width="40" height="30" rx="5"/><rect x="735" y="448" width="40" height="30" rx="5"/><rect x="785" y="448" width="40" height="30" rx="5"/><rect x="885" y="448" width="40" height="30" rx="5"/><rect x="935" y="448" width="40" height="30" rx="5"/><rect x="985" y="448" width="40" height="30" rx="5"/>
          <rect x="185" y="488" width="40" height="30" rx="5"/><rect x="235" y="488" width="40" height="30" rx="5"/><rect x="335" y="488" width="40" height="30" rx="5"/><rect x="385" y="488" width="40" height="30" rx="5"/><rect x="435" y="488" width="40" height="30" rx="5"/><rect x="485" y="488" width="40" height="30" rx="5"/><rect x="535" y="488" width="40" height="30" rx="5"/><rect x="585" y="488" width="40" height="30" rx="5"/><rect x="635" y="488" width="40" height="30" rx="5"/><rect x="735" y="488" width="40" height="30" rx="5"/><rect x="785" y="488" width="40" height="30" rx="5"/><rect x="835" y="488" width="40" height="30" rx="5"/><rect x="885" y="488" width="40" height="30" rx="5"/><rect x="985" y="488" width="40" height="30" rx="5"/>
        </g>
        <rect x="585" y="448" width="40" height="30" rx="5" stroke="#fef3c7" stroke-width="2.5"/>
        <rect x="835" y="448" width="40" height="30" rx="5" stroke="#fef3c7" stroke-width="2.5"/>
        <rect x="285" y="488" width="40" height="30" rx="5" stroke="#fef3c7" stroke-width="2.5"/>
        <rect x="685" y="488" width="40" height="30" rx="5" stroke="#fef3c7" stroke-width="2.5"/>
        <rect x="935" y="488" width="40" height="30" rx="5" stroke="#fef3c7" stroke-width="2.5"/>
      </g>
    </g>

    <!-- 하단 문구 -->
    <text x="600" y="600" fill="#cbd5e1" font-size="23" font-weight="700" text-anchor="middle">"전체를 올리지 말고, 필요한 전문가만 올려라"</text>
  </g>
</svg>
