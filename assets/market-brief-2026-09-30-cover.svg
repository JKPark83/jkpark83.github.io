<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="미국 소비자신뢰지수가 81.9로 12년 만의 최저로 떨어지자 10월 금리 인상 확률이 70퍼센트에서 51퍼센트로 급락했고, OpenAI는 차기 모델 출시를 취소했으며, 증시는 이틀째 소폭 하락에 그쳤다는 것을 나타낸 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.09.30 · 나스닥 &amp; 비트코인 5분 요약 · 수요일판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">소비 심리 12년 최저 쇼크 — 인상 베팅이 반으로 꺾였습니다 · OpenAI는 차기 모델 출시 취소</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">밤사이 달라진 것</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#f87171">81.9</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">소비자신뢰 · 12년 최저</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#4ade80">70→51%</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">10월 인상 확률 급락</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">심리 온도</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#facc15">32</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">주식 · 공포</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#a5b4fc">중립</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">암호화폐 · 48~55</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="19" fill="#94a3b8">나스닥 관망 · 암호화폐 관망 — 오늘 밤 PCE, 내일 새벽 마이크론</text>
