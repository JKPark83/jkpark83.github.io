  <text x="50" y="290" font-size="15" font-weight="700" fill="#9c6a1f">🛠 오픈소스</text>
  <text x="50" y="318" font-size="14" font-weight="600" fill="#222">tstack — Theo의 일상용 에이전트 스킬</text>
  <text x="50" y="340" font-size="12.5" fill="#444">full-send / council / babysit-pr · CC+Codex 겸용</text>
  <text x="50" y="368" font-size="14" font-weight="600" fill="#222">OpenDuet — 선제적 에이전트 템플릿</text>
  <text x="50" y="390" font-size="12.5" fill="#444">에이전트 전용 컴퓨터 · Slack/Teams · MIT</text>

