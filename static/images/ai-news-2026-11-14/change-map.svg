  <text x="40" y="180" fill="#e2e8f0" font-size="13" font-weight="600">Gemini 3.8 Flash 가격 인상 예고</text>
  <text x="40" y="200" fill="#94a3b8" font-size="12">$0.75/$3.75는 12/31까지 → 1/1부터 $1.50/$7.50</text>
  <text x="40" y="226" fill="#facc15" font-size="12" font-weight="600">→ Flash 고정 파이프라인은 연내 재평가</text>

  <!-- 논문 -->
  <rect x="408" y="56" width="368" height="186" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
