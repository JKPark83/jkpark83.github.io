<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="월요일 아침 브리핑 표지. 일요일 새벽 비트코인이 62,000달러까지 밀렸다가 65,000달러 안팎으로 돌아왔습니다. 하루 청산은 약 20억달러였고 코인 공포탐욕지수는 10으로 사흘 연속 극단 공포입니다. 매수 조건은 아직 충족되지 않아 비트코인은 관망을 유지합니다. 나스닥도 관망 유지, 화요일 엔비디아 실적과 수요일 FOMC 의사록, 목요일 앤스로픽 상장이 이어지는 큰 주간입니다">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101723"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.16 · 나스닥 &amp; 비트코인 5분 요약 · 월요일판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#fca5a5">BTC 일요일 저점 62,000 → 65,000 안팎 회복 · 청산 20억달러 · 코인 심리 10 (사흘 연속 극단 공포)</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 수퍼위크 개막</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#a5b4fc">25,136</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">금요일 종가 · 검토선 아래</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">나스닥 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">화 엔비디아 · 수 의사록</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 극단 공포 10</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#06b6d4" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#22d3ee">62,000 저점</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a5f3fc">7월 이후 최저 후 반등</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">비트코인 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">매수 조건 미충족 · 대기</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">오늘 오전 9시 BTC 주간 마감 — 8월 이후 첫 200주선 아래 주간 종가 판정 · 본 브리핑은 투자 자문이 아닙니다</text>
</svg>
