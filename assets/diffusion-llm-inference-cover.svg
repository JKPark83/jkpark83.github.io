<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="왼쪽은 자기회귀 모델이 토큰을 한 글자씩 순서대로 쓰는 모습, 오른쪽은 확산 언어 모델이 마스크로 가득한 문장 전체를 몇 번의 스텝 만에 한꺼번에 다듬어 완성하는 모습을 대비한 그림.">
  <defs>
    <linearGradient id="dlibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dlibg)"/>

  <text x="600" y="80" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="42" font-weight="800">한 글자씩 쓰지 않는 LLM</text>
  <text x="600" y="124" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="23">확산 언어 모델(dLLM)의 병렬 디코딩과 770 토큰/초의 비밀</text>

  <line x1="600" y1="168" x2="600" y2="556" stroke="#334155" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- 왼쪽: 자기회귀 -->
  <text x="310" y="205" text-anchor="middle" fill="#fb7185" font-family="system-ui,sans-serif" font-size="24" font-weight="700">자기회귀 (AR)</text>
  <text x="310" y="236" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="17">토큰 1개 = forward 1번, 순차 진행</text>

  <g font-family="ui-monospace,monospace" font-size="20" font-weight="700">
    <rect x="95" y="270" width="60" height="52" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="125" y="303" text-anchor="middle" fill="#e2e8f0">봄</text>
    <rect x="167" y="270" width="60" height="52" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="197" y="303" text-anchor="middle" fill="#e2e8f0">이</text>
    <rect x="239" y="270" width="60" height="52" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="269" y="303" text-anchor="middle" fill="#e2e8f0">오</text>
    <rect x="311" y="270" width="60" height="52" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="341" y="303" text-anchor="middle" fill="#64748b">?</text>
    <rect x="383" y="270" width="60" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="455" y="270" width="60" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <path d="M 125 345 C 200 385 420 385 480 345" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M 474 340 l 12 4 l -9 9 z" fill="#fb7185"/>
  <text x="310" y="420" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="18">1,000 토큰 = 순차 스텝 1,000번</text>
  <text x="310" y="452" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="16">매 스텝 가중치 전체를 다시 읽음 → 메모리 대역폭 병목</text>

  <!-- 오른쪽: 확산 -->
  <text x="890" y="205" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="24" font-weight="700">확산 (Diffusion)</text>
  <text x="890" y="236" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="17">문장 전체를 병렬로 반복해서 다듬기</text>

  <g font-family="ui-monospace,monospace" font-size="19" font-weight="700">
    <!-- step 1: 전부 마스크 -->
    <g>
      <text x="672" y="296" text-anchor="end" fill="#64748b" font-family="system-ui,sans-serif" font-size="15">step 1</text>
      <rect x="690" y="268" width="52" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="716" y="297" text-anchor="middle" fill="#64748b">▒</text>
      <rect x="752" y="268" width="52" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="778" y="297" text-anchor="middle" fill="#64748b">▒</text>
      <rect x="814" y="268" width="52" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="840" y="297" text-anchor="middle" fill="#64748b">▒</text>
      <rect x="876" y="268" width="52" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="902" y="297" text-anchor="middle" fill="#64748b">▒</text>
      <rect x="938" y="268" width="52" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="964" y="297" text-anchor="middle" fill="#64748b">▒</text>
      <rect x="1000" y="268" width="52" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="1026" y="297" text-anchor="middle" fill="#64748b">▒</text>
    </g>
    <!-- step 2: 절반 확정 -->
    <g>
      <text x="672" y="366" text-anchor="end" fill="#64748b" font-family="system-ui,sans-serif" font-size="15">step 2</text>
      <rect x="690" y="338" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="716" y="367" text-anchor="middle" fill="#e2e8f0">봄</text>
      <rect x="752" y="338" width="52" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="778" y="367" text-anchor="middle" fill="#64748b">▒</text>
      <rect x="814" y="338" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="840" y="367" text-anchor="middle" fill="#e2e8f0">오</text>
      <rect x="876" y="338" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="902" y="367" text-anchor="middle" fill="#e2e8f0">니</text>
      <rect x="938" y="338" width="52" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.6"/><text x="964" y="367" text-anchor="middle" fill="#64748b">▒</text>
      <rect x="1000" y="338" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="1026" y="367" text-anchor="middle" fill="#e2e8f0">다</text>
    </g>
    <!-- step 3: 완성 -->
    <g>
      <text x="672" y="436" text-anchor="end" fill="#64748b" font-family="system-ui,sans-serif" font-size="15">step 3</text>
      <rect x="690" y="408" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="716" y="437" text-anchor="middle" fill="#e2e8f0">봄</text>
      <rect x="752" y="408" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="778" y="437" text-anchor="middle" fill="#e2e8f0">이</text>
      <rect x="814" y="408" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="840" y="437" text-anchor="middle" fill="#e2e8f0">오</text>
      <rect x="876" y="408" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="902" y="437" text-anchor="middle" fill="#e2e8f0">니</text>
      <rect x="938" y="408" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="964" y="437" text-anchor="middle" fill="#e2e8f0">까</text>
      <rect x="1000" y="408" width="52" height="44" rx="7" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="1026" y="437" text-anchor="middle" fill="#e2e8f0">다</text>
    </g>
  </g>
  <text x="890" y="500" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="18">1,000 토큰 = 스텝 수십 번, 스텝마다 여러 토큰 확정</text>

  <text x="600" y="596" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="17">Mercury 2.5 실측 약 770 tok/s · Gemini Diffusion 1,479 tok/s — 속도의 정체는 아키텍처</text>
</svg>
