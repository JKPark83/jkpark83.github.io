<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="9월 CPI가 3.7퍼센트로 전망을 웃돌며 나스닥이 1.9퍼센트 하락했지만 국채금리는 오히려 내린 수요일 시장과, 코어위브 회사채 금리 급등으로 번진 AI 부채 불안, ETF 유입 복귀에도 8만2,000달러 아래로 밀린 비트코인을 요약한 목요일 아침 브리핑 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.10.15 · 나스닥 &amp; 비트코인 5분 요약 · 목요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">CPI 3.7% 재가속 — 그런데 금리는 내렸고, 나스닥은 'AI 빚' 걱정에 밀렸습니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">수요일 — CPI 쇼크는 채권이 흡수</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">나스닥 -1.9%</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">코어위브 -15% · AI 신용 불안</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.14"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#4ade80">10년물 5.20%</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">급등 후 되레 하락 마감</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">비트코인 — 유입 복귀에도 후퇴</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#f59e0b" opacity="0.15"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fbbf24">$81,800대</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fde68a">8만2,000달러 선 반납</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#a5b4fc">오늘 TSMC</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">KST 15:00 · 밤 21:30 PPI·소매판매</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">나스닥 관망 · 암호화폐 매도 — 본 글은 정보 제공 목적이며 투자 자문이 아닙니다</text>
</svg>
