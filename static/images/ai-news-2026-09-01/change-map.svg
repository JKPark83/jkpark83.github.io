<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="430" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">오늘의 AI 변화 지도 — 2026-09-01</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">공통 축: 에이전트 루프가 "감"에서 "측정 대상"으로 넘어간다</text>

  <!-- center node -->
  <rect x="285" y="192" width="230" height="56" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="216" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="bold">루프 엔지니어링의 계측화</text>
  <text x="400" y="236" text-anchor="middle" fill="#94a3b8" font-size="11">컨트롤러 벤치마크 · 훅 · 스킬 유통</text>

  <!-- connectors -->
  <line x1="285" y1="205" x2="215" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="515" y1="205" x2="585" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="285" y1="238" x2="215" y2="300" stroke="#334155" stroke-width="1.5"/>
  <line x1="515" y1="238" x2="585" y2="300" stroke="#334155" stroke-width="1.5"/>

  <!-- top-left: models/releases -->
  <rect x="35" y="80" width="180" height="88" rx="10" fill="#172554" stroke="#3b82f6"/>
  <text x="125" y="102" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">모델 · 릴리즈</text>
  <text x="125" y="122" text-anchor="middle" fill="#e2e8f0" font-size="11">Claudeforce 9월 오픈베타</text>
  <text x="125" y="139" text-anchor="middle" fill="#e2e8f0" font-size="11">Codex 0.152 알파 연타</text>
  <text x="125" y="156" text-anchor="middle" fill="#e2e8f0" font-size="11">Claude Code 2.1.252</text>

  <!-- top-right: papers -->
  <rect x="585" y="80" width="180" height="88" rx="10" fill="#3b0764" stroke="#a855f7"/>
  <text x="675" y="102" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="bold">논문</text>
  <text x="675" y="122" text-anchor="middle" fill="#e2e8f0" font-size="11">LoopArena: 컨트롤러 평가</text>
  <text x="675" y="139" text-anchor="middle" fill="#e2e8f0" font-size="11">최고 성공률 24.69%</text>
  <text x="675" y="156" text-anchor="middle" fill="#e2e8f0" font-size="11">J-Zero: 심판 공동 진화</text>

  <!-- bottom-left: open source -->
  <rect x="35" y="262" width="180" height="88" rx="10" fill="#052e16" stroke="#22c55e"/>
  <text x="125" y="284" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold">오픈소스</text>
  <text x="125" y="304" text-anchor="middle" fill="#e2e8f0" font-size="11">Archify v2.16 (다이어그램 스킬)</text>
  <text x="125" y="321" text-anchor="middle" fill="#e2e8f0" font-size="11">Raven (자기개선 하네스)</text>
  <text x="125" y="338" text-anchor="middle" fill="#e2e8f0" font-size="11">스킬 = 새 배포 단위</text>

  <!-- bottom-right: tips -->
  <rect x="585" y="262" width="180" height="88" rx="10" fill="#431407" stroke="#f97316"/>
  <text x="675" y="284" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="bold">실전 팁</text>
  <text x="675" y="304" text-anchor="middle" fill="#e2e8f0" font-size="11">Codex 훅 이벤트 12종</text>
  <text x="675" y="321" text-anchor="middle" fill="#e2e8f0" font-size="11">Claude Code 명령 검증 훅</text>
  <text x="675" y="338" text-anchor="middle" fill="#e2e8f0" font-size="11">컨트롤러 회귀 테스트</text>

  <text x="400" y="408" text-anchor="middle" fill="#64748b" font-size="11">읽는 법: 네 영역 모두 "루프를 계측하고 통제한다"는 한 방향을 가리킨다</text>
</svg>
