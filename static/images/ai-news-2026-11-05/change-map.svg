<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="480" fill="#fafafa"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">오늘의 AI 변화 지도 — 2026-11-05</text>

  <!-- quadrant backgrounds -->
  <rect x="30" y="56" width="360" height="190" rx="12" fill="#eef4ff" stroke="#b9cdf2"/>
  <rect x="410" y="56" width="360" height="190" rx="12" fill="#f0fbf2" stroke="#b5dfc0"/>
  <rect x="30" y="262" width="360" height="190" rx="12" fill="#fff7ec" stroke="#eed3a8"/>
  <rect x="410" y="262" width="360" height="190" rx="12" fill="#f7f0fb" stroke="#d7bfe8"/>

  <!-- 모델/릴리즈 -->
  <text x="50" y="84" font-size="15" font-weight="700" fill="#1f4e9c">🤖 모델 / 릴리즈</text>
  <text x="50" y="112" font-size="14" font-weight="600" fill="#222">Kimi K3.1 Pro 웨이트 — HF 공개</text>
  <text x="50" y="134" font-size="12.5" fill="#444">2.8T MoE(활성 104B) · 1M 컨텍스트 · 멀티모달</text>
  <text x="50" y="154" font-size="12.5" fill="#444">MXFP4 QAT · reasoning_effort low/high/max</text>
  <text x="50" y="182" font-size="12.5" fill="#666">어제 "미등록"이던 그 모델이 실제로 올라옴</text>
  <text x="50" y="202" font-size="12.5" fill="#666">커스텀 라이선스 — 상업 조건 확인 필요</text>

  <!-- 논문 -->
  <text x="430" y="84" font-size="15" font-weight="700" fill="#1e7a35">📚 논문</text>
  <text x="430" y="112" font-size="14" font-weight="600" fill="#222">ToolSpace — 툴 중심 환경 합성</text>
  <text x="430" y="134" font-size="12.5" fill="#444">실행 트레이스에서 환경 역합성 · 35B가 Opus 5급</text>
  <text x="430" y="162" font-size="14" font-weight="600" fill="#222">Axion 1.0 — 완전 공개 에이전트 모델</text>
  <text x="430" y="184" font-size="12.5" fill="#444">SFT 2단계 + RL, 3단계 레시피 전체 공개</text>
  <text x="430" y="204" font-size="12.5" fill="#444">데이터 구축·검증·학습 코드까지 재현 가능</text>

  <!-- 오픈소스 -->
  <text x="50" y="290" font-size="15" font-weight="700" fill="#9c6a1f">🛠 오픈소스</text>
  <text x="50" y="318" font-size="14" font-weight="600" fill="#222">agent-autoloop — CLI 에이전트 백그라운드 루프</text>
  <text x="50" y="340" font-size="12.5" fill="#444">이벤트 → 배정 → 한 턴 후 종료 · 결정만 카드로</text>
  <text x="50" y="368" font-size="14" font-weight="600" fill="#222">uncut — 무손실 헤드리스 하네스</text>
  <text x="50" y="390" font-size="12.5" fill="#444">7MB 단일 바이너리 · 툴 4개 · 압축/절단 없음</text>

  <!-- 도구/팁 -->
  <text x="430" y="290" font-size="15" font-weight="700" fill="#6a3a9c">🧑‍💻 도구 / 팁</text>
  <text x="430" y="318" font-size="14" font-weight="600" fill="#222">Codex — AGENTS.md 바이트 예산 경고</text>
  <text x="430" y="340" font-size="12.5" fill="#444">project_doc_max_bytes 초과 시 절단을 알려줌</text>
  <text x="430" y="368" font-size="14" font-weight="600" fill="#222">Claude Code 2.1.318 — deniedMcpServers URL 차단</text>
  <text x="430" y="390" font-size="12.5" fill="#444">이름뿐 아니라 업스트림 URL로도 MCP 서버 거부</text>

  <text x="400" y="470" text-anchor="middle" font-size="11.5" fill="#888">모든 수치·내용은 HF 모델 카드, arXiv API, GitHub 저장소 클론으로 검증 (자체 보고 벤치마크는 본문에 표기)</text>
</svg>
