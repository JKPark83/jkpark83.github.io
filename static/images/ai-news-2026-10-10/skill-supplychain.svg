<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="420" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">SKILL.md 공급망 — 복사 네트워크와 감사 효율 (arXiv 2610.11169)</text>

  <!-- 좌: 복사 네트워크 -->
  <text x="200" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#333">복사 네트워크 (219만 건 채택)</text>

  <!-- 소스 허브 -->
  <circle cx="130" cy="150" r="26" fill="#2a78d6"/>
  <text x="130" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">소스</text>
  <!-- 복사본들 -->
  <line x1="152" y1="163" x2="238" y2="116" stroke="#9db8d8" stroke-width="1.5"/>
  <line x1="156" y1="153" x2="244" y2="160" stroke="#9db8d8" stroke-width="1.5"/>
  <line x1="150" y1="168" x2="236" y2="208" stroke="#9db8d8" stroke-width="1.5"/>
  <line x1="140" y1="174" x2="180" y2="250" stroke="#9db8d8" stroke-width="1.5"/>
  <circle cx="250" cy="112" r="11" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/>
  <circle cx="256" cy="161" r="11" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/>
  <circle cx="247" cy="212" r="11" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/>
  <circle cx="185" cy="260" r="11" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/>
  <line x1="261" y1="117" x2="316" y2="136" stroke="#c5d4e8" stroke-width="1.2"/>
  <line x1="267" y1="164" x2="318" y2="180" stroke="#c5d4e8" stroke-width="1.2"/>
  <circle cx="326" cy="140" r="8" fill="#fff" stroke="#9db8d8" stroke-width="1.2"/>
  <circle cx="328" cy="183" r="8" fill="#fff" stroke="#9db8d8" stroke-width="1.2"/>

  <text x="60" y="310" font-size="12" fill="#333">· 소수 저장소가 거의 모든 복사의 출발점</text>
  <text x="60" y="330" font-size="12" fill="#333">· 복사본은 소스와 함께 바뀌지 않음</text>
  <text x="60" y="350" font-size="12" fill="#b5431a" font-weight="700">· 소스에 보안 픽스가 나와도 복사본에 거의 전파 안 됨</text>
  <text x="60" y="370" font-size="12" fill="#333">· 레지스트리·버전·출처 없음 = 공급망 사각지대</text>

  <!-- 우: 감사 효율 바 -->
  <text x="590" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#333">상위 100개 저장소 감사 시 차단되는</text>
  <text x="590" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#333">이후 고위험 스킬 채택 비율</text>

  <!-- 축 -->
  <line x1="470" y1="120" x2="470" y2="300" stroke="#ccc" stroke-width="1"/>
  <line x1="470" y1="300" x2="760" y2="300" stroke="#ccc" stroke-width="1"/>

  <!-- 복사 모델 랭킹: 14.9% -->
  <rect x="470" y="140" width="268" height="44" rx="4" fill="#2a78d6"/>
  <text x="482" y="168" font-size="13" font-weight="700" fill="#fff">복사 모델 랭킹 상위 100</text>
  <text x="726" y="168" text-anchor="end" font-size="15" font-weight="700" fill="#fff">14.9%</text>

  <!-- 스타 랭킹: 0.5% -->
  <rect x="470" y="220" width="9" height="44" rx="3" fill="#8a8a8a"/>
  <text x="490" y="248" font-size="13" font-weight="700" fill="#555">GitHub 스타 상위 100</text>
  <text x="590" y="248" font-size="15" font-weight="700" fill="#555">0.5%</text>

  <text x="470" y="330" font-size="12" fill="#666">같은 100개를 검토해도 '누가 복사의 원천인가'로 고르면</text>
  <text x="470" y="350" font-size="12" fill="#666">효과가 약 30배. 스타 수는 원천을 식별하지 못함.</text>
  <text x="470" y="378" font-size="11.5" fill="#999">값: 논문 보고 수치 (arXiv API로 초록 확인)</text>
</svg>
