<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif">
  <rect width="800" height="330" rx="12" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">SWE-2 벤치마크 점수 (Cognition 자체 발표)</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#64748b">단위: %, 100점 만점 · 독립 재현 전 수치임에 유의</text>

  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="220" y1="80" x2="220" y2="270"/>
    <line x1="355" y1="80" x2="355" y2="270"/>
    <line x1="490" y1="80" x2="490" y2="270"/>
    <line x1="625" y1="80" x2="625" y2="270"/>
    <line x1="760" y1="80" x2="760" y2="270"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="220" y="292">0</text>
    <text x="355" y="292">25</text>
    <text x="490" y="292">50</text>
    <text x="625" y="292">75</text>
    <text x="760" y="292">100</text>
  </g>

  <!-- bars: x=220 origin, 5.4px per point -->
  <g font-size="13" fill="#0f172a">
    <text x="210" y="105" text-anchor="end">FrontierCode 1.1 Main</text>
    <rect x="220" y="90" width="270" height="24" rx="4" fill="#3b82f6"/>
    <text x="498" y="107" font-weight="bold">50.0</text>

    <text x="210" y="155" text-anchor="end">DeepSWE 1.1</text>
    <rect x="220" y="140" width="394" height="24" rx="4" fill="#3b82f6"/>
    <text x="622" y="157" font-weight="bold">73.0</text>

    <text x="210" y="205" text-anchor="end">Terminal-Bench 2.1</text>
    <rect x="220" y="190" width="501" height="24" rx="4" fill="#2563eb"/>
    <text x="729" y="207" font-weight="bold">92.8</text>

    <text x="210" y="255" text-anchor="end">Terminal-Bench 4</text>
    <rect x="220" y="240" width="147" height="24" rx="4" fill="#93c5fd"/>
    <text x="375" y="257" font-weight="bold">27.3</text>
  </g>

  <text x="400" y="318" text-anchor="middle" font-size="11.5" fill="#64748b">비용 주장: FrontierCode 1.1 Main 비교 지점에서 Fable 5.1 대비 64% 저렴 (Cognition 블로그)</text>
</svg>
