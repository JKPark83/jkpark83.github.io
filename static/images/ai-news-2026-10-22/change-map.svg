<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">오늘의 AI 변화 지도 — 2026-10-22</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#6b7280">키워드: 경험은 쌓되, 추상화는 버려라 — 기억·인터페이스의 재설계</text>

  <!-- 모델 -->
  <rect x="30" y="80" width="360" height="180" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="50" y="108" font-size="15" font-weight="700" fill="#1d4ed8">모델 / 릴리즈</text>
  <text x="50" y="134" font-size="13" fill="#111827">MiniMax M3.1-Flash (10/19 발표)</text>
  <text x="50" y="156" font-size="12" fill="#374151">· API 선공개 — $0.15 / $0.60 per 1M tok</text>
  <text x="50" y="176" font-size="12" fill="#374151">· 캐시 읽기 $0.015 / 1M tok</text>
  <text x="50" y="196" font-size="12" fill="#374151">· 오픈 웨이트 10/23 공개 예고</text>
  <text x="50" y="222" font-size="11" fill="#6b7280">벤더 주장: M3 대비 비용 1/3 · 약 3배 빠름</text>
  <text x="50" y="240" font-size="11" fill="#6b7280">(가격·일정은 2차 소스 기준, HF 웨이트 아직 없음 확인)</text>

  <!-- 논문 -->
  <rect x="410" y="80" width="360" height="180" rx="10" fill="#fdf4ff" stroke="#a855f7"/>
  <text x="430" y="108" font-size="15" font-weight="700" fill="#7e22ce">논문</text>
  <text x="430" y="134" font-size="13" fill="#111827">More Memory, Worse Agents (2610.27406)</text>
  <text x="430" y="154" font-size="12" fill="#374151">· 저장된 "교훈"이 오류를 재생산 → 즉석 합성·폐기</text>
  <text x="430" y="182" font-size="13" fill="#111827">Evolving Agent Interfaces / Agent S4 (2610.28601)</text>
  <text x="430" y="202" font-size="12" fill="#374151">· 메타 에이전트가 인터페이스를 진화시킴</text>
  <text x="430" y="222" font-size="12" fill="#374151">· OSWorld V2 오픈소스 SOTA 21.3%</text>
  <text x="430" y="240" font-size="11" fill="#6b7280">공통점: 손으로 짜던 걸 에이전트 경험으로 대체</text>

  <!-- 오픈소스 -->
  <rect x="30" y="280" width="360" height="170" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="50" y="308" font-size="15" font-weight="700" fill="#15803d">오픈소스</text>
  <text x="50" y="334" font-size="13" fill="#111827">stablyai/orca (TypeScript, MIT)</text>
  <text x="50" y="354" font-size="12" fill="#374151">· Codex·Claude Code 병렬 worktree 오케스트레이터</text>
  <text x="50" y="382" font-size="13" fill="#111827">affaan-m/ECC (Shell·TS, MIT)</text>
  <text x="50" y="402" font-size="12" fill="#374151">· 7개 하네스용 커맨드·훅·MCP 설정 레이어</text>
  <text x="50" y="428" font-size="11" fill="#6b7280">둘 다 10/21 커밋 확인 · 스타 수는 API 제약으로 미확인</text>

  <!-- 바이브코딩 -->
  <rect x="410" y="280" width="360" height="170" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="430" y="308" font-size="15" font-weight="700" fill="#c2410c">바이브코딩</text>
  <text x="430" y="334" font-size="13" fill="#111827">Codex: 에이전트 메시지 보드 조립 중</text>
  <text x="430" y="354" font-size="12" fill="#374151">· 채널·스레드·구독 — 9종 툴, SQLite 로컬 보드</text>
  <text x="430" y="382" font-size="13" fill="#111827">Claude Code: /auto-mode-setup</text>
  <text x="430" y="402" font-size="12" fill="#374151">· 프로젝트·세션을 읽어 auto 모드를 학습시키는 설정</text>
  <text x="430" y="428" font-size="11" fill="#6b7280">멀티 에이전트 통신이 "메일"에서 "게시판"으로</text>

  <text x="400" y="482" text-anchor="middle" font-size="11" fill="#9ca3af">jkpark83.github.io · AI 데일리 브리핑</text>
</svg>
