<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="430" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">핸드오프에서 "반드시"가 "아마도"로 약해지는 과정</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- flow -->
  <rect x="40" y="65" width="200" height="72" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" fill="#f87171" font-size="13.5" font-weight="bold">업스트림: 차단 조건</text>
  <text x="140" y="110" text-anchor="middle" fill="#e2e8f0" font-size="12">"승인 전 배포 금지" (MUST)</text>
  <text x="140" y="127" text-anchor="middle" fill="#94a3b8" font-size="11.5">실행을 구속하는 상태</text>

  <rect x="300" y="65" width="200" height="72" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" fill="#fbbf24" font-size="13.5" font-weight="bold">핸드오프 변환</text>
  <text x="400" y="110" text-anchor="middle" fill="#e2e8f0" font-size="12">요약 · 계획 동화 · 합의</text>
  <text x="400" y="127" text-anchor="middle" fill="#e2e8f0" font-size="12">소유권 이관 · 선례 대체</text>

  <rect x="560" y="65" width="200" height="72" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="660" y="90" text-anchor="middle" fill="#f87171" font-size="13.5" font-weight="bold">다운스트림 아티팩트</text>
  <text x="660" y="110" text-anchor="middle" fill="#e2e8f0" font-size="12">"승인 이슈 있음" (참고)</text>
  <text x="660" y="127" text-anchor="middle" fill="#94a3b8" font-size="11.5">내용은 남고 구속력만 소실</text>

  <line x1="240" y1="101" x2="294" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="500" y1="101" x2="554" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- results: two cards -->
  <text x="60" y="185" fill="#f8fafc" font-size="14" font-weight="bold">통제 실험 1,296 에피소드 결과 (arXiv:2608.24569)</text>

  <rect x="45" y="205" width="345" height="150" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text x="65" y="233" fill="#f87171" font-size="13.5" font-weight="bold">일반적인 압축 핸드오프</text>
  <text x="65" y="262" fill="#e2e8f0" font-size="12.5">차단 조건 비활성화</text>
  <rect x="65" y="272" width="300" height="16" rx="4" fill="#f87171"/>
  <text x="215" y="285" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">100.0%</text>
  <text x="65" y="316" fill="#e2e8f0" font-size="12.5">금지된 행동 실행</text>
  <rect x="65" y="326" width="163" height="16" rx="4" fill="#fb923c"/>
  <text x="238" y="339" fill="#fb923c" font-size="12" font-weight="bold">54.2%</text>

  <rect x="410" y="205" width="345" height="150" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="233" fill="#34d399" font-size="13.5" font-weight="bold">상태 4필드 복원 시</text>
  <text x="430" y="262" fill="#e2e8f0" font-size="12.5">차단 조건 보존</text>
  <rect x="430" y="272" width="300" height="16" rx="4" fill="#34d399"/>
  <text x="580" y="285" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">100.0%</text>
  <text x="430" y="316" fill="#e2e8f0" font-size="12.5">금지된 행동 실행</text>
  <rect x="430" y="326" width="6" height="16" rx="2" fill="#34d399"/>
  <text x="446" y="339" fill="#34d399" font-size="12" font-weight="bold">0.0%</text>

  <text x="60" y="390" fill="#94a3b8" font-size="12.5">4필드 = 전제조건(prerequisite) · 권한(authority) · 폴백(fallback) · 실행 결과(consequence)</text>
  <text x="60" y="410" fill="#94a3b8" font-size="12.5">"내용이 전달됐다"와 "구속력이 유지됐다"는 별개다 — 핸드오프 스키마로 강제할 것.</text>
</svg>
