<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="820" height="420" fill="#0f172a"/>
  <text x="410" y="32" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">커밋 전 리뷰 — Codex vs Claude Code</text>
  <text x="410" y="55" fill="#94a3b8" font-size="12.5" text-anchor="middle">둘 다 "리뷰"를 파이프라인 단계로 만든다 — 워킹트리는 건드리지 않음</text>

  <!-- Codex card -->
  <rect x="30" y="80" width="365" height="300" rx="12" fill="#0d1f17" stroke="#34d399" stroke-width="1.8"/>
  <rect x="30" y="80" width="365" height="40" rx="12" fill="#065f46"/>
  <text x="52" y="106" fill="#d1fae5" font-size="15" font-weight="700">🟩 Codex — /review</text>

  <text x="52" y="150" fill="#6ee7b7" font-size="12.5" font-weight="700">두 가지 모드</text>
  <text x="52" y="174" fill="#e2e8f0" font-size="12">· uncommitted: staged+unstaged+untracked</text>
  <text x="52" y="196" fill="#e2e8f0" font-size="12">· base branch: merge-base 대비 diff</text>

  <rect x="52" y="214" width="321" height="96" rx="8" fill="#02120b"/>
  <text x="66" y="238" fill="#6ee7b7" font-size="11.5" font-family="monospace">$ codex review --uncommitted</text>
  <text x="66" y="262" fill="#6ee7b7" font-size="11.5" font-family="monospace">$ codex review --base main</text>
  <text x="66" y="290" fill="#94a3b8" font-size="11" font-family="monospace"># 우선순위별 findings, 트리 변경 X</text>

  <text x="52" y="336" fill="#e2e8f0" font-size="11.5">🎯 PR 열기 전 셀프 리뷰 게이트</text>
  <text x="52" y="358" fill="#94a3b8" font-size="11">⚠ git repo 필요 · 리뷰어는 승인 필요한 액션만 평가</text>

  <!-- Claude Code card -->
  <rect x="425" y="80" width="365" height="300" rx="12" fill="#0d1526" stroke="#60a5fa" stroke-width="1.8"/>
  <rect x="425" y="80" width="365" height="40" rx="12" fill="#1e3a8a"/>
  <text x="447" y="106" fill="#dbeafe" font-size="15" font-weight="700">🟦 Claude Code — /code-review</text>

  <text x="447" y="150" fill="#93c5fd" font-size="12.5" font-weight="700">백그라운드 subagent로 실행</text>
  <text x="447" y="174" fill="#e2e8f0" font-size="12">· 리뷰가 대화 컨텍스트를 안 채움</text>
  <text x="447" y="196" fill="#e2e8f0" font-size="12">· subagent는 기본 백그라운드 (Week 27)</text>

  <rect x="447" y="214" width="321" height="96" rx="8" fill="#020818"/>
  <text x="461" y="238" fill="#93c5fd" font-size="11.5" font-family="monospace">&gt; /code-review</text>
  <text x="461" y="262" fill="#93c5fd" font-size="11.5" font-family="monospace">&gt; /fork   # 대화 복제 후 계속 작업</text>
  <text x="461" y="290" fill="#94a3b8" font-size="11" font-family="monospace"># 정확성 버그를 별도 세션에서</text>

  <text x="447" y="336" fill="#e2e8f0" font-size="11.5">🎯 긴 작업 중 리뷰를 병렬로 돌리기</text>
  <text x="447" y="358" fill="#94a3b8" font-size="11">⚠ subagent 체인은 최대 5단계까지 (Week 24)</text>

  <text x="410" y="404" fill="#64748b" font-size="11" text-anchor="middle">출처: developers.openai.com/codex/app/review · code.claude.com whats-new · generated SVG</text>
</svg>
