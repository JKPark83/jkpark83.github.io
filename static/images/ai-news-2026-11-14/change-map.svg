  <text x="40" y="356" fill="#e2e8f0" font-size="13" font-weight="600">MACaQ — 화웨이의 모델 불문 양자화</text>
  <text x="40" y="376" fill="#94a3b8" font-size="12">122B를 64분·32.5GB로 GGUF 양자화</text>
  <text x="40" y="402" fill="#e2e8f0" font-size="13" font-weight="600">kubai-icons — 아이콘 그려주는 에이전트 스킬</text>
  <text x="40" y="422" fill="#94a3b8" font-size="12">+ MIT 아이콘 2,800종 (React/Vue/웹)</text>

