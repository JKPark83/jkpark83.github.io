<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="샌드박스 경계 안의 에이전트는 placeholder 열쇠만 들고 있고, 경계 밖 supervisor가 진짜 열쇠를 승인된 목적지로 가는 요청에만 꽂아 주는 모습을 단순화한 그림">
  <defs>
    <linearGradient id="oshg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#14312a"/>
    </linearGradient>
    <linearGradient id="osh-green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="osh-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#oshg)"/>

  <text x="80" y="96" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="46" font-weight="800">일은 시키고, 열쇠는 주지 마라</text>
  <text x="80" y="152" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800">에이전트 런타임 OpenShell 해부</text>
  <text x="80" y="200" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22">NVIDIA가 공개한 에이전트 플릿용 샌드박스 런타임 — 경계·정책·credential placeholder·policy prover</text>

  <!-- sandbox boundary -->
  <rect x="80" y="260" width="480" height="280" rx="18" fill="#f87171" opacity="0.08" stroke="#f87171" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="320" y="300" text-anchor="middle" fill="#f87171" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">신뢰 경계 안 (비신뢰)</text>

  <rect x="130" y="330" width="380" height="110" rx="14" fill="url(#osh-violet)" opacity="0.85"/>
  <text x="320" y="378" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="800">에이전트</text>
  <text x="320" y="412" text-anchor="middle" fill="#1e1b4b" font-family="ui-monospace,monospace" font-size="18">API_KEY=openshell:resolve:env:…</text>

  <text x="320" y="488" text-anchor="middle" fill="#fca5a5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18">들고 있는 건 placeholder뿐 — 진짜 키는 경계 밖에</text>

  <!-- channel -->
  <path d="M 560 400 L 680 400" stroke="#38bdf8" stroke-width="5" fill="none"/>
  <text x="620" y="384" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">유일한 egress</text>

  <!-- supervisor -->
  <rect x="682" y="310" width="300" height="180" rx="16" fill="url(#osh-green)" opacity="0.88"/>
  <text x="832" y="358" text-anchor="middle" fill="#052e16" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="800">supervisor</text>
  <text x="832" y="392" text-anchor="middle" fill="#064e3b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18">정책 검사 · deny-by-default</text>
  <text x="832" y="420" text-anchor="middle" fill="#064e3b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18">승인된 목적지에만</text>
  <text x="832" y="448" text-anchor="middle" fill="#064e3b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18">진짜 키 주입 🔑</text>

  <path d="M 982 400 L 1080 400" stroke="#4ade80" stroke-width="5" fill="none"/>
  <text x="1086" y="372" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">승인된</text>
  <text x="1086" y="396" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">API</text>
  <circle cx="1086" cy="430" r="22" fill="none" stroke="#4ade80" stroke-width="4"/>
  <path d="M 1076 430 L 1083 438 L 1098 420" stroke="#4ade80" stroke-width="4" fill="none"/>

  <text x="80" y="592" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19">NVIDIA OpenShell · Apache 2.0 · GTC Berlin 2026 — jkpark83.github.io</text>
</svg>
