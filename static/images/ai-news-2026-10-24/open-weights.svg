<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="520" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">오픈웨이트 2연타 — 스펙과 벤치마크</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6b7280">수치는 각 모델 카드의 제조사 발표치. 벤치마크 버전이 달라 두 모델을 직접 비교할 수 없음</text>

  <!-- MiniMax panel -->
  <rect x="30" y="76" width="460" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="104" font-size="15" font-weight="700" fill="#0f172a">MiniMax M3.1-Flash</text>
  <text x="50" y="124" font-size="11.5" fill="#475569">428B MoE(활성 23B) · 1M ctx · 텍스트+이미지+비디오 입력 · minimax-community 라이선스</text>

  <!-- Automation-Bench group -->
  <text x="50" y="152" font-size="12.5" font-weight="600" fill="#334155">Automation-Bench v1.0.6 (높을수록 좋음)</text>
  <!-- scale: 1.0 = 4.4px per point, bars start x=165 -->
  <text x="160" y="172" font-size="11" fill="#0f172a" text-anchor="end">M3.1-Flash</text>
  <rect x="165" y="162" width="276" height="13" rx="3" fill="#e11d48"/>
  <text x="447" y="173" font-size="11" font-weight="600" fill="#0f172a">62.8</text>
  <text x="160" y="192" font-size="11" fill="#475569" text-anchor="end">DS V4.1-Flash-1017</text>
  <rect x="165" y="182" width="266" height="13" rx="3" fill="#94a3b8"/>
  <text x="437" y="193" font-size="11" fill="#334155">60.5</text>
  <text x="160" y="212" font-size="11" fill="#475569" text-anchor="end">Opus 5</text>
  <rect x="165" y="202" width="221" height="13" rx="3" fill="#94a3b8"/>
  <text x="392" y="213" font-size="11" fill="#334155">50.3</text>
  <text x="160" y="232" font-size="11" fill="#475569" text-anchor="end">GPT-5.6 Sol</text>
  <rect x="165" y="222" width="201" height="13" rx="3" fill="#94a3b8"/>
  <text x="372" y="233" font-size="11" fill="#334155">45.8</text>

  <!-- OSWorld group -->
  <text x="50" y="264" font-size="12.5" font-weight="600" fill="#334155">OSWorld 2.0 (컴퓨터 사용)</text>
  <text x="160" y="284" font-size="11" fill="#475569" text-anchor="end">Opus 5</text>
  <rect x="165" y="274" width="310" height="13" rx="3" fill="#94a3b8"/>
  <text x="440" y="285" font-size="11" fill="#334155">70.6</text>
  <text x="160" y="304" font-size="11" fill="#475569" text-anchor="end">GPT-5.6 Sol</text>
  <rect x="165" y="294" width="289" height="13" rx="3" fill="#94a3b8"/>
  <text x="419" y="305" font-size="11" fill="#334155">65.7</text>
  <text x="160" y="324" font-size="11" fill="#0f172a" text-anchor="end">M3.1-Flash</text>
  <rect x="165" y="314" width="271" height="13" rx="3" fill="#e11d48"/>
  <text x="441" y="325" font-size="11" font-weight="600" fill="#0f172a">61.7</text>

  <!-- Terminal bench group -->
  <text x="50" y="356" font-size="12.5" font-weight="600" fill="#334155">Terminal Bench 4.0</text>
  <text x="160" y="376" font-size="11" fill="#475569" text-anchor="end">Opus 5</text>
  <rect x="165" y="366" width="228" height="13" rx="3" fill="#94a3b8"/>
  <text x="398" y="377" font-size="11" fill="#334155">51.8</text>
  <text x="160" y="396" font-size="11" fill="#0f172a" text-anchor="end">M3.1-Flash</text>
  <rect x="165" y="386" width="168" height="13" rx="3" fill="#e11d48"/>
  <text x="338" y="397" font-size="11" font-weight="600" fill="#0f172a">38.1</text>

  <text x="50" y="432" font-size="11" fill="#64748b">강점: 자동화·GUI 등 에이전트 태스크. 약점: 터미널·리포 수준</text>
  <text x="50" y="450" font-size="11" fill="#64748b">코딩(NL2Repo 61.2 vs Opus 5 75.3)은 프런티어와 격차 존재.</text>
  <text x="50" y="474" font-size="10.5" fill="#94a3b8">측정 하네스: OpenCode·Codex·Claude Code·mini-SWE-agent (카드 각주)</text>

  <!-- Flint panel -->
  <rect x="510" y="76" width="260" height="414" rx="10" fill="#fefce8" stroke="#eab308"/>
  <text x="530" y="104" font-size="15" font-weight="700" fill="#713f12">Recursive Flint</text>
  <text x="530" y="124" font-size="11.5" fill="#854d0e">40B-A2.5B MoE · 262K ctx · Apache 2.0</text>

  <text x="530" y="156" font-size="12" font-weight="600" fill="#713f12">자체 측정 결과 (pass@1 평균)</text>
  <text x="530" y="180" font-size="12" fill="#422006">SWE-bench Pro v2</text>
  <text x="750" y="180" font-size="13" font-weight="700" fill="#713f12" text-anchor="end">89.7%</text>
  <text x="530" y="204" font-size="12" fill="#422006">SWE-bench Verified</text>
  <text x="750" y="204" font-size="13" font-weight="700" fill="#713f12" text-anchor="end">74.2%</text>
  <text x="530" y="228" font-size="12" fill="#422006">Terminal-Bench 2.1</text>
  <text x="750" y="228" font-size="13" font-weight="700" fill="#713f12" text-anchor="end">54.9%</text>

  <line x1="530" y1="248" x2="750" y2="248" stroke="#eab308" stroke-width="0.6"/>
  <text x="530" y="274" font-size="12" font-weight="600" fill="#713f12">실행 환경</text>
  <text x="530" y="296" font-size="11.5" fill="#422006">· 서버: H200/B300 1장 + SGLang 킷</text>
  <text x="530" y="316" font-size="11.5" fill="#422006">· 로컬: rec 엔진, M4 Pro 이상</text>
  <text x="530" y="334" font-size="11.5" fill="#422006">  통합메모리 48GB · 디스크 30GB</text>
  <text x="530" y="354" font-size="11.5" fill="#422006">· 4비트 가중치로 252K 프롬프트까지</text>

  <line x1="530" y1="374" x2="750" y2="374" stroke="#eab308" stroke-width="0.6"/>
  <text x="530" y="398" font-size="12" font-weight="600" fill="#713f12">왜 눈여겨볼까</text>
  <text x="530" y="420" font-size="11.5" fill="#422006">활성 2.5B로 에이전틱 코딩 특화.</text>
  <text x="530" y="438" font-size="11.5" fill="#422006">서브에이전트·로컬 리뷰어처럼</text>
  <text x="530" y="456" font-size="11.5" fill="#422006">"작고 많은 호출" 자리를 노린다.</text>
  <text x="530" y="478" font-size="10.5" fill="#a16207">지식 컷오프 2026-06 · 텍스트 입출력 전용</text>
</svg>
