<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">트렌딩 3종 — 에이전트 루프의 빈칸을 하나씩</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#8a90a3">찾기 → 지켜보기 → 웹에서 실행하기</text>

  <!-- card 1: jevgrep -->
  <rect x="30" y="78" width="236" height="220" rx="14" fill="#f0fbf4" stroke="#3fa96b" stroke-width="2"/>
  <text x="48" y="108" font-size="14" font-weight="700" fill="#27804d">🔎 jevgrep v0.2.0</text>
  <text x="48" y="130" font-size="12" fill="#1a1a2e">시맨틱 코드 검색 CLI + MCP</text>
  <text x="48" y="150" font-size="12" fill="#1a1a2e">"세션 만료 어디서 처리해?"로</text>
  <text x="48" y="168" font-size="12" fill="#1a1a2e">질문 → 원본 발췌+라인 번호 반환</text>
  <text x="48" y="194" font-size="11" fill="#555f77">TypeScript · MIT · Node 24+</text>
  <text x="48" y="212" font-size="11" fill="#555f77">npm @nassim-arifette/jevgrep</text>
  <rect x="48" y="228" width="200" height="26" rx="6" fill="#e3f3e9"/>
  <text x="58" y="245" font-size="11" fill="#1a1a2e">탐색 컨텍스트 소모를 줄인다</text>
  <text x="48" y="282" font-size="11" fill="#8a90a3">rg 보완재 — 심볼을 알면 rg가 빠름</text>

  <!-- card 2: coucou -->
  <rect x="282" y="78" width="236" height="220" rx="14" fill="#eef3fc" stroke="#4a7fd4" stroke-width="2"/>
  <text x="300" y="108" font-size="14" font-weight="700" fill="#2d5bb0">👀 coucou 0.1.2</text>
  <text x="300" y="130" font-size="12" fill="#1a1a2e">노치/화면 상단 상주 위젯</text>
  <text x="300" y="150" font-size="12" fill="#1a1a2e">Claude Code·Codex·Cursor 등</text>
  <text x="300" y="168" font-size="12" fill="#1a1a2e">세션 상태 실시간 표시</text>
  <text x="300" y="194" font-size="11" fill="#555f77">macOS/Windows/Linux · MIT</text>
  <text x="300" y="212" font-size="11" fill="#555f77">커밋 10/2 활발 (클론 확인)</text>
  <rect x="300" y="228" width="200" height="26" rx="6" fill="#dfeafc"/>
  <text x="310" y="245" font-size="11" fill="#1a1a2e">권한 요청을 노치에서 원클릭 승인</text>
  <text x="300" y="282" font-size="11" fill="#8a90a3">여러 에이전트 병렬 돌릴 때 유용</text>

  <!-- card 3: dots -->
  <rect x="534" y="78" width="236" height="220" rx="14" fill="#f5f0fb" stroke="#8a5fd4" stroke-width="2"/>
  <text x="552" y="108" font-size="14" font-weight="700" fill="#6a3fb0">🌐 dots</text>
  <text x="552" y="130" font-size="12" fill="#1a1a2e">브라우저 내장 웹 에이전트</text>
  <text x="552" y="150" font-size="12" fill="#1a1a2e">C++로 패치한 Firefox 엔진이</text>
  <text x="552" y="168" font-size="12" fill="#1a1a2e">엔진 수준에서 핑거프린트 결정</text>
  <text x="552" y="194" font-size="11" fill="#555f77">Python 3.11+ · MIT · uvx 실행</text>
  <text x="552" y="212" font-size="11" fill="#555f77">모델은 플래그 하나로 교체</text>
  <rect x="552" y="228" width="200" height="26" rx="6" fill="#ece3f8"/>
  <text x="562" y="245" font-size="11" fill="#1a1a2e">"차단당하는 웹 에이전트" 문제 공략</text>
  <text x="552" y="282" font-size="11" fill="#8a90a3">스크래핑 약관·사이트 정책 확인 필수</text>

  <text x="400" y="332" text-anchor="middle" font-size="11" fill="#8a90a3">세 저장소 모두 클론으로 실존·활동 확인. 스타 수는 이 세션의 API 제약으로 미검증이라 생략.</text>
</svg>
