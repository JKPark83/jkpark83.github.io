<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="긴 대화 기록을 압축하는 세 가지 표현을 비교한 그림. 텍스트 요약과 픽셀 렌더링 경로에는 우회로가 그려져 있고, 세 번째인 latent 경로는 연속 메모리 토큰이 frozen 디코더의 임베딩 인터페이스로 곧장 들어간다">
  <defs>
    <linearGradient id="lp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="lp-carw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="lp-carw2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#lp-bg)"/>

  <text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#e2e8f0">텍스트도 픽셀도 아닌 세 번째 표현</text>
  <text x="60" y="120" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" fill="#94a3b8">latent 컨텍스트 압축 — 연속 메모리 토큰과 LatentPress</text>

  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <!-- 왼쪽: 긴 컨텍스트 -->
    <rect x="70" y="230" width="250" height="250" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="195" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#38bdf8">긴 컨텍스트</text>
    <g fill="#475569">
      <rect x="95" y="258" width="200" height="10" rx="5"/>
      <rect x="95" y="280" width="170" height="10" rx="5"/>
      <rect x="95" y="302" width="190" height="10" rx="5"/>
      <rect x="95" y="324" width="150" height="10" rx="5"/>
      <rect x="95" y="346" width="200" height="10" rx="5"/>
      <rect x="95" y="368" width="180" height="10" rx="5"/>
      <rect x="95" y="390" width="160" height="10" rx="5"/>
      <rect x="95" y="412" width="195" height="10" rx="5"/>
      <rect x="95" y="434" width="140" height="10" rx="5"/>
    </g>
    <text x="195" y="508" text-anchor="middle" font-size="14" fill="#64748b">대화 기록 · 문서 (수만 토큰)</text>

    <!-- 가운데: 세 경로 -->
    <!-- A 텍스트 (우회) -->
    <path d="M320 280 C 420 220, 520 220, 620 268" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#lp-carw2)"/>
    <text x="470" y="212" text-anchor="middle" font-size="16" fill="#fbbf24" font-weight="700">A. 텍스트 요약</text>
    <text x="470" y="234" text-anchor="middle" font-size="13" fill="#64748b">사람이 읽게 다시 쓰기 — 세부 손실</text>

    <!-- B 픽셀 (우회) -->
    <path d="M320 430 C 420 490, 520 490, 620 442" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#lp-carw2)"/>
    <text x="470" y="522" text-anchor="middle" font-size="16" fill="#38bdf8" font-weight="700">B. 픽셀 렌더링 (OCR)</text>
    <text x="470" y="544" text-anchor="middle" font-size="13" fill="#64748b">그렸다가 다시 판독 — "나쁜 오토인코딩"?</text>

    <!-- C latent (직행) -->
    <line x1="320" y1="355" x2="452" y2="355" stroke="#a78bfa" stroke-width="4" marker-end="url(#lp-carw)"/>
    <text x="500" y="316" text-anchor="middle" font-size="17" fill="#a78bfa" font-weight="800">C. latent</text>
    <g>
      <circle cx="478" cy="355" r="13" fill="#a78bfa"/>
      <circle cx="510" cy="355" r="13" fill="#a78bfa" opacity=".8"/>
      <circle cx="542" cy="355" r="13" fill="#a78bfa" opacity=".6"/>
      <circle cx="574" cy="355" r="13" fill="#a78bfa" opacity=".4"/>
    </g>
    <line x1="592" y1="355" x2="640" y2="355" stroke="#a78bfa" stroke-width="4" marker-end="url(#lp-carw)"/>
    <text x="527" y="398" text-anchor="middle" font-size="13.5" fill="#c4b5fd">연속 메모리 토큰 · 4~16×</text>
    <text x="527" y="420" text-anchor="middle" font-size="13" fill="#64748b">재구성 없이 임베딩으로 직행</text>

    <!-- 오른쪽: frozen reader -->
    <rect x="650" y="240" width="470" height="230" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="885" y="285" text-anchor="middle" font-size="24" font-weight="700" fill="#e2e8f0">frozen LLM (reader) ❄</text>
    <text x="885" y="320" text-anchor="middle" font-size="15" fill="#94a3b8">inputs_embeds = [ 메모리 ⧺ 질문 ]</text>
    <g font-family="ui-monospace,monospace">
      <rect x="690" y="345" width="390" height="88" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="710" y="380" font-size="15" fill="#67e8f9">LongMemEval 0.504 @ 7.7×</text>
      <text x="710" y="410" font-size="15" fill="#4ade80">읽기 5~9× 빠름 · 쓰기 ~43ms</text>
    </g>
    <text x="885" y="508" text-anchor="middle" font-size="14" fill="#64748b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">학습은 adapter(~0.1%)만 — 읽는 모델은 그대로</text>
  </g>

  <text x="60" y="590" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#64748b">arXiv:2609.01507 · LatentPress — AI 엔지니어링 딥다이브</text>
</svg>
