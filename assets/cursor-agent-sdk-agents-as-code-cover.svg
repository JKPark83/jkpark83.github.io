<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Markdown 프롬프트와 TypeScript 도구가 든 폴더 하나가 git 리뷰와 eval 테스트를 거쳐 배포된 에이전트가 되는 모습을 그린 커버 이미지">
  <defs>
    <linearGradient id="casg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#casg)"/>

  <text x="80" y="96" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="46" font-weight="800">에이전트를 코드처럼</text>
  <text x="80" y="154" fill="#a5b4fc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="800">리뷰하고, 테스트하고, 배포하라</text>
  <text x="80" y="200" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22">Cursor Agent SDK 해부 — 프롬프트는 Markdown, 도구는 TypeScript, 에이전트는 폴더 하나</text>

  <!-- left: the folder -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">
    <path d="M100 268 h86 l22 22 h152 a12 12 0 0 1 12 12 v224 a12 12 0 0 1 -12 12 H100 a12 12 0 0 1 -12 -12 V280 a12 12 0 0 1 12 -12 z" fill="none" stroke="#818cf8" stroke-width="3"/>
    <text x="112" y="330" fill="#c7d2fe" font-weight="700">my-bot/</text>
    <text x="126" y="364" fill="#e2e8f0">bot/</text>
    <text x="146" y="396" fill="#5eead4">instructions.md</text>
    <text x="146" y="428" fill="#fbbf24">tools/*.ts</text>
    <text x="146" y="460" fill="#94a3b8">channels/ skills/</text>
    <text x="126" y="494" fill="#f472b6">evals/*.eval.ts</text>
  </g>

  <!-- middle: pipeline arrows -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">
    <path d="M400 390 h92" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M492 390 l-14 -9 v18 z" fill="#64748b"/>
    <rect x="508" y="300" width="188" height="56" rx="12" fill="none" stroke="#5eead4" stroke-width="3"/>
    <text x="602" y="334" text-anchor="middle" fill="#5eead4">git 리뷰 · 버전</text>
    <rect x="508" y="376" width="188" height="56" rx="12" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="602" y="410" text-anchor="middle" fill="#fbbf24">agent-sdk eval</text>
    <rect x="508" y="452" width="188" height="56" rx="12" fill="none" stroke="#f472b6" stroke-width="3"/>
    <text x="602" y="486" text-anchor="middle" fill="#f472b6">agent-sdk deploy</text>
    <path d="M708 390 h92" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M800 390 l-14 -9 v18 z" fill="#64748b"/>
  </g>

  <!-- right: running agent -->
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <circle cx="975" cy="390" r="110" fill="none" stroke="#818cf8" stroke-width="3.5"/>
    <circle cx="938" cy="368" r="11" fill="#a5b4fc"/>
    <circle cx="1012" cy="368" r="11" fill="#a5b4fc"/>
    <path d="M930 428 q45 34 90 0" stroke="#a5b4fc" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="975" y="540" text-anchor="middle" fill="#cbd5e1" font-size="20" font-weight="700">PR 이벤트 · Slack · 스케줄에 반응</text>
  </g>

  <text x="80" y="588" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19">Bugbot · Security Review · Rollouts를 움직이던 엔진이 오픈소스로 — 2026.10 GA</text>
</svg>
