<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif">
  <rect width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">오늘의 AI 변화 지도 — 2026-07-30</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#64748b">축: 에이전트 "실행 계층"이 빨라지고, 검증 가능해진다</text>

  <!-- center -->
  <rect x="310" y="240" width="200" height="80" rx="14" fill="#0f172a"/>
  <text x="410" y="273" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">에이전트 실행 계층</text>
  <text x="410" y="296" text-anchor="middle" font-size="12" fill="#cbd5e1">빠르게 · 검증 가능하게</text>

  <!-- connectors -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M310 265 L190 150"/>
    <path d="M510 265 L630 150"/>
    <path d="M310 300 L190 420"/>
    <path d="M510 300 L630 420"/>
  </g>

  <!-- top-left: papers -->
  <rect x="40" y="90" width="290" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="116" font-size="14" font-weight="700" fill="#2563eb">📚 논문</text>
  <text x="58" y="140" font-size="12" fill="#0f172a">Speculate While You Reason (2607.25816)</text>
  <text x="58" y="159" font-size="11" fill="#64748b">툴콜을 스스로 예측·선실행해 대기시간 숨김</text>
  <text x="58" y="182" font-size="12" fill="#0f172a">Desktop-Delta Bench (2607.26041)</text>
  <text x="58" y="201" font-size="11" fill="#64748b">컴퓨터유즈의 "상태 전이 이해"를 측정</text>

  <!-- top-right: models -->
  <rect x="490" y="90" width="290" height="120" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="508" y="116" font-size="14" font-weight="700" fill="#0d9488">🤖 모델 &amp; 릴리즈</text>
  <text x="508" y="140" font-size="12" fill="#0f172a">프런티어 신규는 소강</text>
  <text x="508" y="159" font-size="11" fill="#64748b">Kimi K3 웨이트 7/27 실제 공개(예고분)</text>
  <text x="508" y="182" font-size="12" fill="#0f172a">움직임은 오픈 인프라 쪽</text>
  <text x="508" y="201" font-size="11" fill="#64748b">학습·실행 스택으로 무게중심 이동</text>

  <!-- bottom-left: open source -->
  <rect x="40" y="400" width="290" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="58" y="426" font-size="14" font-weight="700" fill="#7c3aed">🛠 오픈소스</text>
  <text x="58" y="450" font-size="12" fill="#0f172a">Molt (NVIDIA-NeMo/labs-molt)</text>
  <text x="58" y="469" font-size="11" fill="#64748b">PyTorch-native agentic RL 학습, 7/22</text>
  <text x="58" y="492" font-size="12" fill="#0f172a">ScaleCUA (OpenGVLab)</text>
  <text x="58" y="511" font-size="11" fill="#64748b">크로스플랫폼 컴퓨터유즈 에이전트</text>

  <!-- bottom-right: tips -->
  <rect x="490" y="400" width="290" height="120" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="508" y="426" font-size="14" font-weight="700" fill="#d97706">🧑‍💻 실전 팁</text>
  <text x="508" y="450" font-size="12" fill="#0f172a">🟩 Codex: config.toml에 MCP 서버 등록</text>
  <text x="508" y="472" font-size="12" fill="#0f172a">🟦 Claude Code: 서브에이전트로 병렬 위임</text>
  <text x="508" y="494" font-size="12" fill="#0f172a">🟪 공통: prefix 고정 + 프롬프트 캐싱</text>

  <text x="410" y="548" text-anchor="middle" font-size="11" fill="#94a3b8">자체 제작 SVG · 항목은 본문에서 출처 링크로 검증</text>
</svg>
