<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="코딩 에이전트가 파일을 고치는 Fast Apply 방식을 나타낸 그림. 왼쪽에는 크고 똑똑한 모델이 바뀐 부분만 적고 나머지는 '// ... existing code ...' 마커로 남긴 '게으른 편집'이 있다. 가운데의 작고 빠른 Apply 모델이 원본 파일과 이 게으른 편집을 받아 병합한다. 오른쪽에는 빈틈 없이 완성된 전체 파일이 나온다. 아래 띠에는 통째로 다시 쓰기는 100초·0.18달러인 반면 Apply 모델은 초당 4천~1만 토큰으로 병합한다고 적혀 있다.">
  <defs>
    <linearGradient id="fa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="fa-big" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="fa-apply" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="fa-done" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <marker id="fa-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1,1 L12,7 L1,13" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#fa-bg)"/>

  <text x="70" y="86" fill="#e2e8f0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="46" font-weight="800">Fast Apply — 코드 편집의 마지막 1cm</text>
  <text x="70" y="130" fill="#94a3b8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" font-weight="600">파일을 &#8220;통째로 다시 쓰지&#8221; 않고, 바뀐 조각만 &#8220;빠르게 갈아끼운다&#8221;</text>

  <!-- Left: lazy edit from big model -->
  <text x="70" y="196" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="22" font-weight="800">크고 똑똑한 모델 → 게으른 편집</text>
  <rect x="70" y="212" width="300" height="270" rx="14" fill="#1e1b3a" stroke="#7c3aed" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16.5" fill="#c4b5fd">
    <text x="90" y="246">// ... existing code ...</text>
    <text x="90" y="286" fill="#f8fafc">def total(items):</text>
    <text x="110" y="314" fill="#4ade80">+  if not items:</text>
    <text x="130" y="342" fill="#4ade80">+    return 0</text>
    <text x="110" y="370" fill="#f8fafc">  return sum(</text>
    <text x="130" y="398" fill="#f8fafc">    i.price for i in items)</text>
    <text x="90" y="438">// ... existing code ...</text>
    <text x="90" y="466" fill="#64748b" font-size="14">바뀐 부분만 · 나머지는 마커</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="384" y1="348" x2="452" y2="348" stroke="#fbbf24" stroke-width="3" marker-end="url(#fa-arrow)"/>

  <!-- Middle: Apply model -->
  <g>
    <rect x="470" y="262" width="230" height="172" rx="16" fill="url(#fa-apply)"/>
    <text x="585" y="312" fill="#082f49" font-family="system-ui,sans-serif" font-size="26" font-weight="800" text-anchor="middle">Apply 모델</text>
    <text x="585" y="344" fill="#082f49" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">작은 7B 전용 모델</text>
    <text x="585" y="372" fill="#082f49" font-family="ui-monospace,monospace" font-size="15" text-anchor="middle">원본 + 편집 → 병합</text>
    <text x="585" y="404" fill="#082f49" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">speculative decoding</text>
  </g>
  <text x="585" y="232" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="19" font-weight="700" text-anchor="middle">원본 파일도 함께 입력</text>

  <!-- Arrow 2 -->
  <line x1="712" y1="348" x2="780" y2="348" stroke="#fbbf24" stroke-width="3" marker-end="url(#fa-arrow)"/>

  <!-- Right: complete merged file -->
  <text x="800" y="196" fill="#4ade80" font-family="system-ui,sans-serif" font-size="22" font-weight="800">빈틈 없는 완성 파일</text>
  <rect x="800" y="212" width="330" height="270" rx="14" fill="#0f2a1a" stroke="#16a34a" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16.5" fill="#bbf7d0">
    <text x="820" y="246">import math</text>
    <text x="820" y="274">TAX = 0.1</text>
    <text x="820" y="310" fill="#f8fafc">def total(items):</text>
    <text x="840" y="338" fill="#4ade80">  if not items:</text>
    <text x="860" y="366" fill="#4ade80">    return 0</text>
    <text x="840" y="394" fill="#f8fafc">  return sum(</text>
    <text x="860" y="422" fill="#f8fafc">    i.price for i in items)</text>
    <text x="820" y="458" fill="#64748b" font-size="14">원본 100% 보존 + 새 코드</text>
  </g>

  <!-- Bottom banner -->
  <rect x="70" y="516" width="1060" height="74" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="96" y="546" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="18" font-weight="700">통째로 다시 쓰기: 1000줄에 100초 · $0.18</text>
  <text x="96" y="574" fill="#64748b" font-family="system-ui,sans-serif" font-size="15">큰 모델이 안 바뀐 코드까지 전부 다시 생성</text>
  <line x1="600" y1="528" x2="600" y2="578" stroke="#334155" stroke-width="1.5"/>
  <text x="626" y="546" fill="#86efac" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Apply 모델: 초당 4,300 ~ 10,500 토큰 병합</text>
  <text x="626" y="574" fill="#64748b" font-family="system-ui,sans-serif" font-size="15">정확도 96~98% · 출력이 입력과 거의 같아 초고속</text>
</svg>
