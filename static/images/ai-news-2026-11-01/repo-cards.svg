<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="420" fill="#fafafa"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">오늘의 오픈소스 — DevBox vs TokenBar</text>

  <!-- DevBox card -->
  <rect x="30" y="56" width="360" height="320" rx="14" fill="#eef4ff" stroke="#b9cdf2"/>
  <text x="50" y="90" font-size="16" font-weight="700" fill="#1f4e9c">rudderlabs/devbox</text>
  <text x="50" y="112" font-size="12" fill="#666">TypeScript · MIT · ~257★ (검색 API 기준)</text>
  <text x="50" y="142" font-size="13" font-weight="600" fill="#222">조직용 자율 엔지니어링 하네스</text>
  <text x="50" y="166" font-size="12.5" fill="#444">• 티켓 투입 → 계획 → 계획 리뷰 → 구현</text>
  <text x="50" y="186" font-size="12.5" fill="#444">   → 셀프 리뷰 → draft PR (단계별 게이트)</text>
  <text x="50" y="210" font-size="12.5" fill="#444">• 리뷰 코멘트·CI 실패가 작업으로 회귀</text>
  <text x="50" y="234" font-size="12.5" fill="#444">• 샌드박스엔 더미 토큰만, 프록시가 실토큰 주입</text>
  <text x="50" y="258" font-size="12.5" fill="#444">• 단계별 모델·effort 라우팅 (OpenAI/Anthropic)</text>
  <text x="50" y="282" font-size="12.5" fill="#444">• 학습 내용을 커밋으로 저장소에 축적</text>
  <text x="50" y="314" font-size="12.5" font-weight="600" fill="#1f4e9c">이럴 때: 팀 전체가 공유하는 "위임형"</text>
  <text x="50" y="332" font-size="12.5" font-weight="600" fill="#1f4e9c">에이전트를 자체 인프라에 두고 싶을 때</text>
  <text x="50" y="360" font-size="11.5" fill="#777">벤더 주장: 사내 PR의 ~35%를 머지 (merge rate ~80%)</text>

  <!-- TokenBar card -->
  <rect x="410" y="56" width="360" height="320" rx="14" fill="#f0fbf2" stroke="#b5dfc0"/>
  <text x="430" y="90" font-size="16" font-weight="700" fill="#1e7a35">lwh0630/TokenBar</text>
  <text x="430" y="112" font-size="12" fill="#666">Dart(Flutter) · MIT · ~181★ (검색 API 기준)</text>
  <text x="430" y="142" font-size="13" font-weight="600" fill="#222">AI 쿼터·잔액 통합 모니터</text>
  <text x="430" y="166" font-size="12.5" fill="#444">• Codex·Claude·Cursor·OpenRouter 등 50개</text>
  <text x="430" y="186" font-size="12.5" fill="#444">   서비스의 남은 쿼터·리셋 시각을 한 화면에</text>
  <text x="430" y="210" font-size="12.5" fill="#444">• Windows·macOS·Linux·Android·iOS</text>
  <text x="430" y="234" font-size="12.5" fill="#444">• 기기에서 각 공식 엔드포인트 직접 조회</text>
  <text x="430" y="258" font-size="12.5" fill="#444">   (중간 서버에 자격 증명 안 보냄)</text>
  <text x="430" y="282" font-size="12.5" fill="#444">• 데스크톱은 공식 CLI 로그인 재사용 (읽기 전용)</text>
  <text x="430" y="314" font-size="12.5" font-weight="600" fill="#1e7a35">이럴 때: 구독 여러 개 돌리며 "어느 쪽</text>
  <text x="430" y="332" font-size="12.5" font-weight="600" fill="#1e7a35">쿼터가 먼저 바닥나나" 추적하고 싶을 때</text>
  <text x="430" y="360" font-size="11.5" fill="#777">macOS용 CodexBar에서 영감, 멀티플랫폼 확장판</text>

  <text x="400" y="404" text-anchor="middle" font-size="11" fill="#888">두 저장소 모두 클론으로 실체·라이선스 확인 · 스타 수는 GitHub 검색 API 집계 기준</text>
</svg>
