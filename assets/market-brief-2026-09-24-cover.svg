<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="10년물 국채 금리가 5.11%로 19년 만의 최고치를 찍으면서 나스닥이 신고가를 하루 만에 반납하고 비트코인이 8만4,000달러대로 밀린 가운데, 트럼프-시진핑 회담과 금요일 166억달러 옵션 만기를 앞두고 나스닥과 암호화폐 모두 관망을 유지한다는 것을 나타낸 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.09.24 · 나스닥 &amp; 비트코인 5분 요약</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">금리가 19년 만의 5.1%를 찍자, 랠리가 멈췄습니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">금리 쇼크</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#f87171">5.11%</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">10년물 — 19년 만 최고</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#f87171">PMI 58.4</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">5년래 최고 성장 + 유가 +3.9%</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">시장 반응</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#f59e0b" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fbbf24">-1.13%</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fde68a">나스닥 — 신고가 반납</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#f59e0b" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fbbf24">8.4만$</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fde68a">BTC — 8만5,000 이탈</text>
  </g>

  <g transform="translate(80,540)">
    <rect x="0" y="0" width="250" height="52" rx="26" fill="#eab308" opacity="0.2"/>
    <text x="125" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#facc15">나스닥 관망</text>
    <rect x="270" y="0" width="250" height="52" rx="26" fill="#eab308" opacity="0.2"/>
    <text x="395" y="34" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#facc15">암호화폐 관망</text>
    <text x="560" y="34" font-family="sans-serif" font-size="18" fill="#94a3b8">오늘 밤 트럼프-시진핑 회담 · 금요일 166억$ 만기</text>
  </g>
</svg>
