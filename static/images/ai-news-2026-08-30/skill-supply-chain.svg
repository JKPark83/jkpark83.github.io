<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">스킬 공급망 보안 파이프라인 — Agent Builder 시사점</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">스킬을 만드는 쪽과 실행하는 쪽 사이에 두 개의 게이트를 놓는다</text>

  <!-- stage 1: creation -->
  <rect x="30" y="90" width="170" height="120" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="115" y="115" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">1. 스킬 생성</text>
  <text x="115" y="140" text-anchor="middle" fill="#e2e8f0" font-size="12">사람이 작성한 SKILL.md</text>
  <text x="115" y="160" text-anchor="middle" fill="#e2e8f0" font-size="12">+ 에이전트 자가 생성</text>
  <text x="115" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">예: hermes-agent</text>
  <text x="115" y="197" text-anchor="middle" fill="#94a3b8" font-size="11">skill_manage 학습 루프</text>

  <!-- arrow -->
  <line x1="200" y1="150" x2="230" y2="150" stroke="#64748b" stroke-width="3"/>
  <polygon points="230,144 242,150 230,156" fill="#64748b"/>

  <!-- stage 2: scan gate -->
  <rect x="245" y="90" width="180" height="120" rx="10" fill="#1e293b" stroke="#fbbf24"/>
  <text x="335" y="115" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">2. 설치 전 스캔 게이트</text>
  <text x="335" y="140" text-anchor="middle" fill="#e2e8f0" font-size="12">SkillSpector 정적 분석</text>
  <text x="335" y="160" text-anchor="middle" fill="#e2e8f0" font-size="12">71개 패턴 · 17개 범주</text>
  <text x="335" y="180" text-anchor="middle" fill="#94a3b8" font-size="11">AST 검사 · OSV.dev CVE 조회</text>
  <text x="335" y="197" text-anchor="middle" fill="#94a3b8" font-size="11">리스크 점수 0–100 · SARIF</text>

  <!-- arrow -->
  <line x1="425" y1="150" x2="455" y2="150" stroke="#64748b" stroke-width="3"/>
  <polygon points="455,144 467,150 455,156" fill="#64748b"/>

  <!-- stage 3: install -->
  <rect x="470" y="90" width="140" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="540" y="115" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">3. 설치</text>
  <text x="540" y="140" text-anchor="middle" fill="#e2e8f0" font-size="12">통과한 스킬만</text>
  <text x="540" y="160" text-anchor="middle" fill="#e2e8f0" font-size="12">에이전트에 등록</text>
  <text x="540" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Claude Code · Codex</text>

  <!-- arrow -->
  <line x1="610" y1="150" x2="640" y2="150" stroke="#64748b" stroke-width="3"/>
  <polygon points="640,144 652,150 640,156" fill="#64748b"/>

  <!-- stage 4: runtime -->
  <rect x="655" y="90" width="120" height="120" rx="10" fill="#1e293b" stroke="#f87171"/>
  <text x="715" y="115" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold">4. 런타임</text>
  <text x="715" y="140" text-anchor="middle" fill="#e2e8f0" font-size="12">SARA 패턴:</text>
  <text x="715" y="160" text-anchor="middle" fill="#e2e8f0" font-size="12">행동 유도와</text>
  <text x="715" y="178" text-anchor="middle" fill="#e2e8f0" font-size="12">실행 승인 분리</text>
  <text x="715" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">ASR ≤ 0.63%</text>

  <!-- why box -->
  <rect x="30" y="245" width="745" height="105" rx="10" fill="#1e293b" stroke="#7c3aed"/>
  <text x="400" y="272" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">왜 두 개의 게이트인가</text>
  <text x="400" y="297" text-anchor="middle" fill="#e2e8f0" font-size="12">SkillSpector README가 인용한 연구: 공개 스킬의 26.1%가 취약점 보유, 5.2%는 악성 의도 추정</text>
  <text x="400" y="317" text-anchor="middle" fill="#e2e8f0" font-size="12">스캔(2)은 설치 시점의 악성 스킬을 걸러내고, 권한 분리(4)는 스캔을 통과한 스킬이</text>
  <text x="400" y="335" text-anchor="middle" fill="#e2e8f0" font-size="12">런타임에 주입 공격 경로가 되어도 실행 권한으로 승격되지 못하게 막는다</text>

  <text x="400" y="378" text-anchor="middle" fill="#64748b" font-size="11">출처: NVIDIA/SkillSpector README, NousResearch/hermes-agent, arXiv:2608.27146 (제작: 본 블로그)</text>
</svg>
