<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="300" fill="#fafafa"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">오늘의 실전 팁 요약 — 프로덕션 운영 편</text>

  <!-- Codex 카드 -->
  <rect x="30" y="56" width="360" height="210" rx="12" fill="#eefbf2" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="50" y="86" font-size="14" font-weight="700" fill="#047857">🟩 Codex</text>
  <text x="50" y="112" font-size="13" font-weight="700" fill="#1a1a2e">retain_client_tool_outputs</text>
  <text x="50" y="136" font-size="12" fill="#333">클라이언트가 retain: true로 마킹한</text>
