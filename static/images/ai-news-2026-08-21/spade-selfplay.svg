<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="500" fill="#fafaf8"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">SPADE: 훈련 환경을 스스로 설계하는 셀프플레이 RL</text>
  <text x="450" y="60" text-anchor="middle" font-size="13.5" fill="#666">하나의 LLM이 두 역할 — 환경 설계자와 추론 에이전트 (30B 스케일 실험)</text>

  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- left: loop -->
  <rect x="50" y="100" width="230" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="165" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">환경 설계자</text>
  <text x="165" y="150" text-anchor="middle" font-size="12.5" fill="#374151">reset()/step() 인터페이스의</text>
  <text x="165" y="168" text-anchor="middle" font-size="12.5" fill="#374151">실행 가능한 환경 코드 작성</text>
  <text x="165" y="186" text-anchor="middle" font-size="12" fill="#6b7280">사전학습 문서 + 환경 메모리 참조</text>

  <rect x="50" y="290" width="230" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="165" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">추론 에이전트</text>
  <text x="165" y="340" text-anchor="middle" font-size="12.5" fill="#374151">생성된 멀티턴 환경에서</text>
  <text x="165" y="358" text-anchor="middle" font-size="12.5" fill="#374151">행동하며 RL로 학습</text>

  <g stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#arr2)">
    <path d="M 130 196 Q 110 243 130 282"/>
    <path d="M 200 282 Q 220 243 200 204"/>
  </g>
  <text x="316" y="238" font-size="12.8" fill="#374151">보상 신호 = 에이전트의 후회(regret)</text>
  <text x="316" y="257" font-size="12.3" fill="#6b7280">힌트를 줬을 때와 안 줬을 때의 점수 격차로 추정</text>
  <text x="316" y="276" font-size="12.3" fill="#6b7280">→ 설계자는 "풀 수 있지만 어려운" 경계 난이도를 학습</text>

  <!-- right: bar chart of gains -->
  <text x="560" y="118" font-size="15" font-weight="700" fill="#1a1a1a">최강 고정-환경 베이스라인 대비 향상폭</text>
  <g font-size="12.8" fill="#374151">
    <text x="560" y="160">8개 홀드아웃 벤치마크 평균</text>
    <rect x="560" y="168" width="82" height="22" rx="4" fill="#94a3b8"/>
    <text x="650" y="184" font-weight="700" fill="#475569">+5.3</text>

    <text x="560" y="228">BFCL-v4 멀티턴 (툴 사용)</text>
    <rect x="560" y="236" width="88" height="22" rx="4" fill="#60a5fa"/>
    <text x="656" y="252" font-weight="700" fill="#1e40af">+5.7</text>

    <text x="560" y="296">ACEBench-Agent (툴 사용)</text>
    <rect x="560" y="304" width="215" height="22" rx="4" fill="#2563eb"/>
    <text x="783" y="320" font-weight="700" fill="#1e40af">+13.9</text>
  </g>
  <text x="560" y="360" font-size="12" fill="#6b7280">막대 길이는 향상폭에 비례 (15.5px ≈ +1.0)</text>

  <rect x="50" y="410" width="800" height="52" rx="9" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="450" y="442" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">핵심: 학습자가 커질수록 고정된 환경 풀은 병목 — 환경 설계 자체를 학습 가능한 부품으로 만들었다</text>

  <text x="450" y="486" text-anchor="middle" font-size="12" fill="#9ca3af">출처: arXiv 2608.19197 초록 수치 · 자체 작도</text>
</svg>
