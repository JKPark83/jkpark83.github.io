<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#667"/>
    </marker>
  </defs>
  <rect width="800" height="430" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">dsh-superagent 작동 흐름 — "사람의 주의력을 최소로"</text>

  <!-- Sources -->
  <rect x="35" y="70" width="150" height="88" rx="10" fill="#eef4ff" stroke="#b9cdf2"/>
  <text x="110" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e9c">Source</text>
  <text x="110" y="118" text-anchor="middle" font-size="12.5" fill="#333">GitHub 이벤트</text>
  <text x="110" y="138" text-anchor="middle" font-size="12.5" fill="#333">Feishu 메시지(선택)</text>

  <!-- Eval gate -->
  <rect x="235" y="70" width="170" height="88" rx="10" fill="#fff7ec" stroke="#eed3a8"/>
  <text x="320" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#9c6a1f">Eval (정책 게이트)</text>
  <text x="320" y="118" text-anchor="middle" font-size="12.5" fill="#333">허용된 사람의 요청인가?</text>
  <text x="320" y="138" text-anchor="middle" font-size="12.5" fill="#333">팀이 쓴 규칙이 허용하나?</text>

  <!-- Ticket -->
  <rect x="455" y="70" width="140" height="88" rx="10" fill="#f0fbf2" stroke="#b5dfc0"/>
  <text x="525" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e7a35">Ticket</text>
  <text x="525" y="118" text-anchor="middle" font-size="12.5" fill="#333">작업 항목 생성</text>
  <text x="525" y="138" text-anchor="middle" font-size="12.5" fill="#333">권한·범위(Mandate)</text>

  <!-- Worker session -->
  <rect x="645" y="70" width="130" height="88" rx="10" fill="#f7f0fb" stroke="#d7bfe8"/>
  <text x="710" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#6a2f9c">작업 세션</text>
  <text x="710" y="118" text-anchor="middle" font-size="12.5" fill="#333">독립 디렉터리</text>
  <text x="710" y="138" text-anchor="middle" font-size="12.5" fill="#333">DeepSeek Harness</text>

  <line x1="185" y1="114" x2="230" y2="114" stroke="#667" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="405" y1="114" x2="450" y2="114" stroke="#667" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="595" y1="114" x2="640" y2="114" stroke="#667" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Outcomes -->
  <rect x="235" y="215" width="250" height="80" rx="10" fill="#eef9ff" stroke="#a9d4e8"/>
  <text x="360" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#17617d">결과 회신</text>
  <text x="360" y="264" text-anchor="middle" font-size="12.5" fill="#333">PR 생성 · 요청이 온 대화에 답변</text>
  <text x="360" y="283" text-anchor="middle" font-size="12.5" fill="#333">작업 중에는 침묵</text>

  <rect x="530" y="215" width="245" height="80" rx="10" fill="#fdeef0" stroke="#e8b5bd"/>
  <text x="652" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#9c2f42">웹 패널</text>
  <text x="652" y="264" text-anchor="middle" font-size="12.5" fill="#333">"사람이 필요한 것"만 표시</text>
  <text x="652" y="283" text-anchor="middle" font-size="12.5" fill="#333">질문은 한 번에 하나, 구조화된 형태</text>

  <path d="M710,158 L710,188 L360,188 L360,210" fill="none" stroke="#667" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M740,158 L740,188 L652,188 L652,210" fill="none" stroke="#667" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Principles strip -->
  <rect x="35" y="330" width="740" height="66" rx="10" fill="#f2f2f2" stroke="#ddd"/>
  <text x="55" y="356" font-size="13" font-weight="700" fill="#333">설계 원칙</text>
  <text x="55" y="380" font-size="12.5" fill="#444">요청·규칙 없이는 행동하지 않음 · 선제 작업은 '기록만 하는 모드'로 시작 · 영향 범위 기준으로 멈춤 · 실패는 실패로 보고</text>

  <text x="400" y="420" text-anchor="middle" font-size="11" fill="#888">출처: deepseek-ai/dsh-superagent-prototype README·docs (클론 검증, MIT)</text>
</svg>
