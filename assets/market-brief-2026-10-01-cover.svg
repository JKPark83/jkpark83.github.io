<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="8월 PCE 물가가 3.4퍼센트로 식고 마이크론이 역대 최대 실적을 냈지만 10년물 금리는 5.29퍼센트로 더 오르고 시간외 주가 반응은 덤덤했다는 것을 나타낸 표지">
  <defs>
