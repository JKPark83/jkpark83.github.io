<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="왼쪽에는 아래로만 길게 자라는 append-only 컨텍스트 두루마리가 있고, 오른쪽에는 모델이 커서를 쥐고 자기 컨텍스트 파일을 직접 고쳐 쓰는 모습이 있다. 컨텍스트가 더 이상 쌓이기만 하는 로그가 아니라 모델이 편집하는 파일이라는 것을 나타낸 그림.">
  <defs>
    <linearGradient id="clmbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a26"/>
      <stop offset="1" stop-color="#1d1433"/>
    </linearGradient>
    <marker id="clmc-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#clmbg)"/>

  <text x="600" y="84" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="42" font-weight="800">컨텍스트는 쌓는 게 아니라 고쳐 쓰는 것</text>
  <text x="600" y="130" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="24">자기 컨텍스트를 파일처럼 편집하는 Context Language Models</text>

  <g font-family="system-ui,sans-serif">
    <!-- left: append-only scroll -->
    <text x="265" y="190" text-anchor="middle" font-size="20" fill="#94a3b8">지금까지 — append-only</text>
    <rect x="150" y="210" width="230" height="330" rx="14" fill="#101c2e" stroke="#64748b" stroke-width="2.5"/>
    <g stroke="#475569" stroke-width="5" stroke-linecap="round">
      <line x1="175" y1="248" x2="355" y2="248"/>
      <line x1="175" y1="280" x2="340" y2="280"/>
      <line x1="175" y1="312" x2="355" y2="312"/>
      <line x1="175" y1="344" x2="330" y2="344"/>
      <line x1="175" y1="376" x2="355" y2="376"/>
      <line x1="175" y1="408" x2="345" y2="408"/>
      <line x1="175" y1="440" x2="355" y2="440"/>
      <line x1="175" y1="472" x2="335" y2="472"/>
    </g>
    <path d="M265 540 L265 580" stroke="#fb7185" stroke-width="3" />
    <text x="265" y="608" text-anchor="middle" font-size="17" fill="#fb7185">계속 자라기만 한다 ↓</text>

    <!-- middle arrow -->
    <path d="M440 380 L560 380" stroke="#38bdf8" stroke-width="4" marker-end="url(#clmc-arrow)"/>
    <text x="500" y="356" text-anchor="middle" font-size="18" fill="#38bdf8">CLM</text>

    <!-- right: editable context file -->
    <text x="815" y="190" text-anchor="middle" font-size="20" fill="#94a3b8">이제 — 모델이 편집하는 파일</text>
    <rect x="620" y="210" width="390" height="330" rx="14" fill="#101c2e" stroke="#38bdf8" stroke-width="3"/>
    <text x="645" y="246" font-size="16" fill="#7dd3fc" font-family="ui-monospace,monospace">context.md</text>
    <g stroke-linecap="round">
      <line x1="645" y1="282" x2="980" y2="282" stroke="#475569" stroke-width="5"/>
      <rect x="645" y="304" width="335" height="34" rx="6" fill="#0c2b3f" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="658" y="327" font-size="15" fill="#7dd3fc" font-family="ui-monospace,monospace">[상태 블록] best=0.82 · agents=6</text>
      <line x1="645" y1="368" x2="965" y2="368" stroke="#475569" stroke-width="5"/>
      <line x1="645" y1="400" x2="800" y2="400" stroke="#475569" stroke-width="5"/>
      <line x1="815" y1="400" x2="980" y2="400" stroke="#334155" stroke-width="5" stroke-dasharray="4 8"/>
      <line x1="645" y1="432" x2="975" y2="432" stroke="#475569" stroke-width="5"/>
    </g>
    <g transform="translate(900,452)">
      <path d="M0 46 L34 12 L46 24 L12 58 L-4 62 Z" fill="#fbbf24"/>
      <path d="M34 12 L46 24 L52 18 Q56 14 52 10 L48 6 Q44 2 40 6 Z" fill="#fde68a"/>
    </g>
    <text x="760" y="492" font-size="17" fill="#fbbf24">지우고 · 고치고 · 요약하고 · 되살린다</text>
    <text x="815" y="608" text-anchor="middle" font-size="17" fill="#4ade80">크기는 그대로, 핵심만 남긴다</text>
  </g>
</svg>
