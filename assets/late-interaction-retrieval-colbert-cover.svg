<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="레이트 인터랙션(late interaction) 검색을 나타낸 그림. 왼쪽에는 질의가 여러 토큰 벡터로 쪼개져 있고, 오른쪽에는 문서가 토큰(또는 이미지 패치)마다 하나씩 벡터를 가진 격자로 표현돼 있다. 가운데에서 각 질의 토큰이 문서 토큰 중 가장 비슷한 것 하나와 선으로 이어지며, 이 최대 유사도를 모두 더하는 MaxSim 연산이 점수를 만든다. 위에는 '단일 벡터는 점 하나, 레이트 인터랙션은 토큰마다 벡터 하나'라고 적혀 있다.">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111a2f"/>
    </linearGradient>
    <linearGradient id="lg-q" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="lg-d" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="lg-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1,1 L12,7 L1,13" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#lg-bg)"/>

  <text x="80" y="92" fill="#e2e8f0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="46" font-weight="800">Late Interaction 검색</text>
  <text x="80" y="140" fill="#94a3b8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="25" font-weight="600">단일 벡터는 문서를 &#8220;점 하나&#8221;로, 레이트 인터랙션은 &#8220;토큰마다 벡터 하나&#8221;로 본다</text>

  <!-- Query side -->
  <text x="120" y="212" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="24" font-weight="800">질의(query)</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="90" y="232" width="150" height="46" rx="9" fill="url(#lg-q)"/><text x="165" y="262" fill="#fff">"한국"</text>
    <rect x="90" y="292" width="150" height="46" rx="9" fill="url(#lg-q)"/><text x="165" y="322" fill="#fff">"GDP"</text>
    <rect x="90" y="352" width="150" height="46" rx="9" fill="url(#lg-q)"/><text x="165" y="382" fill="#fff">"성장률"</text>
  </g>
  <text x="165" y="430" fill="#64748b" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">토큰마다 벡터 1개</text>

  <!-- Document grid -->
  <text x="720" y="212" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="24" font-weight="800">문서(document) — 토큰/패치별 벡터</text>
  <g>
    <!-- 4 x 4 grid of doc token vectors -->
    <g id="docgrid"></g>
  </g>
  <!-- draw grid manually -->
  <g opacity="0.92">
    <rect x="720" y="232" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="816" y="232" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="912" y="232" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="1008" y="232" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="720" y="282" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="816" y="282" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="912" y="282" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="1008" y="282" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="720" y="332" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="816" y="332" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="912" y="332" width="86" height="40" rx="7" fill="url(#lg-d)"/>
    <rect x="1008" y="332" width="86" height="40" rx="7" fill="url(#lg-d)"/>
  </g>
  <text x="909" y="410" fill="#64748b" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">문서 토큰 벡터는 미리 계산해 저장</text>

  <!-- MaxSim lines: each query token -> best doc cell -->
  <g stroke="#fbbf24" stroke-width="3.2" fill="none" opacity="0.95" marker-end="url(#lg-arrow)">
    <path d="M245,255 C440,255 560,302 715,302"/>
    <path d="M245,315 C440,315 560,255 715,255"/>
    <path d="M245,375 C440,375 560,352 715,352"/>
  </g>
  <text x="480" y="185" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="19" font-weight="800" text-anchor="middle">MaxSim: 질의 토큰마다 가장 비슷한 문서 토큰 1개를 골라 더한다</text>

  <!-- bottom band -->
  <rect x="80" y="470" width="1040" height="96" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="512" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="21" font-weight="800">토큰 단위로 맞춰 정확하고, 문서 벡터는 미리 계산해 빠르다</text>
  <text x="110" y="546" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="18" font-weight="600">ColBERT &#183; ColBERTv2 &#183; PLAID &#183; ColPali &#183; ColQwen &#8212; 2026년 RAG의 새 표준으로 떠오른 검색 방식</text>
</svg>
