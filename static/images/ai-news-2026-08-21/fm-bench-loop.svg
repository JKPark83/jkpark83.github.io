<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="540" fill="#fafaf8"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">FM-Bench: 20시즌 장기 운영 루프</text>
  <text x="450" y="60" text-anchor="middle" font-size="13.5" fill="#666">프런티어 모델 15개 × 시드 3개 · LLM 심판 없음 · 최종 점수는 결정론적 엔진이 누적</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- loop boxes -->
  <rect x="60" y="110" width="220" height="86" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="170" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">LLM 에이전트</text>
  <text x="170" y="162" text-anchor="middle" font-size="12.5" fill="#374151">구단 경영 결정 340~400회</text>
  <text x="170" y="180" text-anchor="middle" font-size="12.5" fill="#374151">이적·계약·시설·유스 투자</text>

  <rect x="340" y="110" width="220" height="86" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">툴 26개</text>
  <text x="450" y="162" text-anchor="middle" font-size="12.5" fill="#374151">스쿼드 편성 · 협상 · 예산</text>
  <text x="450" y="180" text-anchor="middle" font-size="12.5" fill="#374151">모든 라이벌과 같은 예산</text>

  <rect x="620" y="110" width="220" height="86" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="730" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">결정론적 엔진</text>
  <text x="730" y="162" text-anchor="middle" font-size="12.5" fill="#374151">시즌 결과를 20년 누적</text>
  <text x="730" y="180" text-anchor="middle" font-size="12.5" fill="#374151">이사회가 해고할 수도 있음</text>

  <g stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <line x1="280" y1="153" x2="332" y2="153"/>
    <line x1="560" y1="153" x2="612" y2="153"/>
    <path d="M 730 196 Q 730 250 450 250 Q 170 250 170 202"/>
  </g>
  <text x="450" y="240" text-anchor="middle" font-size="12.5" fill="#6b7280">환경 피드백 (시즌 성적 · 재정 · 이사회 압박)</text>

  <!-- findings -->
  <text x="60" y="308" font-size="15.5" font-weight="700" fill="#1a1a1a">점수를 가른 것 (논문 관찰)</text>

  <rect x="60" y="322" width="380" height="88" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="76" y="348" font-size="13.5" font-weight="700" fill="#991b1b">자기관리 메모리의 두 가지 실패 모드</text>
  <text x="76" y="370" font-size="12.5" fill="#374151">① 쌓이기만 하는 아카이브 (정리 없음)</text>
  <text x="76" y="390" font-size="12.5" fill="#374151">② 시즌마다 계획을 갈아엎는 재작성</text>

  <rect x="460" y="322" width="380" height="88" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="476" y="348" font-size="13.5" font-weight="700" fill="#1e40af">고득점 모델의 행동 패턴</text>
  <text x="476" y="370" font-size="12.5" fill="#374151">후반부엔 회수 느린 투자 축소 · 현금 놀리지 않기</text>
  <text x="476" y="390" font-size="12.5" fill="#374151">재계약은 마감 훨씬 전에 시작</text>

  <rect x="60" y="426" width="780" height="60" rx="9" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="76" y="452" font-size="13" font-weight="700" fill="#1f2937">토큰 지출량은 점수를 전혀 예측하지 못함 · 규모·가격·벤더도 순위와 무상관</text>
  <text x="76" y="472" font-size="12.5" fill="#4b5563">수백 번 거절당한 입찰에서 시장의 숨은 가격을 학습한 모델은 하나도 없었다</text>

  <text x="450" y="522" text-anchor="middle" font-size="12" fill="#9ca3af">출처: arXiv 2608.18423 초록 · 자체 작도</text>
</svg>
