<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="400" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">오늘의 실전 팁 — 서브에이전트 컨텍스트, 양쪽 모두 분리 제어</text>

  <!-- Claude Code 카드 -->
  <rect x="30" y="55" width="360" height="300" rx="12" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="50" y="84" font-size="15" font-weight="700" fill="#1d4ed8">🟦 Claude Code 2.1.296</text>

  <text x="50" y="112" font-size="12.5" font-weight="700" fill="#555">새 프런트매터 필드</text>
  <rect x="50" y="122" width="320" height="58" rx="8" fill="#ffffff" stroke="#3b6fd4"/>
  <text x="66" y="146" font-size="12.5" font-family="monospace" fill="#1d4ed8">autoCompactWindow</text>
  <text x="66" y="167" font-size="12" fill="#333">서브에이전트가 메인보다 일찍 자동 압축</text>

  <text x="50" y="210" font-size="12" fill="#333">· 대상: 서브에이전트 프런트매터, --agents 정의</text>
  <text x="50" y="231" font-size="12" fill="#333">· 대용량 도구 출력을 읽는 워커에 좁은 창 지정</text>
  <text x="50" y="252" font-size="12" fill="#333">· 메인 대화의 압축 시점은 그대로 유지</text>

  <text x="50" y="290" font-size="12" fill="#1d4ed8" font-weight="700">→ 워커만 먼저 압축, 본 세션 컨텍스트는 보존</text>
  <text x="50" y="340" font-size="11.5" fill="#888">출처: CHANGELOG 2.1.296 + v2.1.296 태그 (클론 확인)</text>

  <!-- Codex 카드 -->
  <rect x="410" y="55" width="360" height="300" rx="12" fill="#eefbf2" stroke="#34a765" stroke-width="1.5"/>
  <text x="430" y="84" font-size="15" font-weight="700" fill="#15803d">🟩 Codex (10/9 커밋)</text>

  <text x="430" y="112" font-size="12.5" font-weight="700" fill="#555">새 기능 플래그 (기본 꺼짐)</text>
  <rect x="430" y="122" width="320" height="58" rx="8" fill="#ffffff" stroke="#34a765"/>
  <text x="446" y="146" font-size="12" font-family="monospace" fill="#15803d">subagent_default_context_limits</text>
  <text x="446" y="167" font-size="12" fill="#333">서브에이전트가 부모 설정을 상속하지 않음</text>

  <text x="430" y="210" font-size="12" fill="#333">· 켜면 model_context_window 오버라이드와</text>
  <text x="430" y="231" font-size="12" fill="#333">  auto_compact_token_limit 상속이 해제됨</text>
  <text x="430" y="252" font-size="12" fill="#333">· 서브에이전트는 자기 모델의 기본값 사용</text>

  <text x="430" y="290" font-size="12" fill="#15803d" font-weight="700">→ 부모를 좁혀도 워커 컨텍스트는 안 좁아짐</text>
  <text x="430" y="340" font-size="11.5" fill="#888">출처: openai/codex #52659 (클론 확인)</text>
</svg>
