<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="왼쪽은 라우팅 없이 쉬움·보통·어려움 세 질문을 모두 가장 비싼 모델 하나로 보내 돈이 새는 그림. 오른쪽은 라우터가 질문을 살펴 쉬운 건 작고 싼 모델, 어려운 건 크고 비싼 모델로 나눠 보내는 그림.">
  <defs>
    <marker id="rc-ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker>
    <marker id="rc-arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#16a34a"/></marker>
    <marker id="rc-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#e11d48"/></marker>
  </defs>
  <style>
    .rc-lbl{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .rc-q{fill:#0f172a}
    @media (prefers-color-scheme:dark){ .rc-q{fill:#e2e8f0} }
  </style>

  <!-- LEFT: no routing -->
  <text x="30" y="34" class="rc-lbl" fill="#e11d48" font-size="17" font-weight="800">라우팅 없이</text>
  <text x="30" y="54" class="rc-lbl" fill="#94a3b8" font-size="12">모든 질문 → 가장 비싼 모델</text>

  <rect x="24" y="80" width="120" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="84" y="102" class="rc-lbl rc-q" font-size="12.5" text-anchor="middle">쉬운 질문</text>
  <rect x="24" y="180" width="120" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="84" y="202" class="rc-lbl rc-q" font-size="12.5" text-anchor="middle">보통 질문</text>
  <rect x="24" y="280" width="120" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="84" y="302" class="rc-lbl rc-q" font-size="12.5" text-anchor="middle">어려운 질문</text>

  <path d="M146 97 C210 97 210 190 250 194" stroke="#e11d48" stroke-width="2" fill="none" marker-end="url(#rc-arr)"/>
  <path d="M146 197 L250 197" stroke="#e11d48" stroke-width="2" fill="none" marker-end="url(#rc-arr)"/>
  <path d="M146 297 C210 297 210 204 250 200" stroke="#e11d48" stroke-width="2" fill="none" marker-end="url(#rc-arr)"/>

  <rect x="256" y="150" width="104" height="96" rx="12" fill="#fee2e2" stroke="#e11d48" stroke-width="2"/>
  <text x="308" y="188" class="rc-lbl" fill="#e11d48" font-size="13.5" font-weight="800" text-anchor="middle">가장 비싼</text>
  <text x="308" y="206" class="rc-lbl" fill="#e11d48" font-size="13.5" font-weight="800" text-anchor="middle">모델</text>
  <text x="308" y="232" class="rc-lbl" font-size="22" text-anchor="middle">💸</text>

  <line x1="400" y1="40" x2="400" y2="360" stroke="#cbd5e1" stroke-dasharray="4 6"/>

  <!-- RIGHT: routing -->
  <text x="440" y="34" class="rc-lbl" fill="#16a34a" font-size="17" font-weight="800">라우팅</text>
  <text x="440" y="54" class="rc-lbl" fill="#94a3b8" font-size="12">질문마다 알맞은 모델로</text>

  <rect x="432" y="80" width="112" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="488" y="102" class="rc-lbl rc-q" font-size="12.5" text-anchor="middle">쉬운 질문</text>
  <rect x="432" y="180" width="112" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="488" y="202" class="rc-lbl rc-q" font-size="12.5" text-anchor="middle">보통 질문</text>
  <rect x="432" y="280" width="112" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="488" y="302" class="rc-lbl rc-q" font-size="12.5" text-anchor="middle">어려운 질문</text>

  <path d="M546 97 C580 97 578 180 600 190" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#rc-ar)"/>
  <path d="M546 197 L600 197" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#rc-ar)"/>
  <path d="M546 297 C580 297 578 214 600 204" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#rc-ar)"/>

  <!-- router diamond -->
  <path d="M636 197 L664 173 L692 197 L664 221 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="664" y="201" class="rc-lbl" fill="#2563eb" font-size="12" font-weight="800" text-anchor="middle">라우터</text>

  <!-- small model (cheap) -->
  <path d="M694 190 C720 150 720 118 726 112" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#rc-arg)"/>
  <rect x="700" y="84" width="88" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="744" y="104" class="rc-lbl" fill="#16a34a" font-size="12" font-weight="800" text-anchor="middle">작은 모델</text>
  <text x="744" y="120" class="rc-lbl" fill="#16a34a" font-size="10.5" text-anchor="middle">싸다 · 빠르다</text>

  <!-- big model (expensive) -->
  <path d="M694 204 C720 244 720 276 726 282" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#rc-ar)"/>
  <rect x="700" y="270" width="88" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="744" y="290" class="rc-lbl" fill="#d97706" font-size="12" font-weight="800" text-anchor="middle">큰 모델</text>
  <text x="744" y="306" class="rc-lbl" fill="#d97706" font-size="10.5" text-anchor="middle">비싸다 · 똑똑</text>

  <text x="600" y="360" class="rc-lbl" fill="#16a34a" font-size="12.5" font-weight="700" text-anchor="middle">쉬운 건 싸게, 어려운 건 확실하게 → 비용 ↓ 품질 유지</text>
</svg>
