<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="커버 그림. 왼쪽에는 에이전트 스웜이 AWS Emulator라는 건물을 블록처럼 쌓아 올리고 있고, 오른쪽에는 사람 엔지니어가 스펙, 정합성 테스트, 머지 게이트라는 세 개의 관문을 설계하고 있다. 코드는 에이전트가, 정답의 기준은 사람이 만든다는 구도">
  <defs>
    <linearGradient id="aebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#aebg)"/>

  <text x="600" y="76" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="37" font-weight="800">사람은 코드를 한 줄도 안 읽었다</text>
  <text x="600" y="120" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="22">에이전트 스웜이 만든 AWS Emulator — 그리고 '정합성 테스트' 엔지니어링</text>

  <!-- 왼쪽: 에이전트 스웜이 쌓는 블록 -->
  <text x="330" y="180" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="21" font-weight="800">에이전트 스웜</text>
  <text x="330" y="207" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">3주 · 29,684 커밋 · 437개 서비스 크레이트</text>

  <!-- 쌓인 블록들 (서비스 크레이트) -->
  <g font-family="monospace" font-size="15">
    <rect x="130" y="470" width="130" height="44" rx="7" fill="#38bdf8" opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="195" y="498" text-anchor="middle" fill="#7dd3fc">s3</text>
    <rect x="270" y="470" width="130" height="44" rx="7" fill="#38bdf8" opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="335" y="498" text-anchor="middle" fill="#7dd3fc">sqs</text>
    <rect x="410" y="470" width="130" height="44" rx="7" fill="#38bdf8" opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
    <text x="475" y="498" text-anchor="middle" fill="#7dd3fc">dynamodb</text>
    <rect x="200" y="416" width="130" height="44" rx="7" fill="#38bdf8" opacity="0.14" stroke="#38bdf8" stroke-width="2"/>
    <text x="265" y="444" text-anchor="middle" fill="#7dd3fc">lambda</text>
    <rect x="340" y="416" width="130" height="44" rx="7" fill="#38bdf8" opacity="0.14" stroke="#38bdf8" stroke-width="2"/>
    <text x="405" y="444" text-anchor="middle" fill="#7dd3fc">iam</text>
    <rect x="270" y="362" width="130" height="44" rx="7" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="335" y="390" text-anchor="middle" fill="#7dd3fc">+432…</text>
  </g>

  <!-- 에이전트 (작은 로봇 동그라미들) -->
  <g>
    <circle cx="150" cy="300" r="22" fill="#2dd4bf" opacity="0.2" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="150" y="307" text-anchor="middle" fill="#2dd4bf" font-family="sans-serif" font-size="18" font-weight="800">A</text>
    <circle cx="240" cy="262" r="22" fill="#2dd4bf" opacity="0.2" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="240" y="269" text-anchor="middle" fill="#2dd4bf" font-family="sans-serif" font-size="18" font-weight="800">A</text>
    <circle cx="340" cy="248" r="22" fill="#2dd4bf" opacity="0.2" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="340" y="255" text-anchor="middle" fill="#2dd4bf" font-family="sans-serif" font-size="18" font-weight="800">A</text>
    <circle cx="440" cy="262" r="22" fill="#2dd4bf" opacity="0.2" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="440" y="269" text-anchor="middle" fill="#2dd4bf" font-family="sans-serif" font-size="18" font-weight="800">A</text>
    <circle cx="520" cy="300" r="22" fill="#2dd4bf" opacity="0.2" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="520" y="307" text-anchor="middle" fill="#2dd4bf" font-family="sans-serif" font-size="18" font-weight="800">A</text>
    <line x1="165" y1="316" x2="220" y2="365" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="250" y1="284" x2="290" y2="358" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="340" y1="270" x2="335" y2="358" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="432" y1="284" x2="390" y2="358" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="505" y1="316" x2="450" y2="365" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 가운데 화살표 -->
  <line x1="590" y1="380" x2="660" y2="380" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="660,380 646,372 646,388" fill="#64748b"/>

  <!-- 오른쪽: 사람이 설계한 세 개의 관문 -->
  <text x="910" y="180" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="21" font-weight="800">사람 엔지니어</text>
  <text x="910" y="207" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">코드 0줄 — 대신 '정답의 기준'을 설계</text>

  <g font-family="sans-serif">
    <rect x="700" y="240" width="420" height="78" rx="12" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="724" y="273" fill="#fbbf24" font-size="21" font-weight="800">① 스펙 (Smithy 모델)</text>
    <text x="724" y="300" fill="#94a3b8" font-size="15">API의 모양을 기계가 읽는 형식으로 고정</text>

    <rect x="700" y="334" width="420" height="78" rx="12" fill="#fb7185" opacity="0.10" stroke="#fb7185" stroke-width="2.5"/>
    <text x="724" y="367" fill="#fb7185" font-size="21" font-weight="800">② 정합성 테스트 (fidelity test)</text>
    <text x="724" y="394" fill="#94a3b8" font-size="15">진짜 AWS에 먼저 검증된 테스트만 '정답'으로 인정</text>

    <rect x="700" y="428" width="420" height="78" rx="12" fill="#a78bfa" opacity="0.10" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="724" y="461" fill="#a78bfa" font-size="21" font-weight="800">③ 머지 게이트 (merge gate)</text>
    <text x="724" y="488" fill="#94a3b8" font-size="15">게이트를 통과한 커밋만 들어간다 — 리뷰 대신 관문</text>
  </g>

  <text x="600" y="586" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">코드는 에이전트가 쓴다 — 엔지니어의 일은 "무엇이 정답인지"를 설계하는 쪽으로 옮겨 간다</text>
</svg>
