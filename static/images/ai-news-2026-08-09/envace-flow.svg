<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="EnvACE 월드 리허설: 정책이 행동과 환경 응답을 번갈아 생성하며 환경 모델을 파라미터에 내재화, 테스트 시 실제 실행 전 사설 리허설">
  <rect width="820" height="440" fill="#0f172a"/>
  <text x="410" y="34" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="700">EnvACE — 월드 리허설(world rehearsal)로 환경을 내재화</text>
  <text x="410" y="56" text-anchor="middle" fill="#94a3b8" font-size="12.5">외부 환경/시뮬레이터 없이, 정책이 스스로 환경 응답을 "연기"하며 학습</text>

  <!-- training loop -->
  <text x="70" y="96" fill="#cbd5e1" font-size="13" font-weight="700">① 학습 루프 (act ⇄ rehearse, 하나의 정책이 두 역할)</text>

  <rect x="60" y="110" width="150" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="135" y="140" text-anchor="middle" fill="#e2e8f0" font-size="12.5" font-weight="700">행동(act)</text>
  <text x="135" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">tool call 생성</text>

  <rect x="250" y="110" width="170" height="70" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="335" y="136" text-anchor="middle" fill="#e2e8f0" font-size="12.5" font-weight="700">리허설(rehearse)</text>
  <text x="335" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">환경 역할을 스스로 연기</text>
  <text x="335" y="171" text-anchor="middle" fill="#94a3b8" font-size="11">→ 그 행동의 응답 생성</text>

  <rect x="460" y="110" width="170" height="70" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.6"/>
  <text x="545" y="136" text-anchor="middle" fill="#e2e8f0" font-size="12.5" font-weight="700">조건화</text>
  <text x="545" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">리허설 응답에 근거해</text>
  <text x="545" y="171" text-anchor="middle" fill="#94a3b8" font-size="11">다음 결정</text>

  <rect x="668" y="110" width="92" height="70" rx="10" fill="#052e16" stroke="#34d399" stroke-width="1.4"/>
  <text x="714" y="140" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">task-success</text>
  <text x="714" y="158" text-anchor="middle" fill="#86efac" font-size="11">보상으로</text>
  <text x="714" y="174" text-anchor="middle" fill="#86efac" font-size="11">end-to-end 최적화</text>

  <g stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#ar)">
    <line x1="210" y1="145" x2="248" y2="145"/>
    <line x1="420" y1="145" x2="458" y2="145"/>
    <line x1="630" y1="145" x2="666" y2="145"/>
  </g>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker></defs>
  <text x="410" y="200" text-anchor="middle" fill="#a78bfa" font-size="11">→ 행동↔응답 관계가 파라미터에 내재화되어 "에이전트 월드 모델"이 생김</text>

  <!-- test time -->
  <text x="70" y="238" fill="#cbd5e1" font-size="13" font-weight="700">② 테스트 시: 실제 실행 전 "사설 리허설(private rehearsal)"</text>
  <rect x="60" y="250" width="700" height="52" rx="10" fill="#3b0764"/>
  <text x="80" y="273" fill="#e9d5ff" font-size="12">모델이 커밋 전에 결과를 미리 시뮬레이션 → 나쁜/위험한 호출을 실제 부작용 없이 걸러냄</text>
  <text x="80" y="292" fill="#d8b4fe" font-size="11.5">추가 외부 상호작용 0회, 적당한 리허설 예산만으로 추가 성능 향상</text>

  <!-- benchmarks -->
  <text x="70" y="336" fill="#cbd5e1" font-size="13" font-weight="700">③ 검증 벤치마크 (환경-스케일링 베이스라인 대비 우위)</text>
  <g font-size="11.5">
    <rect x="60" y="348" width="165" height="30" rx="6" fill="#0c2a4a"/><text x="142" y="368" text-anchor="middle" fill="#bfdbfe">BFCL-v4</text>
    <rect x="235" y="348" width="165" height="30" rx="6" fill="#0c2a4a"/><text x="317" y="368" text-anchor="middle" fill="#bfdbfe">tau²-Bench</text>
    <rect x="410" y="348" width="165" height="30" rx="6" fill="#0c2a4a"/><text x="492" y="368" text-anchor="middle" fill="#bfdbfe">VitaBench</text>
    <rect x="585" y="348" width="175" height="30" rx="6" fill="#0c2a4a"/><text x="672" y="368" text-anchor="middle" fill="#bfdbfe">FinMCP-Bench</text>
  </g>
  <text x="410" y="410" text-anchor="middle" fill="#64748b" font-size="10.5">출처: arXiv:2608.06197 (2026-08-06, cs.AI) · 코드 github.com/Within-yao/EnvACE · 수치는 논문 초록 기준</text>
</svg>
