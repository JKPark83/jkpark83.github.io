<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="430" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">오늘의 AI 변화 지도 — 2026-10-11</text>

  <!-- 중앙 허브 -->
  <circle cx="400" cy="230" r="46" fill="#1a1a2e"/>
  <text x="400" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">에이전트</text>
  <text x="400" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">빌더</text>

  <!-- 연결선 -->
  <line x1="400" y1="184" x2="205" y2="128" stroke="#bbb" stroke-width="1.5"/>
  <line x1="400" y1="184" x2="595" y2="128" stroke="#bbb" stroke-width="1.5"/>
  <line x1="400" y1="276" x2="205" y2="330" stroke="#bbb" stroke-width="1.5"/>
  <line x1="400" y1="276" x2="595" y2="330" stroke="#bbb" stroke-width="1.5"/>

  <!-- 모델 -->
  <rect x="30" y="60" width="350" height="115" rx="12" fill="#fdf0e8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="50" y="86" font-size="14" font-weight="700" fill="#b5431a">🤖 모델</text>
  <text x="50" y="110" font-size="12" fill="#333">Microsoft Decision-1 (10/9): 옵션 스코어링 전용 모델</text>
  <text x="50" y="129" font-size="12" fill="#333">Qwen3.5-9B 기반, 입력 $0.042/M · 출력 무료</text>
  <text x="50" y="151" font-size="12" fill="#b5431a">라우팅·분류·액션 검증 자리를 겨냥</text>

  <!-- 논문 -->
  <rect x="420" y="60" width="350" height="115" rx="12" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="440" y="86" font-size="14" font-weight="700" fill="#1d4ed8">📚 논문</text>
  <text x="440" y="110" font-size="12" fill="#333">Option-Channel Attack: 가드레일 결정 모델, 한 단어로 뚫림</text>
  <text x="440" y="129" font-size="12" fill="#333">OnTrack: 스텝당 ~1ms 실시간 궤적 모니터링</text>
  <text x="440" y="151" font-size="12" fill="#1d4ed8">"결정 모델을 최종 결정자로 두지 말라"</text>

  <!-- 오픈소스 -->
  <rect x="30" y="285" width="350" height="115" rx="12" fill="#eefbf2" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="50" y="311" font-size="14" font-weight="700" fill="#047857">🛠 오픈소스</text>
  <text x="50" y="335" font-size="12" fill="#333">agent-skills: 개발 수명주기 전체를 덮는 스킬 세트</text>
  <text x="50" y="354" font-size="12" fill="#333">ai-trains-ai: RL 잡을 짜는 에이전트를 RL로 학습</text>
  <text x="50" y="376" font-size="12" fill="#047857">스킬 운영 vs 에이전트 자기학습, 양극단 샘플</text>

  <!-- 툴링 -->
  <rect x="420" y="285" width="350" height="115" rx="12" fill="#f3efff" stroke="#6250d6" stroke-width="1.5"/>
  <text x="440" y="311" font-size="14" font-weight="700" fill="#5b21b6">🧑‍💻 툴링</text>
  <text x="440" y="335" font-size="12" fill="#333">Codex: retain 마킹 도구 출력, 컴팩션에서 보존</text>
  <text x="440" y="354" font-size="12" fill="#333">CC: 공식 settings 예제에 HIPAA·샌드박스 베이스라인</text>
  <text x="440" y="376" font-size="12" fill="#5b21b6">둘 다 '프로덕션 운영' 쪽 다듬기</text>
