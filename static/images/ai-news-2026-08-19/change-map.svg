<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="700" fill="#0f172a">오늘의 AI 변화 지도 — 축은 &quot;모델&quot;이 아니라 &quot;하니스&quot;</text>
  <text x="24" y="50" font-size="12" fill="#64748b">가중치를 건드리지 않고 실행 시스템(런타임·상태·규칙)을 바꿔서 성능을 올린다</text>

  <g>
    <ellipse cx="380" cy="240" rx="104" ry="42" fill="#1e293b"/>
    <text x="380" y="236" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">하니스 스케일링</text>
    <text x="380" y="256" font-size="11" fill="#94a3b8" text-anchor="middle">harness &gt; weights</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="300" y1="212" x2="196" y2="150"/>
    <line x1="460" y1="212" x2="564" y2="150"/>
    <line x1="300" y1="268" x2="196" y2="330"/>
    <line x1="460" y1="268" x2="564" y2="330"/>
  </g>

  <g>
    <rect x="24" y="96" width="272" height="86" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="118" font-size="12.5" font-weight="700" fill="#1d4ed8">📚 StateM (2608.15089)</text>
    <text x="38" y="138" font-size="11" fill="#334155">지속 상태 · 페이즈별 컨텍스트 · 검사된 전이</text>
    <text x="38" y="154" font-size="11" fill="#334155">Terminal-Bench 2.1 83.1 → 92.1 (동일 모델)</text>
    <text x="38" y="170" font-size="11" fill="#334155">최종 점수 비용 $15 vs 레퍼런스 $574.68</text>
  </g>

  <g>
    <rect x="464" y="96" width="272" height="86" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="478" y="118" font-size="12.5" font-weight="700" fill="#6d28d9">📚 Agentic Transaction (2608.13900)</text>
    <text x="478" y="138" font-size="11" fill="#334155">에이전트 실행에 ACID를 다시 정의</text>
    <text x="478" y="154" font-size="11" fill="#334155">탐색 → 실행 → 검증 트랜잭션 사이클</text>
    <text x="478" y="170" font-size="11" fill="#334155">SOTA 대비 +10.6% (Claude Code 포함)</text>
  </g>

  <g>
    <rect x="24" y="298" width="272" height="86" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="38" y="320" font-size="12.5" font-weight="700" fill="#047857">🛠 로컬 툴콜링 두 극단</text>
    <text x="38" y="340" font-size="11" fill="#334155">needle2 — 45M · 14MB 바이너리 · RAM 28MB</text>
    <text x="38" y="356" font-size="11" fill="#334155">Muse Glimmer 30B — 4bit 20GB 미만, 로컬</text>
    <text x="38" y="372" font-size="11" fill="#334155">둘 다 Apache-2.0</text>
  </g>

  <g>
    <rect x="464" y="298" width="272" height="86" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="478" y="320" font-size="12.5" font-weight="700" fill="#c2410c">🧪 ClawGym II (2608.16798)</text>
    <text x="478" y="340" font-size="11" fill="#334155">하니스를 블랙박스로 두고 RL 최적화</text>
    <text x="478" y="356" font-size="11" fill="#334155">같은 모델, OpenClaw +9.98 / Claude Code +14.81</text>
    <text x="478" y="372" font-size="11" fill="#334155">→ 하니스마다 이득이 다르다</text>
  </g>

  <g>
    <rect x="24" y="404" width="712" height="48" rx="6" fill="#1e293b"/>
    <text x="40" y="424" font-size="12.5" font-weight="700" fill="#ffffff">오늘 바로 할 일</text>
    <text x="40" y="442" font-size="11.5" fill="#cbd5e1">사후분석에서 나온 교훈을 산문 메모가 아니라 &quot;검사 가능한 사전조건(precondition)&quot;으로 런북에 박아 넣기.</text>
  </g>
</svg>
