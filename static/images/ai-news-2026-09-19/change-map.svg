  <text x="486" y="188" font-size="11.5" fill="#4b5563">176개 설정 비교 — 플래닝·툴·컨텍스트 관리 분해</text>

  <!-- Q3: 오픈소스 -->
  <rect x="40" y="350" width="330" height="130" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="56" y="374" font-size="14" font-weight="700" fill="#047857">🛠 오픈소스</text>
  <text x="56" y="398" font-size="12.5" fill="#111827">NVlabs/SoL-Pi — 논문 그대로의 Pi 확장</text>
  <text x="56" y="416" font-size="11.5" fill="#4b5563">TypeScript · MIT · 4개 메커니즘 전부 opt-in</text>
  <text x="56" y="440" font-size="12.5" fill="#111827">i-have-adhd — 출력 자체를 스킬로 교정</text>
  <text x="56" y="458" font-size="11.5" fill="#4b5563">Claude·Codex·Gemini·Qwen 등 멀티툴 스킬 + 자체 eval</text>

  <!-- Q4: 팁 -->
  <rect x="470" y="350" width="330" height="130" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="486" y="374" font-size="14" font-weight="700" fill="#c2410c">🧑‍💻 실전 팁</text>
  <text x="486" y="398" font-size="12.5" fill="#111827">🟩 codex execpolicy — 명령 정책을 규칙 파일로</text>
  <text x="486" y="416" font-size="12.5" fill="#111827">🟦 /feature-dev — 7단계 기능 개발 워크플로</text>
  <text x="486" y="434" font-size="12.5" fill="#111827">🟪 컨텍스트: 규칙 생략 → LLM 요약 순서로</text>
  <text x="486" y="458" font-size="11.5" fill="#4b5563">셋 다 '하네스를 내 손으로 조정한다'는 같은 방향</text>

  <text x="420" y="540" text-anchor="middle" font-size="11" fill="#9ca3af">모든 수치는 arXiv 초록·저장소 클론으로 검증 · jkpark83.github.io</text>
