<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="430" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold">오늘의 AI 변화 지도 — 2026-08-31</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">공통 축: 루프가 길어질수록 "상태(state)"가 새 전선이 된다</text>

  <!-- center node -->
  <rect x="290" y="195" width="220" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="217" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="bold">긴 루프 에이전트의 상태 관리</text>
  <text x="400" y="236" text-anchor="middle" fill="#94a3b8" font-size="11">목표 · 안전 · 메모리 · 예산</text>

  <!-- connectors -->
  <line x1="290" y1="205" x2="215" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="510" y1="205" x2="585" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="290" y1="238" x2="215" y2="300" stroke="#334155" stroke-width="1.5"/>
  <line x1="510" y1="238" x2="585" y2="300" stroke="#334155" stroke-width="1.5"/>

  <!-- top-left: models/releases -->
  <rect x="35" y="80" width="180" height="88" rx="10" fill="#172554" stroke="#3b82f6"/>
  <text x="125" y="102" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">모델 · 릴리즈</text>
  <text x="125" y="122" text-anchor="middle" fill="#e2e8f0" font-size="11">Sonnet 5 $2/$10 영구화</text>
  <text x="125" y="139" text-anchor="middle" fill="#e2e8f0" font-size="11">Codex CLI 0.151.0</text>
  <text x="125" y="156" text-anchor="middle" fill="#e2e8f0" font-size="11">Qwen3.8-Flash-Next</text>

  <!-- top-right: papers -->
  <rect x="585" y="80" width="180" height="88" rx="10" fill="#3b0764" stroke="#a855f7"/>
  <text x="675" y="102" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="bold">논문</text>
  <text x="675" y="122" text-anchor="middle" fill="#e2e8f0" font-size="11">LoopHarness: 루프 안전 상태</text>
  <text x="675" y="139" text-anchor="middle" fill="#e2e8f0" font-size="11">가짜 증거에 베팅하는</text>
  <text x="675" y="156" text-anchor="middle" fill="#e2e8f0" font-size="11">에이전트 (Calibrated…)</text>

  <!-- bottom-left: open source -->
  <rect x="35" y="272" width="180" height="88" rx="10" fill="#052e16" stroke="#22c55e"/>
  <text x="125" y="294" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold">오픈소스</text>
  <text x="125" y="314" text-anchor="middle" fill="#e2e8f0" font-size="11">LoopX: 루프 상태 커널</text>
  <text x="125" y="331" text-anchor="middle" fill="#e2e8f0" font-size="11">TencentDB-Agent-Memory:</text>
  <text x="125" y="348" text-anchor="middle" fill="#e2e8f0" font-size="11">팀 단위 메모리 허브</text>

  <!-- bottom-right: tips -->
  <rect x="585" y="272" width="180" height="88" rx="10" fill="#431407" stroke="#f97316"/>
  <text x="675" y="294" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="bold">실전 팁</text>
  <text x="675" y="314" text-anchor="middle" fill="#e2e8f0" font-size="11">Codex: MCP 결과 미들웨어</text>
  <text x="675" y="331" text-anchor="middle" fill="#e2e8f0" font-size="11">Claude Code: 공식 커맨드 해부</text>
  <text x="675" y="348" text-anchor="middle" fill="#e2e8f0" font-size="11">공통: 루프 레벨 리스크 상태</text>

  <text x="400" y="408" text-anchor="middle" fill="#64748b" font-size="11">bounded turn(한 턴) 단위 도구는 성숙했다 — 이제 턴 사이를 잇는 상태 계층이 경쟁 지점</text>
</svg>
