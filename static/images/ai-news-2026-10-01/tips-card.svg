<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">Codex vs Claude Code — 오늘의 실전 포인트</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#8a90a3">둘 다 9/30 저장소·릴리즈에서 클론으로 검증</text>

  <!-- left: Codex -->
  <rect x="40" y="80" width="345" height="290" rx="14" fill="#eef7f1" stroke="#2f9d63" stroke-width="2"/>
  <text x="212" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#1d7a4b">🟩 Codex</text>
  <text x="212" y="128" text-anchor="middle" font-size="11" fill="#8a90a3">skill 사용의 OpenTelemetry 관측</text>
  <text x="60" y="158" font-size="13" fill="#1a1a2e">새 로그 이벤트: codex.skill_invocation</text>
  <text x="60" y="182" font-size="12.5" fill="#1a1a2e">· 명시적 주입 + 암묵적 사용 감지 모두 기록</text>
  <text x="60" y="204" font-size="12.5" fill="#1a1a2e">· skill 이름·invocation_type·turn·모델 포함</text>
  <text x="60" y="226" font-size="12.5" fill="#1a1a2e">· 프롬프트·툴 인자·skill 내용은 제외</text>
  <text x="60" y="248" font-size="12.5" fill="#1a1a2e">· 기존 OTel 익스포터로 즉시 방출</text>
  <text x="60" y="278" font-size="12" fill="#1d7a4b">활용: "어느 skill이 실제로 쓰이나" 대시보드</text>
  <text x="60" y="296" font-size="12" fill="#1d7a4b">→ 안 쓰이는 skill 정리, 비용·행동 상관 분석</text>
  <text x="60" y="326" font-size="12" fill="#b3261e">주의: exporter = "none"이면 방출 안 됨</text>
  <text x="60" y="344" font-size="12" fill="#555f77">docs: codex-rs/otel/README.md</text>

  <!-- right: Claude Code -->
  <rect x="415" y="80" width="345" height="290" rx="14" fill="#f7f3ff" stroke="#8a63e8" stroke-width="2"/>
  <text x="587" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#6b3fd4">🟦 Claude Code 2.1.286</text>
  <text x="587" y="128" text-anchor="middle" font-size="11" fill="#8a90a3">헤드리스·CI의 모델 장애 내성</text>
  <text x="435" y="158" font-size="13" fill="#1a1a2e">API가 모델을 거부하면 자동 복구:</text>
  <text x="435" y="182" font-size="12.5" fill="#1a1a2e">· 같은 티어의 이전 모델로 1회 재시도</text>
  <text x="435" y="204" font-size="12.5" fill="#1a1a2e">· --fallback-model이 fast 불가 시</text>
  <text x="435" y="226" font-size="12.5" fill="#1a1a2e">  standard 속도로 전환해 계속 실행</text>
  <text x="435" y="248" font-size="12.5" fill="#1a1a2e">· 권한 요청이 쌓이면 "2 of 5" 표시</text>
  <text x="435" y="278" font-size="12" fill="#6b3fd4">활용: 야간 배치·CI 파이프라인에서</text>
  <text x="435" y="296" font-size="12" fill="#6b3fd4">모델 이슈로 전체 잡이 죽는 일 방지</text>
  <text x="435" y="326" font-size="12" fill="#b3261e">주의: 폴백 모델 결과는 품질 재검증 필요</text>
  <text x="435" y="344" font-size="12" fill="#555f77">release: v2.1.286 changelog</text>

  <!-- bottom takeaway -->
  <rect x="40" y="390" width="720" height="50" rx="12" fill="#fff8ec" stroke="#e8963f" stroke-width="1.5"/>
  <text x="60" y="412" font-size="13" font-weight="700" fill="#c26a10">공통 교훈</text>
  <text x="60" y="430" font-size="12.5" fill="#1a1a2e">에이전트 스택의 다음 격전지는 "관측성과 장애 내성" — 만들 때가 아니라 굴릴 때의 문제를 도구가 흡수하기 시작했습니다.</text>
</svg>
