<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="코딩 에이전트 시크릿 유출을 표현한 커버 그림. 왼쪽에는 '네, 다시 묻지 마세요' 승인 버튼과 비밀번호가 담긴 명령어가, 가운데에는 그 명령이 그대로 저장된 settings.local.json 파일이, 오른쪽에는 공개 GitHub 저장소와 유출된 시크릿 1,379개라는 숫자가 그려져 있고, 세 요소가 화살표로 이어져 있다">
  <defs>
    <linearGradient id="cshbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="cshcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <marker id="csharw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#cshbg)"/>

  <!-- title -->
  <text x="600" y="76" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="38" font-weight="800">편의 버튼 하나가 비밀번호를 공개했다</text>
  <text x="600" y="118" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="22">코딩 에이전트 시대의 secrets hygiene</text>

  <g font-family="sans-serif">
    <!-- left: approval dialog -->
    <rect x="60" y="190" width="310" height="250" rx="16" fill="url(#cshcard)" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="215" y="228" text-anchor="middle" fill="#38bdf8" font-size="19" font-weight="700">권한 승인 프롬프트</text>
    <rect x="85" y="250" width="260" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="274" fill="#94a3b8" font-size="14" font-family="monospace">psql -h prod-db …</text>
    <text x="100" y="296" fill="#fb7185" font-size="14" font-family="monospace">PGPASSWORD=s3cr3t!</text>
    <rect x="85" y="326" width="260" height="40" rx="8" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="215" y="352" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">네, 다시 묻지 마세요</text>
    <text x="215" y="412" text-anchor="middle" fill="#64748b" font-size="14">승인 = 명령 전체가 규칙으로 저장</text>

    <!-- middle: settings file -->
    <rect x="445" y="190" width="310" height="250" rx="16" fill="url(#cshcard)" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="600" y="228" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700" font-family="monospace">settings.local.json</text>
    <rect x="470" y="250" width="260" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="485" y="276" fill="#94a3b8" font-size="13" font-family="monospace">"allow": [</text>
    <text x="495" y="300" fill="#94a3b8" font-size="13" font-family="monospace">"Bash(PGPASSWORD=</text>
    <text x="505" y="324" fill="#fb7185" font-size="13" font-family="monospace">s3cr3t! psql …)"</text>
    <text x="485" y="348" fill="#94a3b8" font-size="13" font-family="monospace">]</text>
    <text x="600" y="395" text-anchor="middle" fill="#64748b" font-size="14">비밀이 설정 파일에 그대로</text>
    <text x="600" y="418" text-anchor="middle" fill="#64748b" font-size="14">.gitignore 보호에는 구멍이</text>

    <!-- right: public github -->
    <rect x="830" y="190" width="310" height="250" rx="16" fill="url(#cshcard)" stroke="#fb7185" stroke-width="2.5"/>
    <text x="985" y="228" text-anchor="middle" fill="#fb7185" font-size="19" font-weight="700">공개 GitHub 저장소</text>
    <text x="985" y="290" text-anchor="middle" fill="#e2e8f0" font-size="44" font-weight="800">1,379개</text>
    <text x="985" y="322" text-anchor="middle" fill="#94a3b8" font-size="15">유출된 시크릿 (Apiiro, 2026-11)</text>
    <text x="985" y="368" text-anchor="middle" fill="#94a3b8" font-size="14">DB 비밀번호 · 서비스 키 · SSH</text>
    <text x="985" y="392" text-anchor="middle" fill="#94a3b8" font-size="14">GitHub·npm 토큰 · AWS 키</text>
    <text x="985" y="416" text-anchor="middle" fill="#64748b" font-size="13">히스토리 포함 3만여 개 (GitGuardian)</text>

    <!-- arrows -->
    <line x1="372" y1="315" x2="438" y2="315" stroke="#fb7185" stroke-width="3" marker-end="url(#csharw)"/>
    <line x1="757" y1="315" x2="823" y2="315" stroke="#fb7185" stroke-width="3" marker-end="url(#csharw)"/>
  </g>

  <text x="600" y="530" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="17">에이전트가 쓰는 모든 파일은 잠재적 유출 벡터입니다 — 막는 법을 4겹으로 정리했습니다</text>
  <text x="600" y="580" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="15">jkpark83.github.io · AI 엔지니어링</text>
</svg>
