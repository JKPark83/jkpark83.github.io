<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="100%" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="820" height="390" fill="#0f172a"/>
  <text x="410" y="32" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">에이전트 메모리 오픈소스 3종 — 역할로 나눠 쓰기</text>
  <text x="410" y="56" fill="#94a3b8" font-size="12.5" text-anchor="middle">스타 수는 2차 출처(웹 검색) 기준 · 이 세션은 GitHub API 차단으로 API 미검증</text>

  <!-- col 1 mem0 -->
  <rect x="30" y="80" width="245" height="270" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="152" y="110" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">mem0</text>
  <text x="152" y="132" fill="#94a3b8" font-size="12" text-anchor="middle">Python · ~5만+ ★ (2차)</text>
  <line x1="50" y1="146" x2="255" y2="146" stroke="#334155"/>
  <text x="50" y="172" fill="#e2e8f0" font-size="12.5" font-weight="700">역할: 붙이는 메모리 레이어</text>
  <text x="50" y="196" fill="#cbd5e1" font-size="12">기존 프레임워크 위에 저장·</text>
  <text x="50" y="214" fill="#cbd5e1" font-size="12">검색을 얹는다. vector+graph+</text>
  <text x="50" y="232" fill="#cbd5e1" font-size="12">KV 하이브리드 스토어.</text>
  <text x="50" y="266" fill="#f59e0b" font-size="12" font-weight="700">쓸 때:</text>
  <text x="50" y="286" fill="#cbd5e1" font-size="12">이미 있는 에이전트에</text>
  <text x="50" y="304" fill="#cbd5e1" font-size="12">개인화·장기 기억을</text>
  <text x="50" y="322" fill="#cbd5e1" font-size="12">빠르게 추가.</text>

  <!-- col 2 letta -->
  <rect x="288" y="80" width="245" height="270" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="410" y="110" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle">letta</text>
  <text x="410" y="132" fill="#94a3b8" font-size="12" text-anchor="middle">Python · ~24K ★ (2차)</text>
  <line x1="308" y1="146" x2="513" y2="146" stroke="#334155"/>
  <text x="308" y="172" fill="#e2e8f0" font-size="12.5" font-weight="700">역할: 메모리 내장 런타임</text>
  <text x="308" y="196" fill="#cbd5e1" font-size="12">에이전트가 그 안에서 살고</text>
  <text x="308" y="214" fill="#cbd5e1" font-size="12">실행되는 OS형 플랫폼.</text>
  <text x="308" y="232" fill="#cbd5e1" font-size="12">자기 편집형 메모리 계층.</text>
  <text x="308" y="266" fill="#f59e0b" font-size="12" font-weight="700">쓸 때:</text>
  <text x="308" y="286" fill="#cbd5e1" font-size="12">메모리를 1급 시민으로</text>
  <text x="308" y="304" fill="#cbd5e1" font-size="12">두고 상태를 셀프 호스트로</text>
  <text x="308" y="322" fill="#cbd5e1" font-size="12">직접 운영.</text>

  <!-- col 3 techniques -->
  <rect x="546" y="80" width="245" height="270" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="668" y="110" fill="#f472b6" font-size="14.5" font-weight="700" text-anchor="middle">Agent_Memory_Techniques</text>
  <text x="668" y="132" fill="#94a3b8" font-size="12" text-anchor="middle">Jupyter · 학습 자료</text>
  <line x1="566" y1="146" x2="771" y2="146" stroke="#334155"/>
  <text x="566" y="172" fill="#e2e8f0" font-size="12.5" font-weight="700">역할: 30개 실습 노트북</text>
  <text x="566" y="196" fill="#cbd5e1" font-size="12">buffer·vector·knowledge</text>
  <text x="566" y="214" fill="#cbd5e1" font-size="12">graph·episodic/semantic,</text>
  <text x="566" y="232" fill="#cbd5e1" font-size="12">MemGPT·Mem0·Zep 비교.</text>
  <text x="566" y="266" fill="#f59e0b" font-size="12" font-weight="700">쓸 때:</text>
  <text x="566" y="286" fill="#cbd5e1" font-size="12">프레임워크를 고르기 전에</text>
  <text x="566" y="304" fill="#cbd5e1" font-size="12">기법별 트레이드오프를</text>
  <text x="566" y="322" fill="#cbd5e1" font-size="12">직접 돌려보며 학습.</text>

  <text x="410" y="378" fill="#64748b" font-size="11" text-anchor="middle">자체 제작 SVG · 레이어(mem0) / 런타임(letta) / 학습(techniques)로 역할 분리</text>
</svg>
