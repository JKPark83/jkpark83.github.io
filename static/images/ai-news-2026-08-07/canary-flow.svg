<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Canary Tools 방법: 6종 미끼 툴을 MCP 툴킷에 심어 모델별 툴 선택 취약도 프로필을 만든다. 모델 간 취약도 약 36배 차이, 취약도와 실패의 상관 Spearman -0.34">
  <rect width="840" height="400" fill="#0f172a"/>
  <text x="420" y="32" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="700">Canary Tools — 툴 선택 실패를 "진단"으로 바꾸기</text>
  <text x="420" y="53" text-anchor="middle" fill="#94a3b8" font-size="12.5">MCP 툴킷에 미끼 툴 6종을 심어 실패의 "원인 유형"을 프로파일링</text>

  <!-- 6 categories -->
  <text x="150" y="86" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">6종 미끼(canary) 유형</text>
  <g font-size="11.5">
    <rect x="30" y="98" width="240" height="34" rx="7" fill="#0c2a4a" stroke="#38bdf8"/><text x="44" y="120" fill="#bae6fd">① 의미 미끼 (semantic decoy)</text>
    <rect x="30" y="138" width="240" height="34" rx="7" fill="#0c2a4a" stroke="#38bdf8"/><text x="44" y="160" fill="#bae6fd">② 파라미터 함정 (parameter trap)</text>
    <rect x="30" y="178" width="240" height="34" rx="7" fill="#0c2a4a" stroke="#38bdf8"/><text x="44" y="200" fill="#bae6fd">③ 능력 신기루 (capability mirage)</text>
    <rect x="30" y="218" width="240" height="34" rx="7" fill="#0c2a4a" stroke="#38bdf8"/><text x="44" y="240" fill="#bae6fd">④ 전제 무시 (prerequisite blindness)</text>
    <rect x="30" y="258" width="240" height="34" rx="7" fill="#0c2a4a" stroke="#38bdf8"/><text x="44" y="280" fill="#bae6fd">⑤ 시간 미끼 (temporal decoy)</text>
    <rect x="30" y="298" width="240" height="34" rx="7" fill="#0c2a4a" stroke="#38bdf8"/><text x="44" y="320" fill="#bae6fd">⑥ 세분화 함정 (granularity trap)</text>
  </g>

  <!-- arrow -->
  <path d="M278 215 L338 215" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker></defs>

  <!-- center box -->
  <rect x="342" y="176" width="150" height="80" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="417" y="205" text-anchor="middle" fill="#fcd34d" font-size="12.5" font-weight="700">에이전트 실행</text>
  <text x="417" y="224" text-anchor="middle" fill="#fde68a" font-size="11">8모델·3티어</text>
  <text x="417" y="241" text-anchor="middle" fill="#fde68a" font-size="11">120태스크·8,640런</text>

  <path d="M494 215 L554 215" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>

  <!-- profile -->
  <text x="700" y="86" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">모델별 취약도 프로필</text>
  <g font-size="11">
    <text x="566" y="150" fill="#86efac">가장 낮음 · Claude Opus 4.8</text>
    <rect x="566" y="158" width="70" height="20" rx="4" fill="#22c55e"/>
    <text x="566" y="212" fill="#fca5a5">가장 높음 · Llama 3.1 8B</text>
    <rect x="566" y="220" width="248" height="20" rx="4" fill="#ef4444"/>
    <text x="566" y="270" fill="#e2e8f0" font-size="11.5" font-weight="700">모델 간 취약도 약 36배 차이</text>
  </g>
  <rect x="566" y="286" width="248" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="580" y="310" fill="#cbd5e1" font-size="11.5">취약도 ↔ 태스크 실패</text>
  <text x="580" y="330" fill="#f1f5f9" font-size="13" font-weight="700">Spearman = −0.34</text>
  <text x="580" y="352" fill="#94a3b8" font-size="10.5">평가자 일치 Cohen κ = 0.75</text>

  <text x="420" y="392" text-anchor="middle" fill="#64748b" font-size="10.5">출처: arXiv 2608.04719 (Anand &amp; Chattaraj) · 막대는 상대 크기 예시</text>
</svg>
