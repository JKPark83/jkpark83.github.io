<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">컨텍스트 전략별 완료율 — Less Context, Better Agents</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#64748b">GPT-5 · 호텔 경비 50태스크 · 5회 평균 (arXiv 2606.10209)</text>

  <!-- axes -->
  <line x1="90" y1="360" x2="700" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="90" y1="90" x2="90" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <g font-size="11" fill="#94a3b8" text-anchor="end">
    <text x="82" y="364">0%</text>
    <text x="82" y="296">25%</text>
    <text x="82" y="228">50%</text>
    <text x="82" y="160">75%</text>
    <text x="82" y="94">100%</text>
  </g>
  <g stroke="#eef2f7" stroke-width="1">
    <line x1="90" y1="292" x2="700" y2="292"/>
    <line x1="90" y1="224" x2="700" y2="224"/>
    <line x1="90" y1="156" x2="700" y2="156"/>
    <line x1="90" y1="92" x2="700" y2="92"/>
  </g>

  <!-- bars: scale 100% = 270px (360-90) -->
  <!-- no-user-model 8.0 -> 21.6px -->
  <rect x="130" y="338.4" width="90" height="21.6" rx="4" fill="#dc2626"/>
  <text x="175" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">8.0%</text>
  <!-- full-context 71.0 -> 191.7 -->
  <rect x="270" y="168.3" width="90" height="191.7" rx="4" fill="#f59e0b"/>
  <text x="315" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">71.0%</text>
  <!-- pruned last5 79.0 -> 213.3 -->
  <rect x="410" y="146.7" width="90" height="213.3" rx="4" fill="#3b82f6"/>
  <text x="455" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">79.0%</text>
  <!-- prune+summ 91.6 -> 247.3 -->
  <rect x="550" y="112.7" width="90" height="247.3" rx="4" fill="#16a34a"/>
  <text x="595" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">91.6%</text>

  <!-- x labels -->
  <g font-size="11.5" fill="#334155" text-anchor="middle">
    <text x="175" y="380">유저모델 없음</text>
    <text x="175" y="395" fill="#94a3b8">baseline</text>
    <text x="315" y="380">풀 히스토리</text>
    <text x="315" y="395" fill="#94a3b8">1.48M tok · 14.6h</text>
    <text x="455" y="380">최근5개 prune</text>
    <text x="455" y="395" fill="#94a3b8">535K tok · 5.4h</text>
    <text x="595" y="380">prune+요약</text>
    <text x="595" y="395" fill="#94a3b8">553K tok · 5.8h</text>
  </g>

  <text x="360" y="425" text-anchor="middle" font-size="12" fill="#15803d" font-weight="600">prune+요약: 완료율 ↑ + 토큰 ~2.7배·시간 ~2.5배 ↓ (풀 히스토리 대비)</text>
</svg>
