<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="9월 고용이 2만9천 명 증가에 그치는 쇼크가 나오자 나스닥은 1.2퍼센트 올랐지만 10년물 금리는 5.25퍼센트로 되올랐고, 비트코인은 8만5천 달러를 돌파했으며 주식 심리는 공포 27, 암호화폐 심리는 극단 탐욕 77로 갈렸다는 것을 나타낸 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.10.03 · 나스닥 &amp; 비트코인 5분 요약 · 주말판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">고용 쇼크에 주식은 환호, 채권은 고개를 저었습니다 — 비트코인은 박스를 뚫었습니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">밤사이 달라진 것</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#f87171">+2만9천</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">9월 고용 · 예상의 1/3</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#4ade80">$86,500</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">BTC · 8만5천 돌파</text>
