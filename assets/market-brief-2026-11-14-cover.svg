<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="토요일 아침 브리핑 표지. 10월 PPI 헤드라인은 예상을 밑돌았지만 전년비 6.5퍼센트로 4년 만의 최고였고 10년물 금리는 5.13퍼센트로 5퍼센트 위에 안착했습니다. 나스닥은 0.9퍼센트 하락한 25,136으로 증액 검토선을 내줬습니다. 비트코인은 장중 67,555달러로 200주 이동평균선을 하회했고 코인 공포탐욕지수는 20으로 넉 달 만의 극단 공포입니다. 나스닥 관망, 비트코인 매도 유지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101723"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.14 · 나스닥 &amp; 비트코인 5분 요약 · 토요일판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#fca5a5">PPI 전년비 6.5% · 10년물 5.13% · 나스닥 -0.9% (25,136) · BTC 장중 67,555 — 200주선 공방</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 검토선 이탈</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#a5b4fc">25,136</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">검토선 25,253 아래</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">나스닥 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">증액 보류 · 엔비디아 대기</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 극단 공포 20</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#06b6d4" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#22d3ee">67,555</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a5f3fc">200주선 장중 하회</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">비트코인 매도</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">역발상 격상 하루 전</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">심리: 주식 39 (공포) · 코인 20 (극단 공포) — 일요일 주간 마감 68,000달러가 판정</text>
</svg>
