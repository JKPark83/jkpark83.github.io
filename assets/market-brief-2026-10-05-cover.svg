<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="비트코인이 토요일 8만4,871달러에서 일요일 8만5,417달러로 올라 8만5,000달러 돌파선을 되찾았고, 코인 심리는 탐욕 64로 사흘 연속 식었으며 주식 심리는 공포 31에 머물러 있는 월요일 아침 브리핑 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.10.05 · 나스닥 &amp; 비트코인 5분 요약 · 월요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#a5b4fc">하루 만에 8만5,000달러를 되찾았습니다 — 되돌림 시험은 '재시험'에 들어갑니다</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주말 사이 달라진 것</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#4ade80">$85,417</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">BTC · 돌파선 위로 복귀</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#a5b4fc">청산 無</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">일요일 · 조용한 회복</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">계속 식는 탐욕</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#facc15">77→68→64</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">코인 심리 · 사흘 냉각</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#f59e0b" opacity="0.16"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#fbbf24">관망 / 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fde68a">나스닥 · 암호화폐</text>
  </g>
</svg>
