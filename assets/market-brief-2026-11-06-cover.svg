  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.06 · 나스닥 &amp; 비트코인 5분 요약 · 금요일 아침판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#fda4af">AI 규제 공포 — 나스닥 -5.52% 조정 진입 · 코스피 -5.28% · BTC 76,000달러</text>

  <g transform="translate(90,280)">
