<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif">
  <rect width="820" height="400" fill="#f8fafc"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">오픈소스 비교 — 학습 스택 vs 실행 스택</text>
  <text x="30" y="55" font-size="12" fill="#64748b">별점은 표기하지 않음 (이 세션에서 GitHub API 미검증) · 검증된 속성만 비교</text>

  <!-- Molt card -->
  <rect x="30" y="76" width="370" height="296" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="50" y="106" font-size="16" font-weight="700" fill="#7c3aed">Molt</text>
  <text x="50" y="126" font-size="11" fill="#64748b">NVIDIA-NeMo/labs-molt · Python/PyTorch</text>
  <line x1="50" y1="138" x2="380" y2="138" stroke="#ede9fe"/>
  <text x="50" y="164" font-size="12" fill="#0f172a">역할: agentic RL <tspan font-weight="700">학습</tspan> 프레임워크</text>
  <text x="50" y="190" font-size="12" fill="#0f172a">특징: ~9.2K LOC RL 코어, 통째로 읽힘</text>
  <text x="50" y="216" font-size="12" fill="#0f172a">스택: vLLM 롤아웃 + FSDP2, Ray 배치</text>
  <text x="50" y="242" font-size="12" fill="#0f172a">규모: 1T-class MoE까지 스케일</text>
  <text x="50" y="268" font-size="12" fill="#0f172a">공개: 2026-07-22 (arXiv 2607.21653)</text>
  <rect x="50" y="290" width="330" height="60" rx="8" fill="#f5f3ff"/>
  <text x="62" y="312" font-size="11.5" fill="#5b21b6">🎯 에이전트 정책을 직접 RL로 튜닝하려는</text>
  <text x="62" y="330" font-size="11.5" fill="#5b21b6">팀. 온-폴리시, 자기가 만든 토큰만 학습.</text>

  <!-- ScaleCUA card -->
  <rect x="420" y="76" width="370" height="296" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="106" font-size="16" font-weight="700" fill="#0d9488">ScaleCUA</text>
  <text x="440" y="126" font-size="11" fill="#64748b">OpenGVLab/ScaleCUA · Python</text>
  <line x1="440" y1="138" x2="770" y2="138" stroke="#ccfbf1"/>
  <text x="440" y="164" font-size="12" fill="#0f172a">역할: 컴퓨터유즈(GUI) <tspan font-weight="700">실행</tspan> 에이전트</text>
  <text x="440" y="190" font-size="12" fill="#0f172a">플랫폼: Windows/macOS/Ubuntu/Android</text>
  <text x="440" y="216" font-size="12" fill="#0f172a">구성: 모델+SFT 코드+데이터셋+평가</text>
  <text x="440" y="242" font-size="12" fill="#0f172a">벤치: OSWorld-G 60.6, WebArena-Lite-v2 47.4</text>
  <text x="440" y="268" font-size="12" fill="#0f172a">공개: ICLR 2026 Oral, 전부 오픈</text>
  <rect x="440" y="290" width="330" height="60" rx="8" fill="#f0fdfa"/>
  <text x="452" y="312" font-size="11.5" fill="#0f766e">🎯 데스크톱/브라우저를 조작하는 에이전트를</text>
  <text x="452" y="330" font-size="11.5" fill="#0f766e">직접 학습·평가하려는 팀의 출발점.</text>
</svg>
