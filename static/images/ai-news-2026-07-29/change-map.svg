  <text x="466" y="138" fill="#d6deea" font-size="12">MCP 2026-07-28 파이널 스펙</text>
  <text x="466" y="157" fill="#d6deea" font-size="12">stateless·req/resp·OAuth/OIDC</text>
  <text x="466" y="176" fill="#9fb0c7" font-size="12">Claude memory beta + Agent 하드닝</text>

  <!-- 오픈소스 -->
  <rect x="40" y="352" width="270" height="96" rx="12" fill="#161d2e" stroke="#d9a441" stroke-width="1.5"/>
  <text x="56" y="376" fill="#d9a441" font-size="13" font-weight="700">🛠 오픈소스</text>
  <text x="56" y="398" fill="#d6deea" font-size="12">mem0 — 지속 메모리 레이어 ~61.9k★</text>
  <text x="56" y="417" fill="#d6deea" font-size="12">mcp-scan — 툴 포이즌 스캐너 ~2k★</text>
  <text x="56" y="436" fill="#9fb0c7" font-size="12">저장하는 것 = 지켜야 하는 것</text>

  <!-- 팁 -->
  <rect x="450" y="352" width="270" height="96" rx="12" fill="#161d2e" stroke="#8a7ff0" stroke-width="1.5"/>
  <text x="466" y="376" fill="#8a7ff0" font-size="13" font-weight="700">🧑‍💻 실전 팁</text>
