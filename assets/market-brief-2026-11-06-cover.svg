<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="금요일 아침 브리핑 표지. AI 규제 공포에 나스닥은 5.52% 급락해 조정 국면에 들어갔고, 비트코인은 76,000달러선까지 밀렸습니다. 코스피도 5.28% 폭락했습니다. 어제 적어둔 무효화 조건이 발동돼 나스닥 1차 매수분은 손절 후 관망, 비트코인은 매도로 복귀합니다">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1017"/>
