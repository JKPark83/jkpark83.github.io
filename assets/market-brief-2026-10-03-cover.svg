  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">나스닥 27,190(+1.19%) · S&amp;P500 7,722(+0.73%) · 10년물 5.252%(되오름) · 10월 인상 확률 17%</text>
