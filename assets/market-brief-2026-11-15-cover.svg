<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="일요일 아침 브리핑 표지. 주말에도 암호화폐 매도가 이어져 비트코인은 65,000달러 안팎까지 밀렸고 일주일 하락률은 14퍼센트입니다. 코인 공포탐욕지수는 13으로 5개월 최저, 이틀 연속 극단 공포입니다. 약속한 역발상 격상을 실행해 비트코인은 매도에서 관망으로 바꿉니다. 나스닥은 주말 휴장 속 관망 유지, 화요일 엔비디아 실적이 관문입니다">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101723"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.15 · 나스닥 &amp; 비트코인 5분 요약 · 일요일판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#fca5a5">BTC 65,000 안팎 · 주간 -14% · 코인 심리 13 (5개월 최저) — 이틀 연속 극단 공포, 격상 조건 충족</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 주말 휴장</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#a5b4fc">25,136</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">금요일 종가 · 검토선 아래</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">나스닥 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">화요일 엔비디아 대기</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 극단 공포 13</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#06b6d4" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#22d3ee">65,000</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a5f3fc">주말 저점 경신 · 주간 -14%</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#eab308" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#facc15">비트코인 관망</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fef08a">매도 → 관망 격상 실행</text>
  </g>

  <text x="80" y="560" font-family="sans-serif" font-size="18" fill="#64748b">심리: 주식 39 (공포) · 코인 13 (극단 공포 이틀째) — 오늘 밤 주간 캔들 마감이 다음 판정</text>
</svg>
