<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A2A 프로토콜을 나타낸 그림. 가운데 오케스트레이터 에이전트가 A2A(수평)로 항공권·호텔·환율 세 원격 에이전트와 대화하고, 각 에이전트는 MCP(수직)로 자기 도구와 데이터에 연결된다. MCP는 에이전트를 도구에 잇는 수직 축, A2A는 에이전트를 에이전트에 잇는 수평 축이라는 2계층 구조를 보여 준다.">
  <defs>
    <linearGradient id="a2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <linearGradient id="a2h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="a2ah" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#38bdf8"/></marker>
    <marker id="a2av" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1200" height="630" fill="url(#a2bg)"/>

  <!-- title -->
  <text x="80" y="96" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="52" font-weight="800">A2A 프로토콜</text>
  <text x="80" y="146" fill="#93c5fd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="600">에이전트끼리 협업하게 만드는 표준</text>
  <text x="80" y="185" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="500">MCP는 에이전트를 &#39;도구&#39;에 잇고, A2A는 에이전트를 &#39;에이전트&#39;에 잇는다</text>

  <!-- horizontal A2A axis label -->
  <text x="600" y="268" fill="#38bdf8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="800" text-anchor="middle">← A2A (수평) 에이전트 ↔ 에이전트 →</text>

  <!-- orchestrator -->
  <rect x="500" y="288" width="200" height="72" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="2.5"/>
  <text x="600" y="322" fill="#c7d2fe" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">오케스트레이터</text>
  <text x="600" y="346" fill="#818cf8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Client Agent</text>

  <!-- peer agents -->
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="120" y="292" width="180" height="64" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="210" y="320" fill="#a5f3fc" font-size="18" font-weight="800" text-anchor="middle">✈️ 항공권 에이전트</text>
    <text x="210" y="342" fill="#5eead4" font-size="13" font-weight="600" text-anchor="middle">Remote Agent</text>

    <rect x="900" y="292" width="180" height="64" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="990" y="320" fill="#a5f3fc" font-size="18" font-weight="800" text-anchor="middle">🏨 호텔 에이전트</text>
    <text x="990" y="342" fill="#5eead4" font-size="13" font-weight="600" text-anchor="middle">Remote Agent</text>

    <rect x="510" y="470" width="180" height="64" rx="14" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="600" y="498" fill="#a5f3fc" font-size="18" font-weight="800" text-anchor="middle">💱 환율 에이전트</text>
    <text x="600" y="520" fill="#5eead4" font-size="13" font-weight="600" text-anchor="middle">Remote Agent</text>
  </g>

  <!-- A2A links (horizontal) -->
  <path d="M498 324 H302" stroke="url(#a2h)" stroke-width="3" fill="none" marker-end="url(#a2ah)"/>
  <path d="M702 324 H898" stroke="url(#a2h)" stroke-width="3" fill="none" marker-end="url(#a2ah)"/>
  <path d="M600 362 V468" stroke="url(#a2h)" stroke-width="3" fill="none" marker-end="url(#a2ah)"/>

  <!-- MCP vertical links to tools -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <!-- flight agent tools -->
    <path d="M175 356 V404" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#a2av)"/>
    <path d="M245 356 V404" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#a2av)"/>
    <rect x="132" y="408" width="72" height="30" rx="7" fill="#111a2e" stroke="#475569" stroke-width="1.3"/>
    <text x="168" y="428" fill="#cbd5e1">GDS API</text>
    <rect x="214" y="408" width="72" height="30" rx="7" fill="#111a2e" stroke="#475569" stroke-width="1.3"/>
    <text x="250" y="428" fill="#cbd5e1">좌석 DB</text>
    <text x="210" y="392" fill="#94a3b8" font-size="12.5" font-weight="800">↓ MCP (수직)</text>

    <!-- hotel agent tools -->
    <path d="M955 356 V404" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#a2av)"/>
    <path d="M1025 356 V404" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#a2av)"/>
    <rect x="912" y="408" width="72" height="30" rx="7" fill="#111a2e" stroke="#475569" stroke-width="1.3"/>
    <text x="948" y="428" fill="#cbd5e1">재고 API</text>
    <rect x="994" y="408" width="72" height="30" rx="7" fill="#111a2e" stroke="#475569" stroke-width="1.3"/>
    <text x="1030" y="428" fill="#cbd5e1">결제</text>
    <text x="990" y="392" fill="#94a3b8" font-size="12.5" font-weight="800">↓ MCP (수직)</text>
  </g>

  <text x="80" y="600" fill="#475569" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600">Agent Card · Task · Message · Artifact — JSON-RPC 2.0 over HTTP(S)</text>
</svg>
