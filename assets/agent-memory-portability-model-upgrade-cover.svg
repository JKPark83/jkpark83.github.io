<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="모델을 v1에서 v2로 업그레이드할 때 에이전트 메모리 스토어가 어떻게 되는지 그린 그림. 고정 스키마 지식 그래프는 온전히 이사하지만, 모델이 압축한 노트는 금이 가고, 구버전 임베딩 벡터는 새 모델의 질의와 어긋난다">
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <marker id="mp-car1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#mp-bg)"/>

  <text x="60" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#e2e8f0">모델은 업그레이드했는데, 기억은 이사를 못 갔다</text>
  <text x="60" y="122" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" fill="#94a3b8">에이전트 메모리 이식성(memory portability) 엔지니어링</text>

  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <!-- 모델 v1 -->
    <rect x="80" y="210" width="220" height="90" rx="14" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <text x="190" y="248" text-anchor="middle" font-size="24" font-weight="700" fill="#94a3b8">모델 v1</text>
    <text x="190" y="278" text-anchor="middle" font-size="15" fill="#64748b">기억을 쓴(writer) 모델</text>

    <!-- 업그레이드 화살표 -->
    <line x1="310" y1="255" x2="440" y2="255" stroke="#a5b4fc" stroke-width="3" marker-end="url(#mp-car1)"/>
    <text x="375" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#a5b4fc">업그레이드</text>

    <!-- 모델 v2 -->
    <rect x="450" y="210" width="220" height="90" rx="14" fill="rgba(165,180,252,.12)" stroke="#a5b4fc" stroke-width="2.5"/>
    <text x="560" y="248" text-anchor="middle" font-size="24" font-weight="700" fill="#c7d2fe">모델 v2</text>
    <text x="560" y="278" text-anchor="middle" font-size="15" fill="#a5b4fc">기억을 읽을(reader) 모델</text>

    <!-- 메모리 스토어 -->
    <rect x="760" y="170" width="380" height="380" rx="18" fill="rgba(148,163,184,.07)" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="950" y="205" text-anchor="middle" font-size="19" font-weight="700" fill="#cbd5e1">메모리 스토어 (모델 밖의 상태)</text>

    <!-- KG: 온전 -->
    <rect x="790" y="230" width="320" height="80" rx="12" fill="rgba(74,222,128,.12)" stroke="#4ade80" stroke-width="2.5"/>
    <text x="810" y="264" font-size="17" font-weight="700" fill="#4ade80">고정 스키마 그래프 (KG-fixed)</text>
    <text x="810" y="292" font-size="15" fill="#86efac">Δ정확도 ≈ 0 — 그대로 이사 완료</text>

    <!-- NOTES: 금 감 -->
    <rect x="790" y="330" width="320" height="80" rx="12" fill="rgba(251,113,133,.10)" stroke="#fb7185" stroke-width="2.5"/>
    <path d="M900,330 L880,362 L905,378 L885,410" fill="none" stroke="#fb7185" stroke-width="2.5"/>
    <text x="925" y="364" font-size="17" font-weight="700" fill="#fb7185">모델이 압축한 노트 (NOTES)</text>
    <text x="925" y="392" font-size="15" fill="#fda4af">±10pp대 비대칭 요동</text>

    <!-- 벡터: 어긋남 -->
    <rect x="790" y="430" width="320" height="80" rx="12" fill="rgba(251,191,36,.10)" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="810" y="464" font-size="17" font-weight="700" fill="#fbbf24">구버전 임베딩 벡터 (v1.0)</text>
    <text x="810" y="492" font-size="15" fill="#fde68a">같은 차원, 다른 공간 — 검색이 어긋남</text>

    <!-- 읽기 화살표 -->
    <line x1="680" y1="255" x2="750" y2="300" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#mp-car1)"/>
  </g>

  <text x="60" y="560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" fill="#818cf8">arXiv:2609.05339 — 기억은 모델 밖에 있어도, 모델의 언어로 쓰여 있다</text>
</svg>
