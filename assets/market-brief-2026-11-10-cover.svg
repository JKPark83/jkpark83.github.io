<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="화요일 아침 브리핑 표지. 유가가 급락하자 나스닥이 하루 만에 2.74% 올라 조정 구간을 벗어났고, 재진입 조건이 충족돼 1차 분할 매수를 실행합니다. 엔비디아는 CEO 조사로 4.3% 내렸습니다. 비트코인은 주간 캔들을 74,851달러에 마감하며 5주 연속 하락을 확정했고 랠리에서 소외됐습니다. 오늘 밤 CPI가 다음 관문입니다. 나스닥 매수, 비트코인 매도 유지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101723"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mbcov-bg)"/>
  <text x="80" y="120" font-family="sans-serif" font-size="44" font-weight="700" fill="#e2e8f0">마켓 브리핑</text>
  <text x="80" y="168" font-family="sans-serif" font-size="22" fill="#94a3b8">2026.11.10 · 나스닥 &amp; 비트코인 5분 요약 · 화요일판</text>
  <text x="80" y="210" font-family="sans-serif" font-size="20" fill="#fdba74">나스닥 +2.74% 조정 탈출 · 엔비디아 -4.3% CEO 조사 · BTC 5주 연속 하락 확정 · 오늘 밤 CPI</text>

  <g transform="translate(90,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">주식 — 조건 충족, 실행</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#6366f1" opacity="0.16"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#a5b4fc">25,253</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#c7d2fe">이틀 연속 24,300 위</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#22c55e" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#4ade80">나스닥 매수</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#bbf7d0">1차 분할 · 최소 규모</text>
  </g>

  <g transform="translate(620,280)">
    <text x="220" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">코인 — 랠리 소외</text>
    <rect x="30" y="40" width="180" height="150" rx="10" fill="#06b6d4" opacity="0.14"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#22d3ee">74,851</text>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a5f3fc">5주 연속 하락 확정</text>
    <rect x="240" y="40" width="180" height="150" rx="10" fill="#ef4444" opacity="0.18"/>
    <text x="330" y="100" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#f87171">비트코인 매도</text>
    <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fecaca">유출 중단 전까지 유지</text>
  </g>

  <text x="80" y="580" font-family="sans-serif" font-size="16" fill="#64748b">본 글은 정보 제공 목적이며 투자 자문이 아닙니다</text>
</svg>
