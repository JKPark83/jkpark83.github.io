  <!-- connector -->
  <line x1="400" y1="246" x2="400" y2="262" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="470" text-anchor="middle" font-size="12.5" fill="#666">공통 흐름: 툴 콜 가드레일이 "실패 시 허용"에서 "실패 시 차단(fail-closed)"으로</text>
