  <text x="430" y="290" font-size="15" font-weight="700" fill="#6a3a9c">🧑‍💻 도구 / 팁</text>
  <text x="430" y="318" font-size="14" font-weight="600" fill="#222">Codex — Guardian 거부 재심 (opt-in)</text>
