<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="460" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">오늘의 AI 변화 지도 — 2026-08-30</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="13">테마: 스킬 공급망 — 스스로 만들고, 검사하고, 실행 권한을 나눈다</text>

  <!-- center node -->
  <rect x="300" y="200" width="200" height="60" rx="10" fill="#7c3aed"/>
  <text x="400" y="226" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">스킬 공급망</text>
  <text x="400" y="246" text-anchor="middle" fill="#ddd6fe" font-size="12">생성 → 스캔 → 런타임 통제</text>

  <!-- links -->
  <line x1="300" y1="215" x2="215" y2="140" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="215" x2="585" y2="140" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="250" x2="215" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="500" y1="250" x2="585" y2="330" stroke="#475569" stroke-width="2"/>

  <!-- quadrant: open source -->
  <rect x="40" y="80" width="230" height="105" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="155" y="103" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">오픈소스</text>
  <text x="155" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">NVIDIA SkillSpector — 스킬 스캐너</text>
  <text x="155" y="146" text-anchor="middle" fill="#e2e8f0" font-size="12">Nous hermes-agent — 자가 개선 스킬</text>
  <text x="155" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">71개 취약 패턴 · agentskills.io 표준</text>

  <!-- quadrant: papers -->
  <rect x="530" y="80" width="230" height="105" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="645" y="103" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">논문 (8/27)</text>
  <text x="645" y="126" text-anchor="middle" fill="#e2e8f0" font-size="12">SARA — 도구 출력≠명령, ASR 0.63%</text>
  <text x="645" y="146" text-anchor="middle" fill="#e2e8f0" font-size="12">SWE-Prime — 데이터 10%로 더 좋게</text>
  <text x="645" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">유도/승인 분리 · SFT 데이터 선별</text>

  <!-- quadrant: tools -->
  <rect x="40" y="285" width="230" height="105" rx="10" fill="#1e293b" stroke="#fbbf24"/>
  <text x="155" y="308" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">도구 릴리즈</text>
  <text x="155" y="331" text-anchor="middle" fill="#e2e8f0" font-size="12">Claude Code 2.1.251 (8/28)</text>
  <text x="155" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">모델 전환 훅 · 캐시 지표 · 보안 수정</text>
  <text x="155" y="371" text-anchor="middle" fill="#94a3b8" font-size="11">Codex /import — CC/Cursor 이전</text>

  <!-- quadrant: adoption -->
  <rect x="530" y="285" width="230" height="105" rx="10" fill="#1e293b" stroke="#f87171"/>
  <text x="645" y="308" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold">조사 · 현장</text>
  <text x="645" y="331" text-anchor="middle" fill="#e2e8f0" font-size="12">Temporal 개발 실태 보고서</text>
  <text x="645" y="351" text-anchor="middle" fill="#e2e8f0" font-size="12">에이전트 일상 사용 47.3% → 80.8%</text>
  <text x="645" y="371" text-anchor="middle" fill="#94a3b8" font-size="11">550+ 엔지니어 · 미국/영국</text>

  <text x="400" y="435" text-anchor="middle" fill="#64748b" font-size="11">에이전트가 스킬을 스스로 만들기 시작하면, 설치 전 스캔과 런타임 권한 분리가 기본기가 된다</text>
</svg>
