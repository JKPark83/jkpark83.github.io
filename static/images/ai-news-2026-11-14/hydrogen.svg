<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Gemini 4 Hydrogen — 벤치마크와 가격 (출처: Google 발표치)</text>

  <!-- Left: Terminal-Bench 4.1 -->
  <rect x="24" y="56" width="360" height="310" rx="10" fill="#1e293b"/>
  <text x="204" y="84" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Terminal-Bench 4.1 (%)</text>
  <!-- axis baseline at y=320, max 60% => 4px per % -->
  <line x1="60" y1="320" x2="350" y2="320" stroke="#475569" stroke-width="1"/>
  <!-- Flash 18.2% -> h=72.8 -->
  <rect x="100" y="247" width="80" height="73" fill="#64748b" rx="3"/>
  <text x="140" y="237" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700">18.2</text>
  <text x="140" y="342" text-anchor="middle" fill="#94a3b8" font-size="12">Gemini 3.8 Flash</text>
  <!-- Hydrogen 57% -> h=228 -->
  <rect x="230" y="92" width="80" height="228" fill="#3b82f6" rx="3"/>
  <text x="270" y="82" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">57.0</text>
  <text x="270" y="342" text-anchor="middle" fill="#94a3b8" font-size="12">Gemini 4 Hydrogen</text>
  <text x="204" y="364" text-anchor="middle" fill="#facc15" font-size="11">같은 벤치에서 3배 이상 — 단, Google 자체 측정</text>

  <!-- Right: pricing -->
  <rect x="408" y="56" width="368" height="310" rx="10" fill="#1e293b"/>
  <text x="592" y="84" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">가격 ($ / 1M 토큰, 입력·출력)</text>
  <!-- scale: $1 = 28px, baseline y=320, max 7.5 => 210px -->
  <line x1="440" y1="320" x2="750" y2="320" stroke="#475569" stroke-width="1"/>
  <!-- Flash now: in 0.75 (21px), out 3.75 (105px) -->
  <rect x="452" y="299" width="30" height="21" fill="#64748b" rx="2"/>
  <rect x="486" y="215" width="30" height="105" fill="#94a3b8" rx="2"/>
  <text x="484" y="203" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">0.75 / 3.75</text>
  <text x="484" y="342" text-anchor="middle" fill="#94a3b8" font-size="11">3.8 Flash 현재</text>
  <text x="484" y="357" text-anchor="middle" fill="#64748b" font-size="10">(12/31까지)</text>
  <!-- Flash 2027: in 1.50 (42px), out 7.50 (210px) -->
  <rect x="556" y="278" width="30" height="42" fill="#64748b" rx="2"/>
  <rect x="590" y="110" width="30" height="210" fill="#94a3b8" rx="2"/>
  <text x="588" y="98" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">1.50 / 7.50</text>
  <text x="588" y="342" text-anchor="middle" fill="#94a3b8" font-size="11">3.8 Flash 2027~</text>
  <text x="588" y="357" text-anchor="middle" fill="#64748b" font-size="10">(1/1 인상)</text>
  <!-- Hydrogen: in 1.50 (42px), out 7.50 (210px) -->
  <rect x="660" y="278" width="30" height="42" fill="#3b82f6" rx="2"/>
  <rect x="694" y="110" width="30" height="210" fill="#60a5fa" rx="2"/>
  <text x="692" y="98" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">1.50 / 7.50</text>
  <text x="692" y="342" text-anchor="middle" fill="#94a3b8" font-size="11">Hydrogen</text>
  <text x="692" y="357" text-anchor="middle" fill="#64748b" font-size="10">(1M ctx 균일가)</text>
</svg>
