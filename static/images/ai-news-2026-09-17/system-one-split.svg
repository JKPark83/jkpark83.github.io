<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="840" height="520" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Agent Builder 시사점 — 판단 계층과 생성 계층의 분리</text>
  <text x="420" y="54" text-anchor="middle" font-size="12" fill="#6b7280">에이전트 루프 속 LLM 호출을 뜯어보면 절반 이상이 "판단"이다</text>

  <!-- input -->
  <rect x="40" y="120" width="150" height="64" rx="10" fill="#111827"/>
  <text x="115" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">사용자 요청 /</text>
  <text x="115" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">이벤트 · 툴 결과</text>

  <line x1="190" y1="152" x2="250" y2="152" stroke="#9ca3af" stroke-width="2"/>
  <path d="M250 152 l-9 -5 v10 z" fill="#9ca3af"/>

  <!-- decision layer -->
  <rect x="256" y="84" width="250" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="381" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">판단 계층 (System 1)</text>
  <text x="381" y="132" text-anchor="middle" font-size="12" fill="#111827">라우팅 · 분류 · 가드레일 · 스코어링</text>
  <text x="381" y="152" text-anchor="middle" font-size="12" fill="#111827">스키마 기반 구조화 출력 + 확률</text>
  <text x="381" y="176" text-anchor="middle" font-size="11.5" fill="#4b5563">Jev(웨이트리스트) · 소형 분류기 · 로짓 기반 룰</text>
  <text x="381" y="196" text-anchor="middle" font-size="11.5" fill="#4b5563">목표 지연: 수십~수백 ms</text>
  <text x="381" y="216" text-anchor="middle" font-size="11.5" fill="#6b7280">텍스트를 생성하지 않는다</text>

  <line x1="506" y1="152" x2="566" y2="152" stroke="#9ca3af" stroke-width="2"/>
  <path d="M566 152 l-9 -5 v10 z" fill="#9ca3af"/>

  <!-- generation layer -->
  <rect x="572" y="84" width="228" height="150" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="686" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">생성 계층 (System 2)</text>
  <text x="686" y="132" text-anchor="middle" font-size="12" fill="#111827">코드 · 답변 · 계획 생성</text>
  <text x="686" y="152" text-anchor="middle" font-size="12" fill="#111827">프론티어 LLM (토큰 단위 생성)</text>
  <text x="686" y="176" text-anchor="middle" font-size="11.5" fill="#4b5563">판단 계층이 승인한 경로만 호출</text>
  <text x="686" y="196" text-anchor="middle" font-size="11.5" fill="#4b5563">지연: 초 단위 · 비용 지배 항목</text>

  <!-- feedback -->
  <path d="M686 234 v40 h-305 v-40" fill="none" stroke="#d1d5db" stroke-width="2"/>
  <path d="M381 240 l-5 9 h10 z" fill="#d1d5db"/>
  <text x="533" y="292" text-anchor="middle" font-size="11.5" fill="#6b7280">생성 결과를 다시 판단 계층으로 — 품질 스코어링 · 재시도 결정</text>

  <!-- bottom: where decisions hide -->
  <rect x="40" y="330" width="760" height="150" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="56" y="356" font-size="13" font-weight="700" fill="#111827">에이전트 루프에서 "판단"으로 분리할 수 있는 호출들</text>
  <rect x="56" y="374" width="170" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="141" y="399" text-anchor="middle" font-size="11.5" fill="#1e40af">어느 서브에이전트로 라우팅?</text>
  <rect x="238" y="374" width="170" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="323" y="399" text-anchor="middle" font-size="11.5" fill="#1e40af">이 툴 호출, 승인 필요한가?</text>
  <rect x="420" y="374" width="170" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="505" y="399" text-anchor="middle" font-size="11.5" fill="#1e40af">검색 결과 관련성 스코어</text>
  <rect x="602" y="374" width="182" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="693" y="399" text-anchor="middle" font-size="11.5" fill="#1e40af">완료 판정 · 재시도 여부</text>
  <text x="56" y="446" font-size="11.5" fill="#6b7280">이 네 가지가 프론티어 LLM 호출로 남아 있다면, 지연과 비용 모두에서 손해를 보고 있을 가능성이 크다.</text>
  <text x="56" y="464" font-size="11" fill="#9ca3af">Jev의 속도·가격 수치는 TypeSafe AI 자체 발표 기준이며, 독립 검증 전이다.</text>
</svg>
