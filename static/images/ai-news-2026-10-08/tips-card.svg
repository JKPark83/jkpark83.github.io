<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="300" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">오늘의 실전 팁 — 끊기와 내리기</text>

  <!-- Codex -->
  <rect x="30" y="52" width="360" height="200" rx="12" fill="#eefbf2" stroke="#34a765" stroke-width="1.5"/>
  <text x="50" y="80" font-size="14" font-weight="700" fill="#15803d">🟩 Codex — 턴을 즉시 끊는다</text>
  <text x="50" y="108" font-size="12.5" fill="#333">instant_interrupt + code_mode_interrupt</text>
  <text x="50" y="126" font-size="12.5" fill="#333">10/7부터 기본 활성화</text>
  <text x="50" y="154" font-size="12.5" fill="#333">· 새 입력이 진행 중인 응답을 선점</text>
  <text x="50" y="174" font-size="12.5" fill="#333">· code mode 셀·중첩 도구 호출 즉시 중단</text>
  <text x="50" y="194" font-size="12.5" fill="#333">· 세션에 저장된 값은 중단 후에도 유지</text>
  <text x="50" y="228" font-size="12" font-weight="700" fill="#15803d">→ 잘못 간 턴은 기다리지 말고 바로 조종</text>

  <!-- Claude Code -->
  <rect x="410" y="52" width="360" height="200" rx="12" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="430" y="80" font-size="14" font-weight="700" fill="#1d4ed8">🟦 Claude Code — 위임 비용을 내린다</text>
  <text x="430" y="108" font-size="12.5" fill="#333">2.1.293: Haiku 5.5가 기본 Haiku 모델로</text>
  <text x="430" y="136" font-size="12.5" fill="#333">· Agent 도구: model: "haiku" 지정</text>
  <text x="430" y="156" font-size="12.5" fill="#333">· effort 파라미터(2.1.292)와 조합</text>
  <text x="430" y="176" font-size="12.5" fill="#333">· 탐색·요약 팬아웃을 1/10 비용으로</text>
  <text x="430" y="228" font-size="12" font-weight="700" fill="#1d4ed8">→ "본체는 크게, 팬아웃은 Haiku로" 재설계 시점</text>

  <text x="400" y="282" text-anchor="middle" font-size="11.5" fill="#999">출처: openai/codex 커밋 #51812·#51835 / anthropics/claude-code CHANGELOG (클론으로 직접 확인)</text>
</svg>
