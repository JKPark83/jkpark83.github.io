<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Gemini 4 Carbon vs Argon — 구글 자체 발표 벤치마크</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6b7280">10/28 발표 · 17개 벤치 중 15개 1위 주장 · 수치는 벤더 자체 보고치</text>

  <!-- legend -->
  <rect x="280" y="68" width="14" height="14" fill="#2563eb"/>
  <text x="300" y="80" font-size="12" fill="#374151">Carbon</text>
  <rect x="370" y="68" width="14" height="14" fill="#cbd5e1"/>
  <text x="390" y="80" font-size="12" fill="#374151">Argon (2주 전 모델)</text>

  <!-- AA Index -->
  <text x="160" y="112" text-anchor="end" font-size="12" fill="#111827">AA Index v5.0</text>
  <rect x="170" y="100" width="325" height="14" fill="#2563eb"/>
  <text x="501" y="112" font-size="11" font-weight="700" fill="#1d4ed8">59</text>
  <rect x="170" y="117" width="275" height="14" fill="#cbd5e1"/>
  <text x="451" y="129" font-size="11" fill="#6b7280">50</text>

  <!-- Terminal-Bench -->
  <text x="160" y="160" text-anchor="end" font-size="12" fill="#111827">Terminal-Bench 4.0</text>
  <rect x="170" y="148" width="359" height="14" fill="#2563eb"/>
  <text x="535" y="160" font-size="11" font-weight="700" fill="#1d4ed8">65.2%</text>
  <rect x="170" y="165" width="314" height="14" fill="#cbd5e1"/>
  <text x="490" y="177" font-size="11" fill="#6b7280">57.1%</text>

  <!-- FrontierSWE -->
  <text x="160" y="208" text-anchor="end" font-size="12" fill="#111827">FrontierSWE</text>
  <rect x="170" y="196" width="337" height="14" fill="#2563eb"/>
  <text x="513" y="208" font-size="11" font-weight="700" fill="#1d4ed8">61.2%</text>
  <rect x="170" y="213" width="303" height="14" fill="#cbd5e1"/>
  <text x="479" y="225" font-size="11" fill="#6b7280">55.0%</text>

  <!-- SWE-sweep -->
  <text x="160" y="256" text-anchor="end" font-size="12" fill="#111827">SWE-sweep</text>
  <rect x="170" y="244" width="53" height="14" fill="#2563eb"/>
  <text x="229" y="256" font-size="11" font-weight="700" fill="#1d4ed8">9.6%</text>
  <rect x="170" y="261" width="24" height="14" fill="#cbd5e1"/>
  <text x="200" y="273" font-size="11" fill="#6b7280">4.3%</text>

  <!-- cyber -->
  <text x="40" y="320" font-size="14" font-weight="700" fill="#b91c1c">사이버 보안 (Carbon, 가드레일 해제 상태 평가)</text>
  <text x="160" y="348" text-anchor="end" font-size="12" fill="#111827">SEC-bench Pro (탐지)</text>
  <rect x="170" y="336" width="485" height="14" fill="#dc2626"/>
  <text x="661" y="348" font-size="11" font-weight="700" fill="#b91c1c">88.2%</text>
  <text x="160" y="376" text-anchor="end" font-size="12" fill="#111827">CWE-bench (패치)</text>
  <rect x="170" y="364" width="391" height="14" fill="#ef4444"/>
  <text x="567" y="376" font-size="11" font-weight="700" fill="#b91c1c">71.0%</text>
  <text x="160" y="404" text-anchor="end" font-size="12" fill="#111827">ExploitGym (익스플로잇)</text>
  <rect x="170" y="392" width="301" height="14" fill="#f87171"/>
  <text x="477" y="404" font-size="11" font-weight="700" fill="#b91c1c">54.8%</text>

  <!-- timeline -->
  <text x="40" y="458" font-size="14" font-weight="700" fill="#111827">롤아웃 타임라인 — 개발자는 언제 쓰나</text>
  <line x1="60" y1="500" x2="740" y2="500" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="110" cy="500" r="6" fill="#cbd5e1"/>
  <text x="110" y="488" text-anchor="middle" font-size="11" fill="#374151">9/30 Argon 방어자 우선</text>
  <circle cx="300" cy="500" r="6" fill="#64748b"/>
  <text x="300" y="488" text-anchor="middle" font-size="11" fill="#374151">10/13 Argon GA (13일 소요)</text>
  <circle cx="520" cy="500" r="7" fill="#2563eb"/>
  <text x="520" y="488" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">10/28 Carbon 방어자 우선</text>
  <circle cx="700" cy="500" r="6" fill="#ffffff" stroke="#2563eb" stroke-dasharray="3 2" stroke-width="2"/>
  <text x="700" y="488" text-anchor="middle" font-size="11" fill="#6b7280">Carbon GA 미정</text>
  <text x="520" y="524" text-anchor="middle" font-size="11" fill="#374151">공개 API 가격(예고): 입력 $2 / 출력 $10 (intro) → 추후 $4 / $20</text>

  <text x="400" y="576" text-anchor="middle" font-size="11" fill="#9ca3af">출처: Google DeepMind 발표를 VentureBeat 등 복수 매체가 보도한 수치 · 독립 검증 아님</text>
</svg>
