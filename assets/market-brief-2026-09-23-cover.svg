<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="비트코인이 8만2,000달러 위 이틀 안착과 ETF 하루 9억9,900만달러 기록 유입으로 매수 전환 조건을 채웠지만, 암호화폐 공포·탐욕 지수가 78로 1년여 만의 극단적 탐욕에 진입했고 금요일 166억달러 옵션 만기를 앞두고 있어 관망을 유지한다는 것을 나타낸 표지">
  <defs>
    <linearGradient id="mbcov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
