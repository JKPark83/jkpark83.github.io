<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="800" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Uno — 디퓨전을 붙여 AR 모델을 무손실 가속</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 기존 방식 -->
  <rect x="30" y="60" width="360" height="130" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="50" y="86" font-size="14" font-weight="700" fill="#b91c1c">기존: 순차 AR 디코딩</text>
  <g font-size="12" fill="#0f172a">
    <rect x="50" y="100" width="46" height="28" rx="5" fill="#ffffff" stroke="#fca5a5"/><text x="73" y="118" text-anchor="middle">t1</text>
    <rect x="116" y="100" width="46" height="28" rx="5" fill="#ffffff" stroke="#fca5a5"/><text x="139" y="118" text-anchor="middle">t2</text>
    <rect x="182" y="100" width="46" height="28" rx="5" fill="#ffffff" stroke="#fca5a5"/><text x="205" y="118" text-anchor="middle">t3</text>
    <rect x="248" y="100" width="46" height="28" rx="5" fill="#ffffff" stroke="#fca5a5"/><text x="271" y="118" text-anchor="middle">t4</text>
  </g>
  <line x1="96" y1="114" x2="114" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="162" y1="114" x2="180" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="228" y1="114" x2="246" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="50" y="160" font-size="11" fill="#475569">토큰을 하나씩 생성 → 지연의 근본 원인</text>
  <text x="50" y="178" font-size="11" fill="#475569">Speculative decoding은 별도 드래프트 모델 필요</text>

  <!-- Uno 방식 -->
  <rect x="410" y="60" width="360" height="130" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="430" y="86" font-size="14" font-weight="700" fill="#15803d">Uno: 디퓨전 가중치로 병렬 드래프트</text>
  <g font-size="12" fill="#0f172a">
    <rect x="430" y="100" width="46" height="28" rx="5" fill="#ffffff" stroke="#86efac"/><text x="453" y="118" text-anchor="middle">t1</text>
    <rect x="486" y="100" width="46" height="28" rx="5" fill="#ffffff" stroke="#86efac"/><text x="509" y="118" text-anchor="middle">t2</text>
    <rect x="542" y="100" width="46" height="28" rx="5" fill="#ffffff" stroke="#86efac"/><text x="565" y="118" text-anchor="middle">t3</text>
    <rect x="598" y="100" width="46" height="28" rx="5" fill="#ffffff" stroke="#86efac"/><text x="621" y="118" text-anchor="middle">t4</text>
  </g>
  <text x="672" y="118" font-size="12" fill="#15803d" font-weight="700">동시 샘플링</text>
  <text x="430" y="160" font-size="11" fill="#475569">Ψ-Spec 샘플러가 AR 분포에서 여러 토큰을 병렬 추출</text>
  <text x="430" y="178" font-size="11" fill="#475569">분포가 동일 → 품질 손실 없음 (lossless)</text>

  <!-- 학습 구조 -->
  <rect x="30" y="210" width="740" height="82" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="50" y="236" font-size="13" font-weight="700" fill="#1d4ed8">가중치 2벌 구조</text>
  <text x="50" y="258" font-size="12" fill="#0f172a">· AR 가중치: 표준 next-token 학습 그대로 · 디퓨전 가중치: 경량 &quot;Diffusion Distillation&quot; 단계로 추가 학습</text>
  <text x="50" y="278" font-size="12" fill="#0f172a">· 기존 오픈웨이트 모델에 사후 부착 가능 — Qwen3-8B, K2-Horizon 0.9B/7B용 체크포인트 공개</text>

  <!-- 결과 -->
  <rect x="30" y="306" width="740" height="72" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="50" y="330" font-size="13" font-weight="700" fill="#b45309">보고된 결과 (논문 초록 기준)</text>
  <text x="50" y="352" font-size="12" fill="#0f172a">· 모든 배치 크기에서 기반 AR 모델 대비 최대 3× 처리량 · 8B Uno가 26B DiffusionGemma·Mercury 2보다 우위</text>
  <text x="50" y="370" font-size="12" fill="#0f172a">· 에이전트 툴 호출·코딩·롱컨텍스트 벤치마크 포함 · speculative decoding 대비 전 배치 구간 처리량 우위</text>
</svg>
