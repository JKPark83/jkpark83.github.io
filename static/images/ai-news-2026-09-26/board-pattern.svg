<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="840" height="440" fill="#fafafa"/>
  <text x="420" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">중앙 오케스트레이터 vs 게시판(Board) 패턴</text>

  <!-- Left: central orchestrator -->
  <rect x="40" y="60" width="360" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="220" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">기존 — 중앙 오케스트레이터</text>
  <rect x="150" y="110" width="140" height="44" rx="8" fill="#fca5a5"/>
  <text x="220" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">오케스트레이터</text>
  <line x1="220" y1="154" x2="110" y2="230" stroke="#f87171" stroke-width="2"/>
  <line x1="220" y1="154" x2="220" y2="230" stroke="#f87171" stroke-width="2"/>
  <line x1="220" y1="154" x2="330" y2="230" stroke="#f87171" stroke-width="2"/>
  <rect x="70" y="230" width="80" height="36" rx="8" fill="#fee2e2"/>
  <text x="110" y="253" text-anchor="middle" font-size="11" fill="#7f1d1d">워커 A</text>
  <rect x="180" y="230" width="80" height="36" rx="8" fill="#fee2e2"/>
  <text x="220" y="253" text-anchor="middle" font-size="11" fill="#7f1d1d">워커 B</text>
  <rect x="290" y="230" width="80" height="36" rx="8" fill="#fee2e2"/>
  <text x="330" y="253" text-anchor="middle" font-size="11" fill="#7f1d1d">워커 C</text>
  <text x="220" y="300" text-anchor="middle" font-size="11" fill="#6b7280">할당·취합이 전부 한 지점을 통과</text>
  <text x="220" y="320" text-anchor="middle" font-size="11" fill="#6b7280">→ 워커 수를 늘릴수록 병목·컨텍스트 포화</text>

  <!-- Right: board -->
  <rect x="440" y="60" width="360" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="620" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Agensh — 공유 게시판·워크스페이스</text>
  <rect x="510" y="110" width="220" height="50" rx="8" fill="#86efac"/>
  <text x="620" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">게시판 + 공유 워크스페이스</text>
  <text x="620" y="149" text-anchor="middle" font-size="10" fill="#166534">태스크 목록 · 발견 사항 · 진행 상태</text>
  <line x1="540" y1="160" x2="510" y2="230" stroke="#4ade80" stroke-width="2"/>
  <line x1="620" y1="160" x2="620" y2="230" stroke="#4ade80" stroke-width="2"/>
  <line x1="700" y1="160" x2="730" y2="230" stroke="#4ade80" stroke-width="2"/>
  <rect x="470" y="230" width="80" height="36" rx="8" fill="#dcfce7"/>
  <text x="510" y="253" text-anchor="middle" font-size="11" fill="#14532d">에이전트 1</text>
  <rect x="580" y="230" width="80" height="36" rx="8" fill="#dcfce7"/>
  <text x="620" y="253" text-anchor="middle" font-size="11" fill="#14532d">에이전트 2</text>
  <rect x="690" y="230" width="80" height="36" rx="8" fill="#dcfce7"/>
  <text x="730" y="253" text-anchor="middle" font-size="11" fill="#14532d">… 1,024</text>
  <text x="620" y="298" text-anchor="middle" font-size="11" fill="#374151">각자 반복: 컨텍스트 수집 → 하위 태스크 클레임</text>
  <text x="620" y="316" text-anchor="middle" font-size="11" fill="#374151">→ 실행 → 발견 사항을 게시판에 공유</text>
  <text x="620" y="344" text-anchor="middle" font-size="10" fill="#6b7280">Codex 저장소에도 agent_message_board 기능 플래그가</text>
  <text x="620" y="360" text-anchor="middle" font-size="10" fill="#6b7280">개발 중(UnderDevelopment, 기본 꺼짐)으로 착륙하는 중</text>

  <text x="420" y="420" text-anchor="middle" font-size="10" fill="#9ca3af">자체 제작 · 구조: Agensh(arXiv 2609.26781) 초록, openai/codex 소스</text>
</svg>
